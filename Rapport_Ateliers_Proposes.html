<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantramour 2027 — Ateliers Proposés</title>
<style>
:root {
  --bg:#ffffff; --surface:#f7f8fa; --border:#e5e7eb;
  --text:#1f2328; --muted:#57606a; --accent:#1d4ed8;
  --success-bg:#dcfce7; --success-border:#86efac; --success-text:#166534;
  --danger-bg:#fee2e2; --danger-border:#fca5a5; --danger-text:#dc2626;
  --warn-bg:#fffbeb; --warn-border:#fcd34d; --warn-text:#b45309;
  --new-bg:#eff6ff; --new-border:#bfdbfe; --new-text:#1d4ed8;
}
.dark {
  --bg:#0d1117; --surface:#161b22; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
  --new-bg:#1e2a3a; --new-border:#1d4ed8; --new-text:#93c5fd;
  --success-bg:#0d2a1a; --success-border:#166534; --success-text:#6ee7b7;
  --danger-bg:#2a0d0d; --danger-border:#dc2626; --danger-text:#fca5a5;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.5; background:var(--bg); color:var(--text); }
.wrap { max-width:1100px; margin:0 auto; padding:24px 20px 80px; }

/* HEADER */
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.logo h1 { font-size:18px; font-weight:700; }
.logo p  { font-size:20px; font-weight:800; color:var(--accent); margin-top:2px; }
.header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* BOUTONS */
.btn { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:7px 14px; font-size:13px; font-weight:600; color:var(--text); font-family:inherit; display:inline-flex; align-items:center; gap:6px; text-decoration:none; transition:background .15s; }
.btn:hover { background:var(--border); }
.btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-primary:hover { opacity:.9; }
.btn-success { background:var(--success-text); color:#fff; border-color:var(--success-text); }
.btn-danger  { background:#dc2626; color:#fff; border-color:#dc2626; }
.btn-sm { padding:4px 10px; font-size:12px; }

/* TABS */
.tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:24px; gap:0; }
.tab { cursor:pointer; padding:10px 20px; font-size:13px; font-weight:600; color:var(--muted); border:none; background:none; border-bottom:3px solid transparent; margin-bottom:-2px; transition:all .15s; font-family:inherit; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }

/* STATS */
.stats-bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.stat-pill { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; }
.stat-pill:hover { border-color:var(--accent); color:var(--accent); }
.stat-pill .n { margin-left:5px; background:var(--border); border-radius:10px; padding:1px 7px; }
.new-pill    { border-color:var(--new-border);     color:var(--new-text);     background:var(--new-bg); }
.approved-pill { border-color:var(--success-border); color:var(--success-text); background:var(--success-bg); }
.rejected-pill { border-color:var(--danger-border);  color:var(--danger-text);  background:var(--danger-bg); }

/* FILTRES */
.filters-bar { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
.fg { display:flex; flex-direction:column; gap:4px; flex:1; min-width:150px; }
.fg label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
.fg input, .fg select { padding:7px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; outline:none; }
.fg input:focus, .fg select:focus { border-color:var(--accent); }

/* TABLEAU */
.table-wrap { overflow-x:auto; border-radius:8px; border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { background:var(--surface); padding:10px 12px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; }
tbody tr { border-bottom:1px solid var(--border); }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:var(--surface); }
tbody td { padding:10px 12px; vertical-align:middle; }
.cell-id   { font-family:monospace; font-size:12px; color:var(--muted); }
.cell-name { font-weight:600; }
.cell-sub  { font-size:12px; color:var(--muted); margin-top:2px; }

/* BADGE */
.badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:700; }
.badge-NEW      { background:var(--new-bg);     color:var(--new-text);     border:1px solid var(--new-border); }
.badge-APPROVED { background:var(--success-bg); color:var(--success-text); border:1px solid var(--success-border); }
.badge-REJECTED { background:var(--danger-bg);  color:var(--danger-text);  border:1px solid var(--danger-border); }

/* MESSAGE VIDE */
.empty-msg { text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; }

/* FORMULAIRE */
.form-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; margin-bottom:20px; }
.form-card h2 { font-size:15px; font-weight:700; margin-bottom:18px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:640px){ .form-grid { grid-template-columns:1fr; } }
.field { display:flex; flex-direction:column; gap:5px; }
.field.span2 { grid-column:1/-1; }
.field label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
.field input, .field select, .field textarea { padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:14px; font-family:inherit; outline:none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); }
.field textarea { resize:vertical; min-height:80px; }
.anim-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
@media(max-width:700px){ .anim-grid { grid-template-columns:1fr 1fr; } }
.dur-row { display:flex; gap:8px; align-items:center; }
.dur-row select { flex:1; }
.help-box { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:6px; padding:12px 16px; margin-bottom:16px; font-size:13px; }
.form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

/* MODALE */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
.modal-overlay.open { display:flex; }
.modal { background:var(--bg); border:1px solid var(--border); border-radius:12px; width:100%; max-width:760px; padding:28px; position:relative; box-shadow:0 8px 40px rgba(0,0,0,.2); }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-header h2 { font-size:16px; font-weight:700; }
.modal-close { cursor:pointer; background:none; border:none; font-size:22px; color:var(--muted); line-height:1; }
.modal-id { font-family:monospace; font-size:12px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 12px; color:var(--muted); margin-bottom:16px; }
.modal-actions { display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; gap:8px; }

/* TOAST */
#toast { position:fixed; bottom:24px; right:24px; border-radius:8px; padding:12px 18px; font-size:13px; font-weight:600; z-index:300; display:none; max-width:420px; box-shadow:0 4px 16px rgba(0,0,0,.15); }
#toast.show { display:block; }
</style>
</head>
<body>
<div class="wrap">

    <div class="logo">
      <h1>Tantramour 2027</h1>
      <p>🌱 Ateliers Proposés</p>
    </div>
    <div class="header-actions">
      <a class="btn" href="index.html">🏠 Accueil</a>

    <div class="filters-bar">

      </div>

        <label>👤 Animateur</label>

      <div class="fg">
        <label>🏷️ Type</label>

        <label>📌 Statut</label>

    <div id="emptyMsg" class="empty-msg" style="display:none">Aucun atelier trouvé.</div>
  </div>

  <div class="tab-pane" id="paneCreate">
    <div class="form-card">

      <div class="form-grid">

        <div class="field">

        </div>
        <div class="field">
          <label>🏷️ Type *</label>
          <select id="c_type"><option value="">— Sélectionner —</option></select>
        </div>
        <div class="field">
          <label>⏱ Durée *</label>
          <div class="dur-row">
            <select id="c_dH"><option value="0">0h</option><option value="1" selected>1h</option><option value="2">2h</option><option value="3">3h</option><option value="4">4h</option><option value="5">5h</option></select>
            <span>h</span>
            <select id="c_dMin"><option value="0">00 min</option><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option></select>
          </div>
        </div>
        <div class="field span2">
          <label>👤 Animateur(s) — jusqu'à 4</label>
          <div class="anim-grid">
            <div><label style="font-size:11px;color:var(--muted)">Animateur 1</label><select id="c_a1"><option value="">— Aucun —</option></select></div>
            <div><label style="font-size:11px;color:var(--muted)">Animateur 2</label><select id="c_a2"><option value="">— Aucun —</option></select></div>
            <div><label style="font-size:11px;color:var(--muted)">Animateur 3</label><select id="c_a3"><option value="">— Aucun —</option></select></div>
            <div><label style="font-size:11px;color:var(--muted)">Animateur 4</label><select id="c_a4"><option value="">— Aucun —</option></select></div>

        </div>

        </div>
        <div class="field">
          <label>🇬🇧 Description anglaise</label>

        </div>
      </div>
      <div class="form-actions">

        <button class="btn btn-primary" onclick="createAtelier()">💾 Enregistrer</button>
      </div>
    </div>
  </div>

</div><!-- /wrap -->

<!-- MODALE ÉDITION -->

    <div class="modal-header">

    <div class="form-grid">

      <div class="field">
        <label>🇬🇧 Nom anglais</label>
        <input type="text" id="e_nomEn" />
      </div>
      <div class="field">
        <label>🏷️ Type *</label>
        <select id="e_type"></select>
      </div>
      <div class="field">
        <label>⏱ Durée *</label>
        <div class="dur-row">
          <select id="e_dH"><option value="0">0h</option><option value="1">1h</option><option value="2">2h</option><option value="3">3h</option><option value="4">4h</option><option value="5">5h</option></select>
          <span>h</span>
          <select id="e_dMin"><option value="0">00 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option></select>
        </div>
      </div>
      <div class="field span2">
        <label>👤 Animateur(s) — jusqu'à 4</label>
        <div class="anim-grid">
          <div><label style="font-size:11px;color:var(--muted)">Animateur 1</label><select id="e_a1"><option value="">— Aucun —</option></select></div>
          <div><label style="font-size:11px;color:var(--muted)">Animateur 2</label><select id="e_a2"><option value="">— Aucun —</option></select></div>
          <div><label style="font-size:11px;color:var(--muted)">Animateur 3</label><select id="e_a3"><option value="">— Aucun —</option></select></div>
          <div><label style="font-size:11px;color:var(--muted)">Animateur 4</label><select id="e_a4"><option value="">— Aucun —</option></select></div>
        </div>
      </div>
      <div class="field">
        <label>🇫🇷 Description française</label>
        <textarea id="e_descFr" rows="4"></textarea>
      </div>
      <div class="field">
        <label>🇬🇧 Description anglaise</label>
        <textarea id="e_descEn" rows="4"></textarea>
      </div>
      <div class="field">
        <label>📌 Statut</label>
        <select id="e_statut">
          <option value="NEW">NEW — En attente</option>
          <option value="APPROVED">APPROVED — Retenu</option>
          <option value="REJECTED">REJECTED — Non retenu</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" onclick="deleteAtelier()">🗑 Supprimer</button>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="closeEdit()">Annuler</button>
        <button class="btn btn-success" onclick="saveEdit()">💾 Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════
     SCRIPTS DE RÉFÉRENCE — chargés synchroniquement dans le body,
     AVANT github-api.js / loader.js / le script principal.
     Pattern identique à Rapport_Editer_Atelier.html.
     bustStaticScripts dans loader.js ne les touche PAS car ils sont
     chargés APRÈS loader.js (il ne peut pas les supprimer).
════════════════════════════════════════════════════════════ -->
<script src="ref_resource_types.js"></script>
<script src="ref_ressources.js"></script>
<script src="ref_types.js"></script>
<script src="github-api.js"></script>
<script src="loader.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════════════

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escJs(v) {
  return JSON.stringify(String(v == null ? '' : v)).slice(1,-1);
}

function fmtDuree(h, m) {
  h = parseInt(h)||0; m = parseInt(m)||0;
  if (!h && !m) return '—';
  return (h ? h+'h' : '') + (m ? m+'min' : '');
}

function animLabel(ids) {
  if (!ids || !ids.length) return '—';
  return ids.filter(Boolean).map(function(id){
    var r = REF_RESSOURCES.find(function(x){ return x.id === id; });
    return r ? r.value : id;
  }).join(', ');
}

function nowISO() { return new Date().toISOString(); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.cssText = 'display:block;background:'+(err?'#fee2e2':'#dcfce7')+
    ';color:'+(err?'#dc2626':'#166534')+';border:1px solid '+(err?'#fca5a5':'#86efac');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.style.display='none'; }, 4000);
}

// ═══════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════

function showTab(name) {
  ['list','create'].forEach(function(t){
    var cap = t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById('tab'+cap).classList.toggle('active', t===name);
    document.getElementById('pane'+cap).classList.toggle('active', t===name);
  });
}

// ═══════════════════════════════════════════════════════════════
// PEUPLEMENT DES SELECTS — appelé une seule fois après loadData
// ═══════════════════════════════════════════════════════════════

function buildAnimOpts() {
  var animateurs = REF_RESSOURCES.filter(function(r){
    return r.roles && r.roles.indexOf('animateur') !== -1;
  }).sort(function(a,b){ return a.value.localeCompare(b.value,'fr'); });

  var opts = animateurs.map(function(r){
    return '<option value="'+esc(r.id)+'">'+esc(r.value)+'</option>';
  }).join('');

  // Selects création
  ['c_a1','c_a2','c_a3','c_a4'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.innerHTML = '<option value="">— Aucun —</option>'+opts;
  });
  // Selects édition
  ['e_a1','e_a2','e_a3','e_a4'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.innerHTML = '<option value="">— Aucun —</option>'+opts;
  });
  // Filtre
  var fEl = document.getElementById('fAnim');
  if (fEl) fEl.innerHTML = '<option value="">Tous</option>'+opts;
}

function buildTypeOpts() {
  var opts = REF_TYPES.map(function(t){
    return '<option value="'+esc(t.value)+'">'+esc(t.label)+'</option>';
  }).join('');
  // Select création
  var ce = document.getElementById('c_type');
  if (ce) ce.innerHTML = '<option value="">— Sélectionner —</option>'+opts;
  // Select édition
  var ee = document.getElementById('e_type');
  if (ee) ee.innerHTML = '<option value="">— Sélectionner —</option>'+opts;
  // Filtre
  var fe = document.getElementById('fType');
  if (fe) fe.innerHTML = '<option value="">Tous les types</option>'+opts;
}

// ═══════════════════════════════════════════════════════════════
// LISTE / RENDU
// ═══════════════════════════════════════════════════════════════

function renderStats() {
  var all = ATELIERS;
  var nN = all.filter(function(a){ return a.statut==='NEW'; }).length;
  var nA = all.filter(function(a){ return a.statut==='APPROVED'; }).length;
  var nR = all.filter(function(a){ return a.statut==='REJECTED'; }).length;
  document.getElementById('statsBar').innerHTML =
    '<span class="stat-pill" onclick="resetFilters()">Tous <span class="n">'+all.length+'</span></span>'+
    '<span class="stat-pill new-pill" onclick="filtreStatut(\'NEW\')">NEW <span class="n">'+nN+'</span></span>'+
    '<span class="stat-pill approved-pill" onclick="filtreStatut(\'APPROVED\')">APPROVED <span class="n">'+nA+'</span></span>'+
    '<span class="stat-pill rejected-pill" onclick="filtreStatut(\'REJECTED\')">REJECTED <span class="n">'+nR+'</span></span>';
}

function filtreStatut(s) {
  document.getElementById('fStatut').value = s;
  renderTable();
}

function resetFilters() {
  ['fSearch','fAnim','fType','fStatut'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  renderTable();
}

function renderTable() {
  var search = document.getElementById('fSearch').value.toLowerCase().trim();
  var fAnim  = document.getElementById('fAnim').value;
  var fType  = document.getElementById('fType').value;
  var fStat  = document.getElementById('fStatut').value;

  var list = ATELIERS.filter(function(a){
    if (search && (a.nomFr||'').toLowerCase().indexOf(search)===-1 &&
                  (a.nomEn||'').toLowerCase().indexOf(search)===-1) return false;
    if (fAnim && (!a.animateurs || a.animateurs.indexOf(fAnim)===-1)) return false;
    if (fType && a.type !== fType) return false;
    if (fStat && a.statut !== fStat) return false;
    return true;
  });

  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('emptyMsg');

  if (!list.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = list.map(function(a){
    return '<tr>'+
      '<td class="cell-id">'+esc(a.id)+'</td>'+
      '<td><div class="cell-name">'+esc(a.nomFr||'—')+'</div>'+
        (a.nomEn ? '<div class="cell-sub">'+esc(a.nomEn)+'</div>' : '')+
      '</td>'+
      '<td style="font-size:12px">'+esc(animLabel(a.animateurs))+'</td>'+
      '<td style="font-size:12px;color:var(--muted)">'+esc(a.type||'—')+'</td>'+
      '<td style="font-size:12px;white-space:nowrap">'+esc(fmtDuree(a.dureeH,a.dureeMin))+'</td>'+
      '<td><span class="badge badge-'+esc(a.statut||'NEW')+'">'+esc(a.statut||'NEW')+'</span></td>'+
      '<td><button class="btn btn-sm" onclick="openEdit(\''+esc(a.id)+'\')">✏️ Éditer</button></td>'+
    '</tr>';
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
// CRÉATION
// ═══════════════════════════════════════════════════════════════

function getAnims(prefix) {
  var ids = [];
  [1,2,3,4].forEach(function(i){
    var el = document.getElementById(prefix+'_a'+i);
    if (el && el.value) ids.push(el.value);
  });
  return ids;
}

function resetCreate() {
  ['c_nomFr','c_nomEn','c_descFr','c_descEn'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('c_type').value = '';
  document.getElementById('c_dH').value   = '1';
  document.getElementById('c_dMin').value = '30';
  ['c_a1','c_a2','c_a3','c_a4'].forEach(function(id){
    document.getElementById(id).value = '';
  });
}

function generateId() {
  var used = new Set(ATELIERS.map(function(a){ return a.id; }));
  for (var i=0; i<1000; i++) {
    var id = 'A_'+(Math.floor(1000+Math.random()*9000));
    if (!used.has(id)) return id;
  }
  return 'A_'+(Date.now()%100000);
}

function createAtelier() {
  var nomFr = document.getElementById('c_nomFr').value.trim();
  var type  = document.getElementById('c_type').value;
  var dH    = parseInt(document.getElementById('c_dH').value)||0;
  var dMin  = parseInt(document.getElementById('c_dMin').value)||0;

  if (!nomFr) { toast('❌ Le nom en français est obligatoire.', true); return; }
  if (!type)  { toast('❌ Veuillez sélectionner un type.', true); return; }
  if (!dH && !dMin) { toast('❌ Veuillez indiquer une durée.', true); return; }

  var now = nowISO();
  ATELIERS.push({
    id:         generateId(),
    nomFr:      nomFr,
    nomEn:      document.getElementById('c_nomEn').value.trim(),
    animateurs: getAnims('c'),
    type:       type,
    dureeH:     dH,
    dureeMin:   dMin,
    descFr:     document.getElementById('c_descFr').value.trim(),
    descEn:     document.getElementById('c_descEn').value.trim(),
    statut:     'NEW',
    createdAt:  now,
    updatedAt:  now
  });

  saveAteliers(function(ok){
    if (ok) {
      toast('✅ Atelier créé — statut NEW');
      resetCreate();
      renderStats();
      renderTable();
      showTab('list');
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// ÉDITION
// ═══════════════════════════════════════════════════════════════

function openEdit(id) {
  var a = ATELIERS.find(function(x){ return x.id===id; });
  if (!a) return;

  document.getElementById('e_id').value          = a.id;
  document.getElementById('e_id_display').textContent = '🔒 ID : ' + a.id;
  document.getElementById('e_nomFr').value        = a.nomFr  || '';
  document.getElementById('e_nomEn').value        = a.nomEn  || '';
  document.getElementById('e_type').value         = a.type   || '';
  document.getElementById('e_dH').value           = String(a.dureeH  || 0);
  document.getElementById('e_dMin').value         = String(a.dureeMin || 0);
  document.getElementById('e_descFr').value       = a.descFr || '';
  document.getElementById('e_descEn').value       = a.descEn || '';
  document.getElementById('e_statut').value       = a.statut || 'NEW';

  var anims = a.animateurs || [];
  [1,2,3,4].forEach(function(i){
    var el = document.getElementById('e_a'+i);
    if (el) el.value = anims[i-1] || '';
  });

  document.getElementById('editOverlay').classList.add('open');
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
}

function saveEdit() {
  var id  = document.getElementById('e_id').value;
  var idx = ATELIERS.findIndex(function(x){ return x.id===id; });
  if (idx===-1) { toast('❌ Atelier introuvable.', true); return; }

  var nomFr = document.getElementById('e_nomFr').value.trim();
  var type  = document.getElementById('e_type').value;
  if (!nomFr) { toast('❌ Le nom en français est obligatoire.', true); return; }
  if (!type)  { toast('❌ Veuillez sélectionner un type.', true); return; }

  ATELIERS[idx].nomFr      = nomFr;
  ATELIERS[idx].nomEn      = document.getElementById('e_nomEn').value.trim();
  ATELIERS[idx].animateurs = getAnims('e');
  ATELIERS[idx].type       = type;
  ATELIERS[idx].dureeH     = parseInt(document.getElementById('e_dH').value)||0;
  ATELIERS[idx].dureeMin   = parseInt(document.getElementById('e_dMin').value)||0;
  ATELIERS[idx].descFr     = document.getElementById('e_descFr').value.trim();
  ATELIERS[idx].descEn     = document.getElementById('e_descEn').value.trim();
  ATELIERS[idx].statut     = document.getElementById('e_statut').value;
  ATELIERS[idx].updatedAt  = nowISO();

  saveAteliers(function(ok){
    if (ok) {
      closeEdit();
      toast('✅ Atelier mis à jour !');
      renderStats();
      renderTable();
    }
  });
}

function deleteAtelier() {
  var id = document.getElementById('e_id').value;
  if (!confirm('Supprimer définitivement l\'atelier ' + id + ' ?')) return;
  var idx = ATELIERS.findIndex(function(x){ return x.id===id; });
  if (idx===-1) return;
  ATELIERS.splice(idx, 1);
  saveAteliers(function(ok){
    if (ok) {
      closeEdit();
      toast('🗑 Atelier supprimé.');
      renderStats();
      renderTable();
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// SAUVEGARDE → Ateliers.js via API GitHub
// ═══════════════════════════════════════════════════════════════

function buildAteliersJs() {
  var header = '/**\n' +
    ' * TANTRAMOUR 2027 — Référentiel : Ateliers Proposés\n' +
    ' * Fichier géré via Rapport_Ateliers_Proposes.html\n' +
    ' */\n' +
    'var ATELIERS = [\n';

  var lines = ATELIERS.map(function(a){
    return '  {id:"'+escJs(a.id)+'",nomFr:"'+escJs(a.nomFr)+'",nomEn:"'+escJs(a.nomEn)+
      '",animateurs:'+JSON.stringify(a.animateurs||[])+
      ',type:"'+escJs(a.type)+'",dureeH:'+(parseInt(a.dureeH)||0)+
      ',dureeMin:'+(parseInt(a.dureeMin)||0)+
      ',descFr:"'+escJs(a.descFr)+'",descEn:"'+escJs(a.descEn)+
      '",statut:"'+escJs(a.statut)+'",createdAt:"'+escJs(a.createdAt)+
      '",updatedAt:"'+escJs(a.updatedAt)+'"}';
  });

  return header + lines.join(',\n') + '\n];\n';
}

function saveAteliers(callback) {
  saveFile('Ateliers.js', buildAteliersJs())
    .then(function(){ if (callback) callback(true); })
    .catch(function(err){
      toast('❌ Erreur sauvegarde : ' + err.message, true);
      if (callback) callback(false);
    });
}
