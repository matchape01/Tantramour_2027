async function saveLogistique() {
  if (selectedIdx === null || selectedIdx === -1) return;
  const a = AGENDA[selectedIdx];
  const ind = document.getElementById('logSaving');
  const btn = document.querySelector('[onclick="saveLogistique()"]');
  if (ind) ind.classList.add('show');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Sauvegarde en cours…'; }

  const today = new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0,5);

  // Générer logisticId si nécessaire
  let logId = editedData.logisticId || a.logisticId;
  if (!logId) {
    const safeName = (a.atelier||'NEW').replace(/[^a-zA-Z0-9]/g,'_').slice(0,30).toUpperCase();
    const jourKey  = (a.jour||'').replace(/\s+/g,'').toUpperCase();
    logId = jourKey + '_' + safeName;
    editedData.logisticId = logId;
    a.logisticId = logId;
  }

  // Lire les RTEs
  const logRte     = document.getElementById('log-rte');
  const logSpecRte = document.getElementById('log-special-rte');
  const avantRte   = document.getElementById('log-helpers-avant');
  const pendantRte = document.getElementById('log-helpers-pendant');
  const apresRte   = document.getElementById('log-helpers-apres');
  const prepEl     = document.getElementById('f-prepDuration');
  const rangeEl    = document.getElementById('f-rangeDuration');

  const logHtml  = logRte     ? logRte.innerHTML.trim()     : '';
  const specHtml = logSpecRte ? logSpecRte.innerHTML.trim() : '';
  const prepDur  = prepEl     ? parseInt(prepEl.value, 10) || 0 : 0;
  const rangeDur = rangeEl    ? parseInt(rangeEl.value, 10) || 0 : 0;

  if (typeof LOG === 'undefined') window.LOG = {};
  LOG[logId] = { html: logHtml, text: logRte ? (logRte.innerText||'').trim() : '',
    validatedByFac: !!(REF_DESCRIPTIONS && findDesc(a.atelier) && findDesc(a.atelier).validatedByFac),
    prepDuration: prepDur, rangeDuration: rangeDur, updatedAt: today };

  if (typeof LOG_SPECIAL === 'undefined') window.LOG_SPECIAL = {};
  LOG_SPECIAL[logId] = { html: specHtml, text: logSpecRte ? (logSpecRte.innerText||'').trim() : '', updatedAt: today };

  // Synchroniser les équipements sélectionnés sur l'entrée AGENDA
  if (editedData._equipements !== undefined) {
    a._equipements = Object.keys(editedData._equipements).length > 0
      ? Object.assign({}, editedData._equipements)
      : undefined;
  }
  // Synchroniser les consignes désactivées sur l'entrée AGENDA
  if (editedData._consignesDisabled !== undefined) {
    a._consignesDisabled = Object.keys(editedData._consignesDisabled).length > 0
      ? Object.assign({}, editedData._consignesDisabled)
      : undefined;
  }
  // Synchroniser les consignes récurrentes sélectionnées sur l'entrée AGENDA
  if (editedData._corecSelected !== undefined) {
    var hasSel = Object.keys(editedData._corecSelected).some(function(pl) {
      return editedData._corecSelected[pl] && editedData._corecSelected[pl].length > 0;
    });
    a._corecSelected = hasSel ? JSON.parse(JSON.stringify(editedData._corecSelected)) : undefined;
  }

  if (typeof LOGISTICS_HELPERS === 'undefined') window.LOGISTICS_HELPERS = {};
  LOGISTICS_HELPERS[logId] = {
    avant:   avantRte   ? avantRte.innerHTML.trim()   : '',
    pendant: pendantRte ? pendantRte.innerHTML.trim()  : '',
    apres:   apresRte   ? apresRte.innerHTML.trim()    : '',
    updatedAt: today
  };

  try {
    await saveFile('logistics.js',         genererLogisticsJs());
    await saveFile('logistics.special.js', genererLogisticsSpecialJs());
    await saveFile('logistics.helpers.js', genererLogisticsHelpersJs());
    await saveFile('data.js',              genererDataJs());
    showToast('✅ Informations logistiques sauvegardées !');
    if (btn) { btn.disabled = false; btn.textContent = '💾 Sauvegarder les infos logistiques'; }
  } catch(err) {
    showToast('❌ ' + err.message, true);
    if (btn) { btn.disabled = false; btn.textContent = '💾 Sauvegarder les infos logistiques'; }
  } finally {
    if (ind) ind.classList.remove('show');
  }
}
window.saveLogistique = saveLogistique;

async function saveUpdate() {
  if (selectedIdx === null) return;
  // Garde-fou : bloquer la sauvegarde si l'atelier est en lecture seule
  if (_isReadOnly) {
    showToast('🔒 Cet atelier est en lecture seule — un autre utilisateur est en train de l\'éditer.', true);
    return;
  }
  const isNew = (selectedIdx === -1);

  const btn = document.getElementById('btnUpdate');
  const ind = document.getElementById('savingIndicator');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Sauvegarde en cours…'; }
  if (ind) ind.classList.add('show');

  const newEntry = Object.assign({}, editedData);

  // Copie profonde des champs imbriqués pour éviter les références partagées
  if (editedData._consignesDisabled) newEntry._consignesDisabled = Object.assign({}, editedData._consignesDisabled);
  if (editedData._corecSelected)     newEntry._corecSelected     = JSON.parse(JSON.stringify(editedData._corecSelected));
  if (editedData._equipements)       newEntry._equipements       = Object.assign({}, editedData._equipements);

  // Synchroniser la date depuis le jour si non remplie
  if (!newEntry.date && newEntry.jour) {
    const ref = REF_JOURS.find(j => j.value === newEntry.jour);
    if (ref) newEntry.date = ref.date;
  }

  const today = new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0,5);

  // ── Synchronisation logistique en mémoire ──
  let logId = newEntry.logisticId;
  if (!logId) {
    const safeName = (newEntry.atelier||'NEW').replace(/[^a-zA-Z0-9]/g,'_').slice(0,30).toUpperCase();
    const jourKey  = (newEntry.jour||'').replace(/\s+/g,'').toUpperCase();
    logId = jourKey + '_' + safeName;
    newEntry.logisticId = logId;
  }

  // Lire les RTEs
  const logRte     = document.getElementById('log-rte');
  const logSpecRte = document.getElementById('log-special-rte');
  const avantRte   = document.getElementById('log-helpers-avant');
  const pendantRte = document.getElementById('log-helpers-pendant');
  const apresRte   = document.getElementById('log-helpers-apres');
  const prepEl     = document.getElementById('f-prepDuration');
  const rangeEl    = document.getElementById('f-rangeDuration');

  const logHtml  = logRte     ? logRte.innerHTML.trim()     : '';
  const specHtml = logSpecRte ? logSpecRte.innerHTML.trim() : '';
  const prepDur  = prepEl     ? parseInt(prepEl.value, 10) || 0 : 0;
  const rangeDur = rangeEl    ? parseInt(rangeEl.value, 10) || 0 : 0;

  if (typeof LOG === 'undefined') window.LOG = {};
  LOG[logId] = {
    html: logHtml,
    text: logRte ? (logRte.innerText||'').trim() : '',
    validatedByFac: !!(REF_DESCRIPTIONS && findDesc(newEntry.atelier) && findDesc(newEntry.atelier).validatedByFac),
    prepDuration: prepDur,
    rangeDuration: rangeDur,
    updatedAt: today
  };

  if (typeof LOG_SPECIAL === 'undefined') window.LOG_SPECIAL = {};
  LOG_SPECIAL[logId] = {
    html: specHtml,
    text: logSpecRte ? (logSpecRte.innerText||'').trim() : '',
    updatedAt: today
  };

  if (typeof LOGISTICS_HELPERS === 'undefined') window.LOGISTICS_HELPERS = {};
  LOGISTICS_HELPERS[logId] = {
    avant:   avantRte   ? avantRte.innerHTML.trim()   : '',
    pendant: pendantRte ? pendantRte.innerHTML.trim()  : '',
    apres:   apresRte   ? apresRte.innerHTML.trim()    : '',
    updatedAt: today
  };

  // Types d'ateliers dont le champ angel est piloté par les shifts
  const TYPES_ANGEL_PILOTES = new Set([
    'ATELIERS TANTRA (Matin)', 'ATELIERS TANTRA (Apres-Midi)',
    'ATELIER ARTISTIQUE (Matin)', 'ATELIER ARTISTIQUE (Apres-Midi)',
    'LOVE TEMPLE', 'TANTRA CAFE & CONFERENCE',
    'SUPPORT EMOTIONNEL', 'CEREMONIE & CONCERT',
    'DJ Set', 'POOL PARTY',
  ]);

  // Pour les ateliers non-SHIFT ANGEL, calculer l'angel depuis le shift ANGEL correspondant.
  // Pour les types non pilotés, on conserve la valeur saisie manuellement dans le formulaire.
  if (newEntry.type !== 'SHIFT ANGEL') {
    if (TYPES_ANGEL_PILOTES.has(newEntry.type)) {
      newEntry.angel = resolveAngelEdit(newEntry.jour, newEntry.heure);
    }
    // Types non pilotés → on garde la valeur de editedData.angel (saisie manuelle)
  }

  // ── Propagation en cascade : si on modifie un SHIFT ANGEL, mettre à jour
  //    le champ angel de tous les ateliers couverts sur le même jour ──────────
  function propagateShiftAngel(shiftEntry) {
    const shiftIv = (function(h) {
      const norm = String(h).replace(/\./g, ':').replace(/[–\u2013\u2014]/g, '-');
      const parts = norm.split(/\s*-+\s*/);
      const s = _parseHM(parts[0]);
      let e = parts[1] ? _parseHM(parts[1]) : null;
      if (s === null) return null;
      if (e !== null && e <= s) e += 1440;
      return { s, e: e ?? s + 180 };
    })(shiftEntry.heure);
    if (!shiftIv) return 0;

    let count = 0;
    AGENDA.forEach(function(entry) {
      if (entry === shiftEntry) return;
      if (entry.jour !== shiftEntry.jour) return;
      if (!TYPES_ANGEL_PILOTES.has(entry.type)) return;
      const norm = String(entry.heure).replace(/\./g, ':').replace(/[–\u2013\u2014]/g, '-');
      const parts = norm.split(/\s*-+\s*/);
      const aStart = _parseHM(parts[0]);
      if (aStart === null) return;
      if (aStart >= shiftIv.s && aStart < shiftIv.e) {
        entry.angel = shiftEntry.angel;
        count++;
      }
    });
    return count;
  }

  // ── Parseur textuel de ref_descriptions.js ───────────────────────────────────
  // Extrait REF_DESCRIPTIONS depuis le texte brut du fichier JS sans eval/new Function.
  // Compatible CSP strict (GitHub Pages).
  // Stratégie : chercher les objets littéraux entre { } dans le tableau REF_DESCRIPTIONS,
  // puis extraire chaque champ clé:valeur avec des regex ciblées.
  function parseRefDescJs(src) {
    // Isoler le contenu entre les crochets du tableau REF_DESCRIPTIONS = [ ... ]
    const arrMatch = src.match(/var\s+REF_DESCRIPTIONS\s*=\s*\[([\s\S]*?)\];/);
    if (!arrMatch) return null;
    const arrSrc = arrMatch[1];

    // Découper en objets individuels : chaque { ... }
    // On utilise un compteur de profondeur pour gérer les accolades imbriquées
    const objects = [];
    let depth = 0, start = -1;
    for (let i = 0; i < arrSrc.length; i++) {
      if (arrSrc[i] === '{') { if (depth === 0) start = i; depth++; }
      else if (arrSrc[i] === '}') {
        depth--;
        if (depth === 0 && start !== -1) { objects.push(arrSrc.slice(start, i + 1)); start = -1; }
      }
    }

    // Pour chaque objet, extraire les champs string et non-string connus
    function extractStr(obj, key) {
      // Supporte : key:"valeur" ou key:"val\"eur" (escapes)
      const m = obj.match(new RegExp(key + '\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
      if (!m) return '';
      // Dés-échapper les séquences \n et \"
      return m[1].replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    }
    function extractBool(obj, key) {
      const m = obj.match(new RegExp(key + '\\s*:\\s*(true|false)'));
      return m ? m[1] === 'true' : false;
    }
    function extractNum(obj, key) {
      const m = obj.match(new RegExp(key + '\\s*:\\s*(\\d+)'));
      return m ? parseInt(m[1], 10) : 0;
    }

    return objects.map(function(obj) {
      return {
        atelierId:      extractStr(obj,  'atelierId'),
        key:            extractStr(obj,  'key'),
        atelier:        extractStr(obj,  'atelier'),
        nomEn:          extractStr(obj,  'nomEn'),
        type:           extractStr(obj,  'type'),
        piment:         extractNum(obj,  'piment'),
        fac1:           extractStr(obj,  'fac1'),
        fac2:           extractStr(obj,  'fac2'),
        descFr:         extractStr(obj,  'descFr'),
        descEn:         extractStr(obj,  'descEn'),
        consigne:       extractStr(obj,  'consigne'),
        consigneEn:     extractStr(obj,  'consigneEn'),
        validatedByFac: extractBool(obj, 'validatedByFac'),
        updatedAt:      extractStr(obj,  'updatedAt'),
      };
    }).filter(function(d) { return d.atelier; }); // ignorer les entrées vides
  }

  // ── Sauvegarder nomEn / consignes dans REF_DESCRIPTIONS si modifiés ─────────
  // Stratégie anti-écrasement collaboratif :
  //   1. Récupérer ref_descriptions.js FRAIS depuis l'API GitHub (jamais le CDN)
  //   2. Parser ce contenu pour obtenir la liste à jour
  //   3. N'appliquer les changements locaux QUE sur l'entrée de l'atelier en cours
  //   4. Sauvegarder la version fusionnée → aucune description d'un autre utilisateur n'est perdue
  async function saveDescIfNeeded() {
    const hasDescChange = editedData._nomEn !== undefined || editedData._descFr !== undefined || editedData._descEn !== undefined || editedData._consigneFr !== undefined || editedData._consigneEn !== undefined;
    if (!hasDescChange) return;

    // ── Étape 1 : récupérer la version fraîche depuis l'API GitHub ──────────
    // On utilise un parseur de texte (regex) pour extraire les entrées de REF_DESCRIPTIONS
    // sans jamais évaluer de code JS (new Function / eval sont bloqués par le CSP GitHub Pages).
    let freshDescriptions = null;
    try {
      const token = localStorage.getItem('tm_gh_token');
      if (token) {
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/ref_descriptions.js?ref=${GITHUB_BRANCH}&_t=${Date.now()}`;
        const res = await fetch(apiUrl, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json', 'If-None-Match': '' },
          cache: 'no-store'
        });
        if (res.ok) {
          const data    = await res.json();
          const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
          // Parseur textuel : extrait chaque objet { ... } de REF_DESCRIPTIONS via JSON.parse
          // après avoir transformé les littéraux JS en JSON valide.
          try {
            freshDescriptions = parseRefDescJs(content);
          } catch(_) { /* parse échoué → on utilise la version en mémoire */ }
        }
      }
    } catch(_) { /* réseau indispo → on utilise la version en mémoire */ }

    // ── Étape 2 : si on a une version fraîche, synchroniser REF_DESCRIPTIONS en mémoire ──
    // On prend TOUTES les entrées fraîches, puis on écrase uniquement celle de l'atelier courant.
    if (freshDescriptions && Array.isArray(freshDescriptions)) {
      // Fusionner par ID d'abord, puis par nom pour les entrées sans ID
      const currentId = newEntry.id || '';
      freshDescriptions.forEach(function(fd) {
        if (currentId && fd.atelierId === currentId) return; // sera géré ci-dessous
        const existing = REF_DESCRIPTIONS.find(function(d) {
          return (fd.atelierId && d.atelierId === fd.atelierId) ||
                 (!fd.atelierId && (d.atelier||'').trim() === (fd.atelier||'').trim());
        });
        if (!existing) {
          REF_DESCRIPTIONS.push(fd);
        } else {
          Object.assign(existing, fd);
        }
      });
    }

    // ── Étape 3 : appliquer les changements locaux — recherche par ID d'abord ──
    const atelierName = newEntry.atelier || '';
    let d = findDesc(atelierName, newEntry.id);
    if (!d) {
      const key = atelierName.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,40);
      d = { atelierId: newEntry.id||'', key, atelier: atelierName, nomEn:'',
            type: newEntry.type||'', piment: newEntry.piment||0,
            fac1: newEntry.fac1||'', fac2: newEntry.fac2||'', descFr:'', descEn:'',
            consigne:'', consigneEn:'', validatedByFac:false, updatedAt:'' };
      REF_DESCRIPTIONS.push(d);
    }
    // Toujours synchroniser l'atelierId et le nom courant
    d.atelierId = newEntry.id || d.atelierId || '';
    d.atelier   = atelierName;
    if (editedData._nomEn      !== undefined) d.nomEn      = editedData._nomEn;
    if (editedData._descFr     !== undefined) d.descFr     = editedData._descFr;
    if (editedData._descEn     !== undefined) d.descEn     = editedData._descEn;
    if (editedData._consigneFr !== undefined) d.consigne   = editedData._consigneFr;
    if (editedData._consigneEn !== undefined) d.consigneEn = editedData._consigneEn;
    d.updatedAt = new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0,5);

    // ── Étape 4 : sauvegarder la version fusionnée ──────────────────────────
    await saveFile('ref_descriptions.js', genererRefDescJs());
  }

  if (isNew) {
    // Ajouter en fin de tableau
    AGENDA.push(newEntry);
    const newIdx = AGENDA.length - 1;
    try {
      // Fusion collaborative : n'écrase que cet atelier dans la version fraîche GitHub
      await mergeAndSaveDataJs([newEntry]);
      await saveDescIfNeeded();
      await saveFile('logistics.js',         genererLogisticsJs());
      await saveFile('logistics.special.js', genererLogisticsSpecialJs());
      await saveFile('logistics.helpers.js', genererLogisticsHelpersJs());
      // Libérer le verrou après sauvegarde réussie
      releaseLock(newEntry.id);
      _hideReadOnlyBanner();
      selectedIdx = newIdx;
      editedData  = Object.assign({}, newEntry);
      renderList();
      // Sélectionner la nouvelle ligne dans la liste
      document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));
      const li = document.getElementById('li-' + newIdx);
      if (li) { li.classList.add('selected'); li.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
      renderEditor();
      showToast('✅ Atelier créé avec succès !', false);
    } catch(err) {
      AGENDA.pop(); // rollback
      showToast('❌ Sauvegarde impossible : ' + err.message, true);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '💾 Enregistrer toutes les modifications'; }
      if (ind) ind.classList.remove('show');
    }
  } else {
    // Garde-fou : l'ID ne doit jamais changer lors d'une édition
    if (newEntry.id !== AGENDA[selectedIdx].id) {
      showToast('❌ Erreur interne : l\'ID de l\'atelier a changé — sauvegarde annulée.', true);
      console.error('[Rapport11] ID mismatch', { avant: AGENDA[selectedIdx].id, apres: newEntry.id });
      if (btn) { btn.disabled = false; btn.textContent = '💾 Enregistrer toutes les modifications'; }
      if (ind) ind.classList.remove('show');
      return;
    }

    // ── Détection de renommage ────────────────────────────────────────────────
    // L'atelierId est le point de connexion stable entre data.js et ref_descriptions.js.
    // En cas de renommage, on retrouve l'entrée par son ID → les descriptions sont préservées.
    const oldAtelierName = AGENDA[selectedIdx].atelier || '';
    const newAtelierName = newEntry.atelier || '';
    const isRename = oldAtelierName && newAtelierName && oldAtelierName !== newAtelierName;
    if (isRename) {
      const existingDesc = findDesc(oldAtelierName, newEntry.id);
      if (existingDesc) {
        existingDesc.atelierId = newEntry.id || existingDesc.atelierId || '';
        existingDesc.atelier   = newAtelierName;
        existingDesc.key       = newAtelierName.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,40);
        console.log('[saveUpdate] Renommage : "' + oldAtelierName + '" → "' + newAtelierName + '" (ID: ' + newEntry.id + ')');
      }
    }

    const originalEntry = Object.assign({}, AGENDA[selectedIdx]);
    // Sauvegardes rollback des ateliers impactés (si SHIFT ANGEL)
    const rollbackAngels = [];
    AGENDA[selectedIdx] = newEntry;

    // Propagation cascade si c'est un SHIFT ANGEL
    let propagated = 0;
    if (newEntry.type === 'SHIFT ANGEL') {
      // Mémoriser l'état avant pour rollback
      AGENDA.forEach(function(entry, idx) {
        if (entry.jour === newEntry.jour && TYPES_ANGEL_PILOTES.has(entry.type)) {
          rollbackAngels.push({ idx, angel: entry.angel });
        }
      });
      propagated = propagateShiftAngel(newEntry);
    }

    try {
      // Fusion collaborative :
      // - newEntry = l'atelier modifié par cet utilisateur
      // - Si SHIFT ANGEL propagé, les ateliers angel modifiés en cascade sont aussi inclus
      const cascadeEntries = [newEntry];
      if (propagated > 0) {
        // Inclure tous les ateliers du même jour dont l'angel a été propagé
        AGENDA.forEach(function(entry) {
          if (entry !== newEntry && entry.jour === newEntry.jour && TYPES_ANGEL_PILOTES.has(entry.type)) {
            cascadeEntries.push(entry);
          }
        });
      }
      await mergeAndSaveDataJs(cascadeEntries);
      // Si renommage : forcer la sauvegarde de ref_descriptions.js même sans changement de contenu
      if (isRename && !editedData._descFr && !editedData._descEn && !editedData._nomEn && !editedData._consigneFr && !editedData._consigneEn) {
        await saveFile('ref_descriptions.js', genererRefDescJs());
        await saveFile('logistics.js',         genererLogisticsJs());
        await saveFile('logistics.special.js', genererLogisticsSpecialJs());
        await saveFile('logistics.helpers.js', genererLogisticsHelpersJs());
      } else {
        await saveDescIfNeeded();
        await saveFile('logistics.js',         genererLogisticsJs());
        await saveFile('logistics.special.js', genererLogisticsSpecialJs());
        await saveFile('logistics.helpers.js', genererLogisticsHelpersJs());
      }
      // Libérer le verrou après sauvegarde réussie
      releaseLock(newEntry.id);
      _hideReadOnlyBanner();
      renderList();
      renderEditor();
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const baseMsg = propagated > 0
        ? `✅ Sauvegardé — ${propagated} atelier(s) angel mis à jour.`
        : isLocal ? '✅ Sauvegardé localement !' : '✅ Sauvegardé sur GitHub !';
      showToast(baseMsg, false);
      if (isLocal) showProgrammeLink();

    } catch(err) {
      // Rollback
      AGENDA[selectedIdx] = originalEntry;
      rollbackAngels.forEach(function(rb) { AGENDA[rb.idx].angel = rb.angel; });
      showToast('❌ Sauvegarde impossible : ' + err.message, true);
      console.error('[Rapport11] Erreur saveUpdate:', err);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '💾 Enregistrer toutes les modifications'; }
      if (ind) ind.classList.remove('show');
    }
  }
}
window.saveUpdate = saveUpdate;

// ── SUPPRIMER UN ATELIER ──────────────────────────────────────────────────────
async function deleteAtelier() {
  if (selectedIdx === null || selectedIdx === -1) return;
  const nom = AGENDA[selectedIdx].atelier || 'cet atelier';
  if (!confirm(`Supprimer définitivement "${nom}" ?\n\nCette action est irréversible.`)) return;

  const btn = document.getElementById('btnUpdate');
  const ind = document.getElementById('savingIndicator');
  if (btn) btn.disabled = true;
  if (ind) ind.classList.add('show');

  const deletedEntry = AGENDA.splice(selectedIdx, 1)[0];

  try {
    // Fusion collaborative : signaler la suppression par ID dans la version fraîche GitHub
    await mergeAndSaveDataJs([], [deletedEntry.id]);
    // Libérer le verrou (atelier supprimé)
    releaseLock(deletedEntry.id);
    _hideReadOnlyBanner();
    // Fermer le panel et réinitialiser
    selectedIdx = null;
    editedData  = null;
    document.getElementById('editorPanel').style.display = 'none';
    document.getElementById('editorPanel').classList.remove('is-new');
    renderList();
    showToast('🗑 Atelier supprimé.', false);
  } catch(err) {
    // Rollback : réinsérer à la même position
    AGENDA.splice(selectedIdx, 0, deletedEntry);
    showToast('❌ Suppression impossible : ' + err.message, true);
    if (btn) btn.disabled = false;
    if (ind) ind.classList.remove('show');
  }
}
window.deleteAtelier = deleteAtelier;

// ── DUPLIQUER UN ATELIER ─────────────────────────────────────────────────────
function duplicateAtelier() {
  if (selectedIdx === null || selectedIdx === -1) return;
  const source = Object.assign({}, AGENDA[selectedIdx]);
  // Nom avec suffixe (COPIE), nouvel ID et logisticId réinitialisé
  source.id = generateAtelierId();
  source.atelier = (source.atelier || '') + ' (COPIE)';
  source.logisticId = '';

  selectedIdx = -1;
  editedData  = source;

  document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));

  renderEditor();
  const panel = document.getElementById('editorPanel');
  panel.style.display = '';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  showToast('📋 Duplica prêt — modifiez puis cliquez Créer l\'atelier');
}
window.duplicateAtelier = duplicateAtelier;

// ══════════════════════════════════════════════
// GÉNÉRATION data.js COMPLET (même format qu'Admin.html)
// ══════════════════════════════════════════════
function escJs(v) {
  return (v||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r\n/g,'\\n').replace(/\r/g,'\\n').replace(/\n/g,'\\n');
}

function generateAtelierId(extraIds) {
  // extraIds : Set optionnel d'IDs déjà réservés (ex: en cours de sérialisation)
  const used = extraIds || new Set();
  let id = '';
  do {
    id = 'A_' + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  } while (AGENDA.some(e => e.id === id) || used.has(id));
  return id;
}

function genererDataJs() {
  const now = new Date();
  const ts  = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
  genererDataJs._lastTs = ts; // exposé pour le polling post-sauvegarde

  const header =
`// @saved:${ts}
/**
 * TANTRAMOUR 2026 — Référentiel de données commun
 * ================================================
 * Source unique pour les 3 rapports HTML.
 * Pour mettre à jour : modifier uniquement ce fichier.
 *
 * Structure de chaque entrée :
 *   jour       {string}  "Jour 1" … "Jour 7"
 *   date       {string}  "Samedi 29 aout" …
 *   heure      {string}  "9:45 - 11:00" | "Matin" | "APRES MIDI"
 *   type       {string}  catégorie (ex: "ATELIERS TANTRA (AM)")
 *   atelier    {string}  nom de l'atelier / activité
 *   lieu       {string}  salle / espace (ex: "SHIVA", "CHENREZIG" …)
 *   fac1       {string}  Animateur principal
 *   fac2       {string}  Animateur secondaire
 *   fac3       {string}  Animateur 3
 *   fac4       {string}  Animateur 4
 *   traduction {string}  Langue / traducteur
 *   helper1    {string}  Helper 1
 *   helper2    {string}  Helper 2
 *   helper3    {string}  Helper 3
 *   helper4    {string}  Helper 4
 *   angel      {string}  Angel
 *   note       {string}  Note logistique (ex: "Shift Colibri", "Atelier + long")
 *   colibri    {boolean} Vrai si un Colibri est requis pour cet atelier
 */

var AGENDA = [`;

  // IDs déjà attribués pendant cette sérialisation (évite doublons si plusieurs entrées sans ID)
  const usedInSer = new Set(AGENDA.map(e => e.id).filter(Boolean));

  const lines = AGENDA.map((e, i) => {
    const prev = AGENDA[i - 1];
    let section = '';
    if (!prev || prev.jour !== e.jour) {
      const ref = (typeof REF_JOURS !== 'undefined') ? REF_JOURS.find(j => j.value === e.jour) : null;
      const dateLabel = ref ? ref.date : e.date;
      section = `\n  // ─── ${e.jour} — ${dateLabel} ${'─'.repeat(Math.max(0, 60 - e.jour.length - dateLabel.length))}\n`;
    }
    // Champs règles custom uniquement si différents du type
    const typeRule2 = (typeof REF_TYPES !== 'undefined') ? (REF_TYPES.find(t => t.value === e.type) || {}) : {};
    const customParts = [];
    if (e._minRes      !== undefined && e._minRes      !== (typeRule2.minRes||0))     customParts.push(`_minRes:${e._minRes}`);
    if (e._minHelpers  !== undefined && e._minHelpers  !== (typeRule2.minHelpers||0)) customParts.push(`_minHelpers:${e._minHelpers}`);
    if (e._minTrad     !== undefined && e._minTrad     !== (typeRule2.minTrad||0))    customParts.push(`_minTrad:${e._minTrad}`);
    if (e._tradCounts  !== undefined && e._tradCounts  !== (typeRule2.tradCounts||0)) customParts.push(`_tradCounts:${e._tradCounts}`);
    if (e._equipements && Object.keys(e._equipements).length > 0) {
      customParts.push(`_equipements:${JSON.stringify(e._equipements)}`);
    }
    if (e._consignesDisabled && Object.keys(e._consignesDisabled).length > 0) {
      customParts.push(`_consignesDisabled:${JSON.stringify(e._consignesDisabled)}`);
    }
    if (e._corecSelected) {
      const hasSel = Object.keys(e._corecSelected).some(pl => e._corecSelected[pl] && e._corecSelected[pl].length > 0);
      if (hasSel) customParts.push(`_corecSelected:${JSON.stringify(e._corecSelected)}`);
    }
    // Si l'atelier n'a pas d'ID (ne devrait pas arriver), en générer un unique
    let eid = e.id;
    if (!eid) { eid = generateAtelierId(usedInSer); usedInSer.add(eid); }
    const line = `  {id:"${escJs(eid)}",jour:"${escJs(e.jour)}",date:"${escJs(e.date)}",heure:"${escJs(e.heure)}",type:"${escJs(e.type)}",atelier:"${escJs(e.atelier)}",lieu:"${escJs(e.lieu)}",fac1:"${escJs(e.fac1)}",fac2:"${escJs(e.fac2)}",fac3:"${escJs(e.fac3||'')}",fac4:"${escJs(e.fac4||'')}",traduction:"${escJs(e.traduction)}",helper1:"${escJs(e.helper1)}",helper2:"${escJs(e.helper2)}",helper3:"${escJs(e.helper3)}",helper4:"${escJs(e.helper4||'')}",angel:"${escJs(e.angel)}",note:"${escJs(e.note)}",piment:${e.piment||0},colibri:${e.colibri?true:false},logisticId:"${escJs(e.logisticId||'')}",meetingRoles:"${escJs(e.meetingRoles||'')}",statut:"${escJs(e.statut||'APPROVED')}"}`;
    const lineWithCustom = customParts.length
      ? line.slice(0, -1) + ',' + customParts.join(',') + '}'
      : line;
    const finalLine = lineWithCustom + ',';
    return section + finalLine;
  }).join('\n');

  return header + '\n' + lines + `
];

/**
 * Convertit un objet AGENDA en tableau positionnel [17 colonnes]
 * identique au format RAW utilisé par les rapports.
 * Indice : [0]jour [1]date [2]heure [3]type [4]atelier [5]lieu
 *          [6]fac1 [7]fac2 [8]traduction [9]helper1 [10]helper2
 *          [11]helper3 [12]helper4 [13]angel [14]note [15]logisticId [16]piment
 *          [17]fac3 [18]fac4 [19]meetingRoles
 */
function agendaToRaw(entries) {
  return entries.map(e => [
    e.jour, e.date, e.heure, e.type, e.atelier, e.lieu,
    e.fac1, e.fac2, e.traduction,
    e.helper1, e.helper2, e.helper3, e.helper4 || '',
    e.angel, e.note, e.logisticId || '', e.piment || 0,
    e.fac3 || '', e.fac4 || '', e.meetingRoles || ''
  ]);
}`;
}

// ══════════════════════════════════════════════════════════════════════════════
// FUSION COLLABORATIVE data.js — SAUVEGARDE MULTI-UTILISATEURS
// ══════════════════════════════════════════════════════════════════════════════
//
// Stratégie "merge-before-write" :
//   1. Récupérer data.js FRAIS depuis l'API GitHub (jamais depuis le cache local)
//   2. Parser le contenu pour reconstruire la liste des ateliers tels qu'ils sont
//      sur GitHub EN CE MOMENT (= inclut les modifications d'autres utilisateurs)
//   3. Appliquer UNIQUEMENT les changements locaux (par ID) sur cette base fraîche
//   4. Écrire la version fusionnée → les modifications des autres sont préservées
//
// Résultat : deux utilisateurs éditant des ateliers différents ne se gênent plus.
//
// @param {Array}   changedEntries  — tableau d'objets {entry} à upsert (par id)
// @param {Array}   [deletedIds]    — tableau d'IDs à supprimer
// @returns {Promise<void>}

async function mergeAndSaveDataJs(changedEntries, deletedIds) {
  // ── Supabase SQL natif est la source unique de vérité ──
  // Plus besoin de fusionner manuellement des fichiers texte de données via l'API GitHub.
  // saveFile s'occupe de faire un upsert direct dans la table SQL Supabase de manière instantanée !
  return saveFile('data.js', genererDataJs());
}

// ── Parseur de data.js — reconstruit AGENDA[] sans eval() ───────────────────
// Extrait chaque objet littéral { id:"...", jour:"...", ... } du tableau AGENDA.
// Stratégie : découper le contenu entre [ et ] du tableau, puis extraire objet par objet
// en comptant les accolades (gère les accolades imbriquées de _equipements/_corecSelected).
function parseDataJs(src) {
  // Extraire le contenu entre les crochets de var AGENDA = [ ... ]
  const arrMatch = src.match(/var\s+AGENDA\s*=\s*\[([\s\S]*?)\];\s*\n?\s*function/);
  if (!arrMatch) return null;
  const arrSrc = arrMatch[1];

  // Découper en objets { ... } en comptant les accolades
  const objects = [];
  let depth = 0, start = -1;
  for (let i = 0; i < arrSrc.length; i++) {
    if (arrSrc[i] === '{') { if (depth === 0) start = i; depth++; }
    else if (arrSrc[i] === '}') {
      depth--;
      if (depth === 0 && start !== -1) { objects.push(arrSrc.slice(start, i + 1)); start = -1; }
    }
  }

  // Extraire les champs de chaque objet
  function str(obj, key) {
    const m = obj.match(new RegExp(key + '\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    if (!m) return '';
    return m[1].replace(/\\n/g,'\n').replace(/\\"/g,'"').replace(/\\\\/g,'\\');
  }
  function num(obj, key) {
    const m = obj.match(new RegExp(key + '\\s*:\\s*(-?\\d+(?:\\.\\d+)?)'));
    return m ? parseFloat(m[1]) : 0;
  }
  function bool(obj, key) {
    const m = obj.match(new RegExp(key + '\\s*:\\s*(true|false)'));
    return m ? (m[1] === 'true') : false;
  }
  function json(obj, key) {
    // Extraire un sous-objet JSON { ... } après la clé
    const re = new RegExp(key + '\\s*:\\s*(\\{)');
    const km = obj.match(re);
    if (!km) return undefined;
    const kStart = obj.indexOf(km[0]) + km[0].length - 1;
    let d = 0, j = kStart;
    for (; j < obj.length; j++) {
      if (obj[j] === '{') d++;
      else if (obj[j] === '}') { d--; if (d === 0) break; }
    }
    try { return JSON.parse(obj.slice(kStart, j + 1)); } catch(_) { return undefined; }
  }

  return objects.map(function(obj) {
    const entry = {
      id:           str(obj, 'id'),
      jour:         str(obj, 'jour'),
      date:         str(obj, 'date'),
      heure:        str(obj, 'heure'),
      type:         str(obj, 'type'),
      atelier:      str(obj, 'atelier'),
      lieu:         str(obj, 'lieu'),
      fac1:         str(obj, 'fac1'),
      fac2:         str(obj, 'fac2'),
      fac3:         str(obj, 'fac3'),
      fac4:         str(obj, 'fac4'),
      traduction:   str(obj, 'traduction'),
      helper1:      str(obj, 'helper1'),
      helper2:      str(obj, 'helper2'),
      helper3:      str(obj, 'helper3'),
      helper4:      str(obj, 'helper4'),
      angel:        str(obj, 'angel'),
      note:         str(obj, 'note'),
      piment:       num(obj, 'piment'),
      colibri:      bool(obj, 'colibri'),
      logisticId:   str(obj, 'logisticId'),
      meetingRoles: str(obj, 'meetingRoles'),
    };
    // Champs optionnels structurés
    const minRes     = obj.match(/_minRes\s*:\s*(\d+)/);
    const minHelpers = obj.match(/_minHelpers\s*:\s*(\d+)/);
    const minTrad    = obj.match(/_minTrad\s*:\s*(\d+)/);
    const tradCounts = obj.match(/_tradCounts\s*:\s*(\d+)/);
    if (minRes)     entry._minRes     = parseInt(minRes[1], 10);
    if (minHelpers) entry._minHelpers = parseInt(minHelpers[1], 10);
    if (minTrad)    entry._minTrad    = parseInt(minTrad[1], 10);
    if (tradCounts) entry._tradCounts = parseInt(tradCounts[1], 10);
    const equip = json(obj, '_equipements');
    if (equip) entry._equipements = equip;
    const consDisabled = json(obj, '_consignesDisabled');
    if (consDisabled) entry._consignesDisabled = consDisabled;
    const corec = json(obj, '_corecSelected');
    if (corec) entry._corecSelected = corec;
    return entry;
  }).filter(function(e) { return e.id; }); // ignorer les entrées sans ID
}

// ══════════════════════════════════════════════
function genererLogisticsJs() {
  const src = (typeof LOG !== 'undefined') ? LOG : {};
  const entries = Object.keys(src).map(k => {
    const v = src[k];
    const prep  = (typeof v.prepDuration  === 'number') ? v.prepDuration  : 15;
    const range = (typeof v.rangeDuration === 'number') ? v.rangeDuration : 0;
    const eqLine = (v._equipements && Object.keys(v._equipements).length > 0)
      ? `    _equipements: ${JSON.stringify(v._equipements)},\n` : '';
    return `  "${escJs(k)}": {\n    html: "${escJs(v.html||'')}",\n    text: "${escJs(v.text||'')}",\n    validatedByFac: ${v.validatedByFac?'true':'false'},\n    prepDuration: ${prep},\n    rangeDuration: ${range},\n${eqLine}    updatedAt: "${escJs(v.updatedAt||'')}"\n  }`;
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques\n */\n\nvar LOGISTICS = {\n\n' + entries + (entries?'\n\n':'') + '};\n';
}

function genererLogisticsSpecialJs() {
  const src = (typeof LOG_SPECIAL !== 'undefined') ? LOG_SPECIAL : {};
  const entries = Object.keys(src).map(k => {
    const v = src[k];
    return `  "${escJs(k)}": {\n    html: "${escJs(v.html||'')}",\n    text: "${escJs(v.text||'')}",\n    updatedAt: "${escJs(v.updatedAt||'')}"\n  }`;

  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques Spéciales\n */\n\nvar LOGISTICS_SPECIAL = {\n\n' + entries + (entries?'\n\n':'') + '};\n';
}

function genererLogisticsHelpersJs() {

    return `  "${escJs(k)}": {\n    avant: "${escJs(v.avant||'')}",\n    pendant: "${escJs(v.pendant||'')}",\n    apres: "${escJs(v.apres||'')}",\n    updatedAt: "${escJs(v.updatedAt||'')}"\n  }`;
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Consignes Helpers par Atelier\n * Structure : { avant, pendant, apres, updatedAt }\n */\n\nvar LOGISTICS_HELPERS = {\n\n' + entries + (entries?'\n\n':'') + '};\n';

// UTILITAIRES
// ══════════════════════════════════════════════
function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function htmlToText(html) {
  if (!html) return '';
  var div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || div.innerText || '').replace(/\s+\n/g, '\n').trim();
}

function buildAteliersExportRows() {
  return AGENDA.map(function(e) {
    var desc = findDesc(e.atelier) || {};
    var logId = e.logisticId || '';
    var logEntry = logId && typeof LOG !== 'undefined' ? LOG[logId] : null;
    var specEntry = logId && typeof LOG_SPECIAL !== 'undefined' ? LOG_SPECIAL[logId] : null;
    var helpEntry = logId && typeof LOGISTICS_HELPERS !== 'undefined' ? LOGISTICS_HELPERS[logId] : null;
    return {
      id: e.id || '',
      atelier: e.atelier || '',
      fac1: resolveName(e.fac1) || '',
      fac2: resolveName(e.fac2) || '',
      fac3: resolveName(e.fac3) || '',
      fac4: resolveName(e.fac4) || '',
      date: getExportDateValue(e),
      jour: e.jour || '',
      type: e.type || '',
      heureDebut: parseHeureDebut(e.heure || ''),
      heureFin: parseHeureFin(e.heure || ''),
      lieu: e.lieu || '',
      piment: e.piment || 0,
      note: e.note || '',
      nomEn: desc.nomEn || '',
      descFr: desc.descFr || '',
      descEn: desc.descEn || '',
      consigneFr: desc.consigne || '',
      consigneEn: desc.consigneEn || '',
      prepDuration: logEntry && logEntry.prepDuration !== undefined ? logEntry.prepDuration : '',
      logInfo: logEntry ? htmlToText(logEntry.html || logEntry.text || '') : '',
      logSpecial: specEntry ? htmlToText(specEntry.html || specEntry.text || '') : '',
      helperAvant: helpEntry ? htmlToText(helpEntry.avant || '') : '',
      helperPendant: helpEntry ? htmlToText(helpEntry.pendant || '') : '',
      helperApres: helpEntry ? htmlToText(helpEntry.apres || '') : ''
    };
  });
}

function escapeXml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatExportDate(dateStr) {
  if (!dateStr) return '';
  var match = String(dateStr).match(/(\d{1,2})\s+[A-Za-zéû\.]+\s+(\d{4})/);
  if (!match) return dateStr;
  var day = String(parseInt(match[1], 10)).padStart(2, '0');
  var year = match[2];
  var monthMap = {
    janvier:'01', fevrier:'02', février:'02', mars:'03', avril:'04', mai:'05', juin:'06', juillet:'07',
    aout:'08', août:'08', septembre:'09', octobre:'10', novembre:'11', decembre:'12', décembre:'12'
  };
  var monthKey = String(dateStr).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').match(/\d{1,2}\s+([a-z]+)\s+\d{4}/);
  var month = monthKey && monthMap[monthKey[1]] ? monthMap[monthKey[1]] : '';
  return month ? (day + '/' + month + '/' + year) : dateStr;
}

function getExportDateValue(entry) {
  var refJour = typeof REF_JOURS !== 'undefined'
    ? REF_JOURS.find(function(j) { return j.value === entry.jour; })
    : null;
  if (refJour && refJour.dateDdMmYyyy) return refJour.dateDdMmYyyy;
  return formatExportDate(entry.date || '');
}

function buildExcelRows(rows) {
  return rows.map(function(row) {
    return [
      row.id,row.atelier,row.fac1,row.fac2,row.fac3,row.fac4,row.type,row.date,row.jour,row.heureDebut,row.heureFin,row.lieu,row.piment,row.note,
      row.nomEn,row.descFr,row.descEn,row.consigneFr,row.consigneEn,row.prepDuration,row.logInfo,row.logSpecial,row.helperAvant,row.helperPendant,row.helperApres
    ];
  });
}

async function downloadExcelFile(rows, filename) {
  var workbook = new ExcelJS.Workbook();
  var sheet = workbook.addWorksheet('Ateliers');
  var headers = [
    'ID','Atelier (FR)','Animateur 1','Animateur 2','Animateur 3','Animateur 4','Type','Date (DD/MM/YYYY)','Jour','Heure de début','Heure de fin','Lieu','Piment','Note',
    'Workshop name (ENG)','Description (FR)','Description (ENG)','Instructions participants (FR)','Participant instructions (ENG)',
    'Estimation préparation','Informations logistiques','Besoins logistiques spécifiques','Consignes HELPER – AVANT','Consignes HELPER – PENDANT','Consignes HELPER – APRES'
  ];
  var grayColumns = { 13:true, 15:true, 16:true, 17:true, 18:true, 19:true, 20:true, 21:true, 22:true, 23:true, 24:true, 25:true };
  var columnWidths = [12, 30, 24, 24, 24, 24, 18, 14, 12, 14, 14, 16, 10, 18, 28, 36, 36, 36, 36, 20, 40, 40, 30, 30, 30];

  sheet.addRow(headers);
  buildExcelRows(rows).forEach(function(values) {
    sheet.addRow(values);
  });

  sheet.columns.forEach(function(column, index) {
    column.width = columnWidths[index] || 18;
  });
 
  sheet.autoFilter = {
    from: { row: 1, column: 1 },
    to: { row: 1, column: headers.length }
  };
  sheet.views = [{ state: 'frozen', xSplit: 2, ySplit: 1 }];

  sheet.getRow(1).eachCell(function(cell) {
    cell.font = { bold: true };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9EAF7' } };
    cell.border = {
      right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
      bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } }
    };
  });

  sheet.eachRow(function(row, rowNumber) {
    if (rowNumber === 1) return;
    var baseColor = rowNumber % 2 === 0 ? 'FFFFFFFF' : 'FFF3F4F6';
    row.eachCell(function(cell, colNumber) {
      var fillColor = grayColumns[colNumber] ? 'FFE5E7EB' : baseColor;
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fillColor } };
      cell.border = {
        right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
        bottom: { style: 'thin', color: { argb: 'FFE5E7EB' } }
      };
      cell.alignment = {
        vertical: 'top',
        wrapText: colNumber >= 13
      };
      if (colNumber === 6 && cell.value) {
        cell.numFmt = 'dd/mm/yyyy';
      }
    });
  });

  sheet.getColumn(6).eachCell(function(cell, rowNumber) {
    if (rowNumber === 1 || !cell.value) return;
    var parts = String(cell.value).split('/');
    if (parts.length === 3) {
      cell.value = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
      cell.numFmt = 'dd/mm/yyyy';
    }
  });

  var buffer = await workbook.xlsx.writeBuffer();
  var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportAteliersDetailsExcel() {
  var rows = buildAteliersExportRows();
  var now = new Date();
  var yyyy = now.getFullYear();
  var mm = String(now.getMonth() + 1).padStart(2, '0');
  var dd = String(now.getDate()).padStart(2, '0');
  var filename = 'TAF2026_ATELIERS DETAILS_' + yyyy + '_' + mm + '_' + dd + '.xlsx';
  if (typeof ExcelJS === 'undefined') {
    showToast('❌ Bibliothèque Excel indisponible', true);
    return;
  }
  await downloadExcelFile(rows, filename);
  showToast('✅ Export Excel généré');
}
window.exportAteliersDetailsExcel = exportAteliersDetailsExcel;

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background  = isError ? '#fef2f2' : '#1f2328';
  t.style.color       = isError ? '#dc2626' : '#fff';
  t.style.border      = isError ? '1px solid #fca5a5' : 'none';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), isError ? 6000 : 3500);
}

      '<div class="logistics-edit-actions">' +
        '<button class="btn-success" onclick="logSaveEntry()">✅ Sauvegarder</button>' +
        '<button class="btn-secondary" onclick="logCancelEdit()">✖ Annuler</button>' +

        '<div class="logistics-saving" id="logsavind"><div class="spinner"></div> Sauvegarde…</div>' +
      '</div>' +
    '</div>' +

    // Barre d'actions prévisualisation (avec affichage durée courante)

      '<button class="btn" onclick="logOuvrirEdition()">✏️ Modifier</button>' +

    '</div>';
}

// ── CRÉER une nouvelle entrée logistique pour l'atelier courant ─────────────
function logCreer() {
  if (selectedIdx === null) return;
  var a = AGENDA[selectedIdx];
  // Génère un ID basé sur le nom de l'atelier
  var base = ('LOG_' + (a.jour || '').replace(/\s/g,'') + '_' + (a.atelier || 'NEW').replace(/[^A-Za-z0-9]/g,'_').toUpperCase()).slice(0, 40);
  var newId = base, n = 2;
  while (LOG[newId]) { newId = base + '_' + n; n++; }

  LOG[newId] = { html: '', text: '', prepDuration: 15, updatedAt: new Date().toISOString().slice(0,10) };

  // Lier l'atelier à ce nouvel ID (en mémoire + dans editedData)
  editedData.logisticId = newId;
  AGENDA[selectedIdx].logisticId = newId;

  logRenderForAtelier(newId);
  logOuvrirEdition();
}
window.logCreer = logCreer;

// ── OUVRIR EN ÉDITION ──────────────────────────────────────────────────────

// ── SAUVEGARDER ────────────────────────────────────────────────────────────
async function logSaveEntry() {
  if (selectedIdx === null) return;
  var logId = editedData.logisticId || AGENDA[selectedIdx].logisticId;
  if (!logId) return;

  var rte     = document.getElementById('log-rte');
  var newHtml = rte ? rte.innerHTML.trim() : '';
  var tmp = document.createElement('div');
  tmp.innerHTML = newHtml;
  var newText = (tmp.textContent || tmp.innerText || '').trim();
  var prepInput = document.getElementById('log-prep-duration');
  var newPrep   = prepInput ? parseInt(prepInput.value, 10) : (LOG[logId].prepDuration || 0);
  if (isNaN(newPrep) || newPrep < 0) newPrep = 0;

  LOG[logId] = { html: newHtml, text: newText, prepDuration: newPrep, updatedAt: new Date().toISOString().slice(0,10) };

  var ind = document.getElementById('logsavind');
  if (ind) ind.classList.add('show');
  try {
    await logSauvegarder();
    showToast('✅ Informations logistiques sauvegardées !');

    var preview = document.getElementById('log-preview');
    if (preview) preview.innerHTML = newHtml || '<em style="color:var(--muted)">Aucun contenu.</em>';

// ── SUPPRIMER l'entrée logistique de l'atelier courant ────────────────────

// ── COMMANDES RTE ──────────────────────────────────────────────────────────
function rteCmd(editorId, cmd) {
  var editor = document.getElementById(editorId);
  if (!editor) return;
  editor.focus();
  document.execCommand(cmd, false, null);
}
window.rteCmd = rteCmd;

function placeCursorAtEnd(el) {
  var range = document.createRange();
  var sel   = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

// ── GÉNÉRATION DE logistics.js ─────────────────────────────────────────────
function escJs(v) {
  return (v||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r\n/g,'\\n').replace(/\r/g,'\\n').replace(/\n/g,'\\n');
}

function genererLogisticsJs() {
  var keys    = Object.keys(LOG);
  var entries = keys.map(function(k) {
    var e = LOG[k];
    var prep = (typeof e.prepDuration === 'number') ? e.prepDuration : 15;
    return '  "' + escJs(k) + '": {\n' +
      '    html: "' + escJs(e.html || '') + '",\n' +
      '    text: "' + escJs(e.text || '') + '",\n' +
      '    validatedByFac: ' + (e.validatedByFac ? 'true' : 'false') + ',\n' +
      '    prepDuration: ' + prep + ',\n' +
      '    updatedAt: "' + escJs(e.updatedAt || '') + '"\n' +
      '  }';
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques\n * ===========================================\n * Structure : LOGISTICS = { "<logisticId>": { html, text, validatedByFac, prepDuration, updatedAt } }\n */\n\nvar LOGISTICS = {\n\n' +
    entries + (entries ? '\n\n' : '') + '};\n';
}

function genererLogisticsSpecialJs() {
  var keys    = Object.keys(LOG_SPECIAL);
  var entries = keys.map(function(k) {
    var e = LOG_SPECIAL[k];
    return '  "' + escJs(k) + '": {\n' +
      '    html: "' + escJs(e.html || '') + '",\n' +
      '    text: "' + escJs(e.text || '') + '",\n' +
      '    updatedAt: "' + escJs(e.updatedAt || '') + '"\n' +
      '  }';
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 — Informations Logistiques Spéciales (Supplémentaires)\n * =======================================================================\n * Structure : LOGISTICS_SPECIAL = { "<logisticId>": { html, text, updatedAt } }\n */\n\nvar LOGISTICS_SPECIAL = {\n\n' +
    entries + (entries ? '\n\n' : '') + '};\n';
}

// ── SAUVEGARDE logistics.js / logistics.special.js ────────────────────────────
// saveFile() de github-api.js gère automatiquement local vs GitHub Pages
// et la détection de conflit multi-utilisateurs.
async function logSauvegarder() {
  return saveFile('logistics.js', genererLogisticsJs());
}

async function logSpecialSauvegarder() {
  return saveFile('logistics.special.js', genererLogisticsSpecialJs());
}

// Toggle sélection d'un équipement au clic sur la boîte
// Ouvre/ferme un panneau de catégorie équipement (accordéon)
function toggleEqCat(catId) {
  var toggle = document.getElementById(catId + '-toggle');
  var body   = document.getElementById(catId + '-body');
  if (!toggle || !body) return;
  var isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    toggle.classList.remove('open');
  } else {
    body.classList.add('open');
    toggle.classList.add('open');
  }
}
window.toggleEqCat = toggleEqCat;

// Met à jour le compteur d'une catégorie accordéon après un changement de sélection
function _refreshEqCatCount(itemEl) {
  var section = itemEl ? itemEl.closest('.eq-cat-section') : null;
  if (!section) return;
  var toggle = section.querySelector('.eq-cat-toggle');
  if (!toggle) return;
  var countEl = toggle.querySelector('.eq-cat-toggle-count');
  if (!countEl) return;
  var allItems  = section.querySelectorAll('.eq-item');
  var selItems  = section.querySelectorAll('.eq-item.selected');
  var total     = allItems.length;
  var selCount  = selItems.length;
  if (selCount > 0) {
    countEl.textContent = selCount + '/' + total + ' sélectionné' + (selCount > 1 ? 's' : '');
    countEl.classList.add('has-sel');
  } else {
    countEl.textContent = total + ' équipement' + (total > 1 ? 's' : '');
    countEl.classList.remove('has-sel');
  }
}

function eqToggle(eqId, itemEl) {
  if (!editedData) return;
  if (!editedData._equipements) editedData._equipements = {};
  var isSelected = itemEl.classList.contains('selected');
  if (isSelected) {
    // Désélectionner → qty = 0
    delete editedData._equipements[eqId];
    itemEl.classList.remove('selected');
    var inp = itemEl.querySelector('.eq-qty');
    if (inp) inp.value = '0';
  } else {
    // Sélectionner → qty = 1 (si déjà > 0, conserver)
    var current = editedData._equipements[eqId] || 0;
    var newQty = current > 0 ? current : 1;
    editedData._equipements[eqId] = newQty;
    itemEl.classList.add('selected');
    var inp = itemEl.querySelector('.eq-qty');
    if (inp) inp.value = String(newQty);
  }
  _refreshEqCatCount(itemEl);
}
window.eqToggle = eqToggle;

// Met à jour la quantité d'un équipement et synchronise l'état selected de la boîte
function eqQtyChange(eqId, val, itemEl) {
  if (!editedData) return;
  if (!editedData._equipements) editedData._equipements = {};
  var qty = parseInt(val, 10) || 0;
  if (qty <= 0) {
    delete editedData._equipements[eqId];
    if (itemEl) itemEl.classList.remove('selected');
  } else {
    editedData._equipements[eqId] = qty;
    if (itemEl) itemEl.classList.add('selected');
  }
  _refreshEqCatCount(itemEl);
}
window.eqQtyChange = eqQtyChange;

// Options de la colonne "categorie" — dynamiques, basées sur REF_EQUIP_CAT (triées par ordre)
function eqCategorieOptionsList() {
  return (typeof REF_EQUIP_CAT !== 'undefined' ? REF_EQUIP_CAT : []).slice()
    .sort(function(a, b) { return (parseInt(a.ordre) || 0) - (parseInt(b.ordre) || 0); })
    .map(function(c) { return c.value; });
}

// Ajouter un nouvel équipement — choix du fournisseur (type) + catégorie
async function eqDemandeAjouter() {
  var typeEl = document.getElementById('eq-new-type');
  var catEl  = document.getElementById('eq-new-cat');
  var nomEl  = document.getElementById('eq-new-nom');
  var descEl = document.getElementById('eq-new-desc');
  var qtyEl  = document.getElementById('eq-new-qty');
  var type   = (typeEl ? typeEl.value : 'Hameau');
  var cat    = (catEl  ? catEl.value  : 'Divers');
  var nom    = (nomEl  ? nomEl.value.trim()  : '');
  var desc   = (descEl ? descEl.value.trim() : '');
  var qty    = parseInt(qtyEl ? qtyEl.value : '1', 10) || 1;
  if (!nom) { showToast('⚠️ Le nom de l\'équipement est obligatoire', true); return; }

  // Générer un ID numérique unique via generateEquipId()
  var newId = (typeof generateEquipId === 'function') ? generateEquipId() : Math.floor(100000 + Math.random() * 900000);

  var newEq = { type: type, categorie: cat, id: newId, value: nom, stock: 0, description: desc, remarque: '' };
  if (typeof REF_EQUIPEMENTS === 'undefined') window.REF_EQUIPEMENTS = [];
  REF_EQUIPEMENTS.push(newEq);

  // Enregistrer la quantité souhaitée sur l'atelier courant
  if (!editedData._equipements) editedData._equipements = {};
  if (qty > 0) editedData._equipements[newId] = qty;

  // Sauvegarder ref_equipements.js
  try {
    await saveFile('ref_equipements.js', genererRefEquipementsJs());
    showToast('✅ Équipement ajouté et sauvegardé !');
    renderEditor();
  } catch(err) {
    // Rollback en mémoire
    REF_EQUIPEMENTS.pop();
    delete editedData._equipements[newId];
    showToast('❌ Sauvegarde impossible : ' + err.message, true);
  }
}
window.eqDemandeAjouter = eqDemandeAjouter;

// Génère le contenu de ref_equipements.js
function genererRefEquipementsJs() {
  var lines = (REF_EQUIPEMENTS || []).map(function(eq) {
    var stock = (eq.stock === 'N/A') ? '"N/A"' : (parseInt(eq.stock,10) || 0);
    var cat   = escJs(eq.categorie || 'Divers');
    var idVal = (typeof eq.id === 'number') ? eq.id : (isNaN(parseInt(eq.id)) ? ('"' + escJs(String(eq.id)) + '"') : parseInt(eq.id));
    return '  { type: "' + escJs(eq.type) + '", categorie: "' + cat + '", id: ' + idVal + ', value: "' + escJs(eq.value) + '", stock: ' + stock + ', description: "' + escJs(eq.description || '') + '", remarque: "' + escJs(eq.remarque || '') + '" }';
  });
  return '/**\n * TANTRAMOUR 2026 — Référentiel : Équipements\n' +
    ' * Chaque entrée : { id, value, type, categorie, stock, description, remarque }\n' +
    ' *   value       : nom de l\'équipement\n' +
    ' *   type        : "Hameau" | "Tantramour" | "Animateur" | "Autre" (fournisseur)\n' +
    ' *   categorie   : nom de la catégorie — géré via ref_equip_cat.js (REF_EQUIP_CAT)\n' +
    ' *   stock       : nombre (0-1000) ou "N/A"\n' +
    ' *   description : texte libre\n' +
    ' *   remarque    : texte libre\n' +
    ' */\n' +
    'var REF_EQUIPEMENTS = [\n' + lines.join(',\n') + '\n];\n';
}

}); // fin loadData
