<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantramour 2026 â€” Ã‰diter un atelier</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg:#ffffff; --surface:#f7f8fa; --border:#e5e7eb;
    --text:#1f2328; --muted:#57606a; --accent:#3b82d4;
    --header-bg:#f0f4fb; --row-alt:#f7f8fa;
    --tag-bg:#eef2ff; --tag-text:#3b5bdb;
    --green:#16a34a; --green-bg:#dcfce7; --green-border:#86efac;
    --badge-h:#e0f2fe; --badge-ht:#0369a1;
    --badge-a:#fce7f3; --badge-at:#9d174d;
    --badge-f:#dcfce7; --badge-ft:#166534;
  }
  .dark {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --header-bg:#1c2333; --row-alt:#161b22; --tag-bg:#1c2a4a; --tag-text:#79a8ff;
    --green-bg:#052e16; --green-border:#166534;
    --badge-h:#0c2d48; --badge-ht:#58a6ff;
    --badge-a:#3b1030; --badge-at:#f0abca;
    --badge-f:#0a2e1a; --badge-ft:#4ade80;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.6; background:var(--bg); color:var(--text); transition:background .2s,color .2s; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 60px; }

  /* â”€â”€ HEADER â”€â”€ */
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .logo h1 { font-size:20px; font-weight:700; }
  .logo p  { font-size:26px; font-weight:800; color:var(--accent); line-height:1.2; margin-top:2px; }
  .header-actions { display:flex; gap:8px; align-items:center; }
  .btn { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 14px; font-size:13px; color:var(--text); font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--border); }

  /* â”€â”€ FILTERS â”€â”€ */
  .filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; align-items:flex-end; }
  .filter-group { display:flex; flex-direction:column; gap:4px; }
  .filter-group label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600; }
  select, input[type="text"] { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; color:var(--text); font-family:inherit; cursor:pointer; }
  select { min-width:160px; }
  input[type="text"] { min-width:200px; }
  .stats { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .stats span { color:var(--accent); font-weight:600; }

  /* â”€â”€ LISTE ATELIERS â”€â”€ */
  .list-wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:28px; }
  .list-item { display:grid; grid-template-columns:52px 116px 1fr 200px 56px 160px 80px 20px; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; }
  .list-item:last-child { border-bottom:none; }
  .list-item:hover { background:var(--row-alt); }
  .list-item.selected { background:#eff6ff; border-left:3px solid var(--accent); }
  .dark .list-item.selected { background:#0c2d48; }
  .li-jour { font-size:11px; font-weight:700; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li-heure { font-size:11px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .li-atelier { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li-fac { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li-piment { font-size:12px; letter-spacing:-1px; text-align:center; }
  .li-type { font-size:10px; font-weight:600; padding:1px 7px; border-radius:4px; background:var(--tag-bg); color:var(--tag-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li-lieu { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li-arrow { font-size:14px; color:var(--muted); text-align:right; }
  .empty { padding:40px; text-align:center; color:var(--muted); }

  /* â”€â”€ FORMULAIRE D'Ã‰DITION â”€â”€ */
  .editor-panel { background:var(--surface); border:2px solid var(--accent); border-radius:10px; padding:24px 28px; }
  .editor-title { font-size:16px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
  .editor-title .badge-idx { font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; background:var(--accent); color:#fff; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
  @media(max-width:640px) { .form-grid { grid-template-columns:1fr; } }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-group.full { grid-column:1/-1; }
  .form-group label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .form-group input, .form-group select, .form-group textarea {
    background:var(--bg); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; font-size:13px; color:var(--text); font-family:inherit; width:100%;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,212,.12);
  }
  .form-group textarea { resize:vertical; min-height:60px; }
  .checkbox-row { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .checkbox-row input[type="checkbox"] { width:17px; height:17px; cursor:pointer; accent-color:var(--accent); flex-shrink:0; }
  .checkbox-row .cb-label { font-size:13px; font-weight:600; cursor:pointer; user-select:none; }
  .checkbox-row .cb-hint { font-size:11px; color:var(--muted); }
  .piment-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .piment-btn { cursor:pointer; padding:6px 14px; border-radius:6px; border:2px solid var(--border); background:var(--bg); font-size:13px; font-family:inherit; color:var(--text); transition:all .15s; }
  .piment-btn.active { border-color:var(--accent); background:#eff6ff; font-weight:700; }
  .dark .piment-btn.active { background:#0c2d48; }

  /* â”€â”€ WIDGET HEURE â”€â”€ */
  .heure-widget { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .heure-widget select { min-width:0; width:100px; flex-shrink:0; }
  .heure-sep { font-size:15px; font-weight:700; color:var(--muted); user-select:none; }
  .heure-preview { font-size:13px; font-weight:700; color:var(--accent); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 12px; white-space:nowrap; min-width:140px; text-align:center; font-variant-numeric:tabular-nums; }
  .heure-preview.empty { color:var(--muted); font-weight:400; font-style:italic; }

  /* â”€â”€ ACTIONS â”€â”€ */
  .editor-actions { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; align-items:center; }
  .btn-primary { cursor:pointer; background:var(--accent); color:#fff; border:none; border-radius:6px; padding:9px 22px; font-size:15px; font-weight:700; font-family:inherit; display:inline-flex; align-items:center; gap:7px; }
  .btn-primary:hover { filter:brightness(1.1); }
  .btn-primary:disabled { opacity:.55; cursor:not-allowed; filter:none; }
  .btn-secondary { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:9px 20px; font-size:14px; color:var(--text); font-family:inherit; }
  .btn-secondary:hover { background:var(--border); }
  .btn-danger { cursor:pointer; background:#fef2f2; color:#dc2626; border:1px solid #fca5a5; border-radius:6px; padding:9px 20px; font-size:14px; font-family:inherit; font-weight:600; margin-left:auto; }
  .btn-danger:hover { background:#fca5a5; }
  .btn-new { cursor:pointer; background:#f0fdf4; color:#16a34a; border:1px solid #86efac; border-radius:6px; padding:6px 14px; font-size:13px; font-family:inherit; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .btn-new:hover { background:#dcfce7; }
  .editor-panel.is-new { border-color:#16a34a; }
  .badge-new { background:#16a34a !important; }
  .saving-indicator { font-size:13px; color:var(--muted); display:none; align-items:center; gap:6px; }
  .saving-indicator.show { display:flex; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { width:15px; height:15px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }

  /* â”€â”€ PANNEAU LOGISTIQUE â”€â”€ */
  /* â”€â”€ Blocs section dans l'Ã©diteur â”€â”€ */
  .section-block { margin-top:28px; padding-top:22px; border-top:2px solid var(--border); }
  .section-block-title { font-size:15px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .section-block-sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
  .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
  @media(max-width:640px) { .form-grid-2 { grid-template-columns:1fr; } }

  /* â”€â”€ BLOC Ã‰QUIPEMENTS â”€â”€ */
  .eq-block { margin-top:18px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .eq-block-title { background:var(--surface); padding:10px 16px; font-size:13px; font-weight:700; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  /* AccordÃ©on catÃ©gorie */
  .eq-cat-section { border-bottom:1px solid var(--border); }
  .eq-cat-section:last-child { border-bottom:none; }
  .eq-cat-toggle { display:flex; align-items:center; gap:8px; padding:9px 16px; cursor:pointer; background:#e2e8f0; user-select:none; transition:background .12s; }
  .dark .eq-cat-toggle { background:#1e293b; }
  .eq-cat-toggle:hover { background:#cbd5e1; }
  .dark .eq-cat-toggle:hover { background:#273549; }
  .eq-cat-toggle-label { flex:1; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#1e293b; }
  .dark .eq-cat-toggle-label { color:#e2e8f0; }
  .eq-cat-toggle-count { font-size:11px; color:var(--muted); background:var(--tag-bg); border:1px solid var(--border); border-radius:10px; padding:1px 8px; }
  .eq-cat-toggle-count.has-sel { background:#dcfce7; border-color:#86efac; color:#15803d; font-weight:700; }
  .dark .eq-cat-toggle-count.has-sel { background:#052e16; border-color:#166534; color:#4ade80; }
  .eq-cat-toggle-arrow { font-size:10px; color:var(--muted); transition:transform .18s; }
  .eq-cat-toggle.open .eq-cat-toggle-arrow { transform:rotate(90deg); }
  .eq-cat-body { display:none; }
  .eq-cat-body.open { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; }
  @media(max-width:1000px) { .eq-cat-body.open { grid-template-columns:1fr 1fr; } }
  @media(max-width:500px)  { .eq-cat-body.open { grid-template-columns:1fr; } }
  .eq-cat-col { border-right:1px solid var(--border); min-width:0; }
  .eq-cat-col:last-child { border-right:none; }
  /* SÃ©parateur de fournisseur dans une catÃ©gorie */
  .eq-supplier-header { padding:4px 16px 3px; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; border-bottom:1px solid var(--border); }
  .eq-supplier-header.hameau      { color:#1d4ed8; background:#eff6ff; border-left:3px solid #3b82f6; }
  .dark .eq-supplier-header.hameau      { color:#93c5fd; background:#1e3a5f; border-left-color:#3b82f6; }
  .eq-supplier-header.tantramour  { color:#7c3aed; background:#f5f3ff; border-left:3px solid #8b5cf6; }
  .dark .eq-supplier-header.tantramour  { color:#c4b5fd; background:#2e1065; border-left-color:#8b5cf6; }
  .eq-supplier-header.animateur   { color:#065f46; background:#d1fae5; border-left:3px solid #10b981; }
  .dark .eq-supplier-header.animateur   { color:#6ee7b7; background:#022c22; border-left-color:#10b981; }
  .eq-supplier-header.autre       { color:#92400e; background:#fffbeb; border-left:3px solid #f59e0b; }
  .dark .eq-supplier-header.autre { color:#fcd34d; background:#1c1003; border-left-color:#f59e0b; }
  /* Items */
  .eq-item { display:flex; align-items:center; gap:8px; padding:7px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s; user-select:none; }
  .eq-item:last-child { border-bottom:none; }
  .eq-item:hover { background:var(--row-alt); }
  .eq-item.selected { background:#dcfce7; border-left:3px solid #16a34a; padding-left:11px; }
  .dark .eq-item.selected { background:#052e16; border-left-color:#4ade80; }
  .eq-item.selected .eq-item-name { color:#15803d; font-weight:600; }
  .dark .eq-item.selected .eq-item-name { color:#4ade80; }
  .eq-item-name { flex:1; font-size:13px; }
  .eq-item-badge { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:1px 6px; border-radius:8px; white-space:nowrap; }
  .eq-item-badge.hameau     { background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd; }
  .dark .eq-item-badge.hameau     { background:#1e3a5f; color:#93c5fd; }
  .eq-item-badge.tantramour { background:#ede9fe; color:#7c3aed; border:1px solid #c4b5fd; }
  .dark .eq-item-badge.tantramour { background:#2e1065; color:#c4b5fd; }
  .eq-qty { width:56px; padding:4px 6px; border:1px solid var(--border); border-radius:5px; font-size:13px; background:var(--bg); color:var(--text); font-family:inherit; text-align:center; }
  .eq-item.selected .eq-qty { border-color:#86efac; background:#f0fdf4; }
  .dark .eq-item.selected .eq-qty { border-color:#166534; background:#052e16; }
  .eq-qty:focus { outline:none; border-color:var(--accent); }
  .eq-qty-lbl { font-size:10px; color:var(--muted); white-space:nowrap; }
  .eq-demande-block { border-top:1px solid var(--border); padding:14px 16px; background:var(--surface); }
  .eq-demande-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:10px; }
  .eq-demande-list { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .eq-demande-item { display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; }
  .eq-demande-item-name { flex:1; font-size:13px; font-weight:600; }
  .eq-demande-item-desc { font-size:12px; color:var(--muted); flex:2; }
  .eq-demande-form { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; }
  .eq-demande-form input { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; color:var(--text); font-family:inherit; }
  .eq-demande-form input:focus { outline:none; border-color:var(--accent); }
  .eq-demande-form .inp-nom { flex:1; min-width:140px; }
  .eq-demande-form .inp-desc { flex:2; min-width:180px; }
  .eq-demande-form select { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; color:var(--text); font-family:inherit; cursor:pointer; }
  .eq-demande-form select:focus { outline:none; border-color:var(--accent); }
  .eq-demande-form .sel-type { min-width:120px; }
  .eq-demande-form .sel-cat  { min-width:160px; }
  .btn-eq-add { cursor:pointer; background:#f0fdf4; color:#16a34a; border:1px solid #86efac; border-radius:6px; padding:7px 16px; font-size:13px; font-family:inherit; font-weight:700; white-space:nowrap; }
  .btn-eq-add:hover { background:#dcfce7; }
  .btn-eq-edit { cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:3px 8px; font-size:12px; color:var(--text); font-family:inherit; }
  .btn-eq-edit:hover { background:var(--border); }
  .btn-eq-del { cursor:pointer; background:#fef2f2; border:1px solid #fca5a5; border-radius:5px; padding:3px 8px; font-size:12px; color:#dc2626; font-family:inherit; }
  .btn-eq-del:hover { background:#fca5a5; }
  .eq-cat-header { padding:5px 14px 3px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); background:var(--tag-bg); border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-top:2px; }
  .eq-cat-header:first-child { margin-top:0; border-top:none; }
  .desc-area { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13px; color:var(--text); font-family:inherit; width:100%; resize:vertical; min-height:80px; outline:none; line-height:1.6; }
  .desc-area:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,212,.12); }
  .res-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:6px; margin-bottom:8px; }
  .res-row label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); white-space:nowrap; min-width:110px; }
  .res-row input[type="number"] { width:64px; padding:5px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px; background:var(--bg); color:var(--text); font-family:inherit; }
  .res-row .res-hint { font-size:11px; color:var(--muted); flex:1; }
  .validated-badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:6px; }
  .validated-badge.yes { background:#dcfce7; color:#16a34a; border:1px solid #86efac; }
  .validated-badge.no  { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .helper-sub-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:8px 0 4px; }
  .updated-stamp { font-size:11px; color:var(--muted); font-style:italic; padding-top:6px; }

  .logistics-panel { margin-top:40px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .logistics-header { background:var(--header-bg); padding:16px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--border); }
  .logistics-header-title { font-size:15px; font-weight:700; }
  .logistics-header-meta { font-size:12px; color:var(--muted); }
  .logistics-body { padding:20px 22px; }
  .logistics-list { display:flex; flex-direction:column; gap:12px; }
  .logistics-item { border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .logistics-item-header { background:var(--surface); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .logistics-item-ateliers { font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logistics-item-actions { display:flex; gap:6px; flex-shrink:0; }
  .logistics-item-body { padding:14px 16px; border-top:1px solid var(--border); background:var(--bg); }
  .logistics-item-body.collapsed { display:none; }
  /* PrÃ©visualisation HTML */
  .logistics-html-preview { font-size:13px; line-height:1.7; color:var(--text); }
  .logistics-html-preview p  { margin-bottom:6px; }
  .logistics-html-preview ul { padding-left:20px; }
  .logistics-html-preview ol { padding-left:20px; }
  .logistics-html-preview li { margin-bottom:2px; }
  /* Zone d'Ã©dition */
  .logistics-edit-zone { display:none; }
  .logistics-edit-zone.active { display:block; }
  /* Barre de formatage */
  .rte-toolbar { display:flex; gap:4px; flex-wrap:wrap; padding:6px 8px; background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:6px 6px 0 0; }
  .rte-btn { cursor:pointer; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:4px 9px; font-size:13px; font-family:inherit; color:var(--text); line-height:1.4; transition:background .1s; }
  .rte-btn:hover { background:var(--border); }
  .rte-btn b { font-weight:900; }
  .rte-sep { width:1px; background:var(--border); margin:2px 4px; align-self:stretch; }
  /* Zone Ã©ditable contenteditable */
  .rte-editor {
    min-height:120px; padding:10px 12px;
    border:1px solid var(--border); border-radius:0 0 6px 6px;
    background:var(--bg); color:var(--text);
    font-size:13px; line-height:1.7; font-family:inherit;
    outline:none; overflow-y:auto;
  }
  .rte-editor:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,212,.12); }
  .rte-editor ul { padding-left:20px; }

// SYSTÃˆME DE VERROUS COLLABORATIFS (locks.json)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
//

//   2. Si oui et non expirÃ© â†’ READ ONLY + bandeau "X est en train d'Ã©diter"
//   3. Si non â†’ on acquiert le verrou (PUT locks.json avec notre entrÃ©e, TTL 5 min)
//   4. Heartbeat toutes les 2 min pour renouveler le TTL tant que l'atelier est ouvert
//   5. LibÃ©ration : sauvegarde, annulation, sÃ©lection d'un autre atelier, fermeture de page

// â”€â”€ Nom d'utilisateur â€” demandÃ© une fois, stockÃ© dans localStorage â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function _getLockUserName() {
  let name = localStorage.getItem('tm_user_name') || '';
  if (!name) {
    name = prompt('Votre prÃ©nom (utilisÃ© pour indiquer aux autres que vous Ã©ditez un atelier) :') || 'Anonyme';

}

// â”€â”€ RÃ©cupÃ©rer locks.json frais depuis l'API GitHub â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function _fetchLocks() {
  try {
    const token  = localStorage.getItem('tm_gh_token');
    const apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO +
                   '/contents/' + LOCKS_FILE + '?ref=' + GITHUB_BRANCH + '&_t=' + Date.now();
    const headers = { 'Accept': 'application/vnd.github+json', 'If-None-Match': '' };
    if (token) headers['Authorization'] = 'token ' + token;
    const res = await fetch(apiUrl, { headers: headers, cache: 'no-store' });
    if (!res.ok) return { locks: {}, sha: null };
    const data    = await res.json();
    _locksSha     = data.sha || null;
    const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    return { locks: JSON.parse(content), sha: _locksSha };
  } catch(_) {
    return { locks: {}, sha: _locksSha };
  }
}

// â”€â”€ Ã‰crire locks.json sur GitHub â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function _writeLocks(locksObj) {
  try {
    const token = localStorage.getItem('tm_gh_token');
    if (!token) return;   // sans token on ne peut pas Ã©crire â€” pas critique
    const content = JSON.stringify(locksObj, null, 2);
    const encoded = btoa(unescape(encodeURIComponent(content)));
    const apiUrl  = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO +
                    '/contents/' + LOCKS_FILE;
    const body = {
      message: '[Tantramour locks] ' + (_lockHeldId || '?'),
      content: encoded,
      branch:  GITHUB_BRANCH,
    };
    if (_locksSha) body.sha = _locksSha;
    const res = await fetch(apiUrl, {
      method:  'PUT',
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });
    if (res.ok) {
      const d = await res.json();
      _locksSha = (d.content && d.content.sha) || _locksSha;
    } else if (res.status === 409 || res.status === 422) {
      // SHA pÃ©rimÃ© â†’ refetch et rÃ©essayer une fois
      const fresh = await _fetchLocks();
      _locksSha = fresh.sha;
      await _writeLocks(locksObj);
    }

}

// â”€â”€ VÃ©rifier si un atelier est verrouillÃ© par quelqu'un d'autre â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Retourne { locked: bool, locker: string } â€” locker = prÃ©nom de l'occupant
async function checkLock(atelierID) {
  if (!atelierID) return { locked: false, locker: '' };
  // En local : pas de verrou (conflit impossible sur un seul poste)
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return { locked: false, locker: '' };
  const me = _getLockUserName();
  const { locks } = await _fetchLocks();
  const entry = locks[atelierID];
  if (!entry) return { locked: false, locker: '' };
  // Expiration : ignorer les verrous pÃ©rimÃ©s
  if (entry.expires && Date.now() > new Date(entry.expires).getTime()) return { locked: false, locker: '' };
  // C'est notre propre verrou (mÃªme prÃ©nom) â†’ pas de blocage
  if (entry.user === me) return { locked: false, locker: '' };
  return { locked: true, locker: entry.user || 'quelqu\'un' };
}

// â”€â”€ AcquÃ©rir le verrou sur un atelier â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function acquireLock(atelierID) {
  if (!atelierID) return;
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
  const me = _getLockUserName();
  const { locks } = await _fetchLocks();
  const now     = new Date();
  const expires = new Date(now.getTime() + LOCK_TTL_MS);
  locks[atelierID] = { user: me, since: now.toISOString(), expires: expires.toISOString() };
  // LibÃ©rer l'Ã©ventuel ancien verrou tenu sur un autre atelier
  if (_lockHeldId && _lockHeldId !== atelierID) delete locks[_lockHeldId];
  _lockHeldId = atelierID;
  await _writeLocks(locks);
  // DÃ©marrer le heartbeat
  _stopHeartbeat();
  _lockHeartbeat = setInterval(function() { _renewLock(atelierID); }, LOCK_HEARTBEAT_MS);
}

// â”€â”€ Renouveler le verrou (heartbeat) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function _renewLock(atelierID) {
  if (!atelierID || _lockHeldId !== atelierID) return;
  const me = _getLockUserName();
  const { locks } = await _fetchLocks();
  if (!locks[atelierID] || locks[atelierID].user !== me) return; // verrou perdu
  const expires = new Date(Date.now() + LOCK_TTL_MS);
  locks[atelierID].expires = expires.toISOString();
  await _writeLocks(locks);
}

// â”€â”€ LibÃ©rer le verrou â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function releaseLock(atelierID) {
  if (!atelierID) return;
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
  _stopHeartbeat();
  _lockHeldId = null;
  try {

// â”€â”€ LibÃ©ration automatique Ã  la fermeture de l'onglet â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];

function heureMin(h) {
  if (!h) return 9999;
  const m = h.replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);

// LOGIQUE ANGEL â€” rÃ©solution dynamique
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function _parseHM(s) {
  if (!s) return null;
  const norm = String(s).replace(/\./g, ':').trim();
  const m = norm.match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
}

function resolveAngelEdit(jour, heure) {
  if (!jour || !heure) return '';
  const norm = String(heure).replace(/\./g, ':').replace(/[â€“\u2013\u2014]/g, '-');
  const parts = norm.split(/\s*-+\s*/);
  const debut = _parseHM(parts[0]);
  let fin = parts[1] ? _parseHM(parts[1]) : null;
  if (debut === null) return '';
  if (fin !== null && fin <= debut) fin += 24 * 60;
  const milieu = fin !== null ? (debut + fin) / 2 : debut + 1;
  const shifts = AGENDA.filter(s => s.type === 'SHIFT ANGEL' && s.jour === jour && s.angel);
  for (const s of shifts) {
    const sn = String(s.heure).replace(/\./g, ':').replace(/[â€“\u2013\u2014]/g, '-');
    const sp = sn.split(/\s*-+\s*/);
    const sd = _parseHM(sp[0]);
    let sf = sp[1] ? _parseHM(sp[1]) : null;
    if (sd === null) continue;
    if (sf !== null && sf <= sd) sf += 24 * 60;
    if (sf === null) sf = sd + 180;
    if (milieu >= sd && milieu <= sf) return s.angel;
  }
  return '';
}

function parseHeureDebut(h) {
  if (!h) return '';
  const m = String(h).replace(/\./g, ':').match(/(\d{1,2}:\d{2})/);
  if (!m) return '';
  const [hh, mm] = m[1].split(':');
  return hh.padStart(2,'0') + ':' + mm.padStart(2,'0');
}
function parseHeureFin(h) {
  if (!h) return '';
  const norm = String(h).replace(/\./g, ':');
  const all = norm.match(/(\d{1,2}:\d{2})/g);
  if (!all || all.length < 2) return '';
  const [hh, mm] = all[1].split(':');
  return hh.padStart(2,'0') + ':' + mm.padStart(2,'0');
}

// â”€â”€ Calcule la disponibilitÃ© de chaque personne par rapport au crÃ©neau en cours â”€â”€
// Retourne { name: 'red' | 'orange' } â€” les absents du map sont 'green'.
//
//   red    : chevauchement direct avec un autre atelier (tous rÃ´les confondus)
//             OU personne dÃ©jÃ  affectÃ©e Ã  l'atelier en cours dans un AUTRE champ
//             (pas le champ courant â€” permet de voir la vraie dispo selon le rÃ´le)
//   orange : aucun chevauchement, mais atelier se terminant dans les 90 min avant le dÃ©but
//             OU dÃ©butant dans les 90 min aprÃ¨s la fin du crÃ©neau en cours (tous rÃ´les)
//   green  : aucun atelier dans la fenÃªtre de 90 min autour du crÃ©neau
//
// excludeField : clÃ© du champ de l'atelier courant correspondant au select en cours
//   (ex: 'fac1', 'helper1', 'traduction', 'angel')
//   La personne dans ce champ n'est PAS prÃ©-marquÃ©e rouge, son statut vient de l'AGENDA.
function getAvailability(excludeField) {
  const e = editedData;
  if (!e || !e.jour || !e.heure) return {};

  function toMin(hStr) {
    if (!hStr) return null;
    const m = String(hStr).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
    return m ? parseInt(m[1],10)*60 + parseInt(m[2],10) : null;
  }
  function parseInterval(hStr) {
    if (!hStr) return null;
    const norm = String(hStr).replace(/\./g,':');
    const all  = norm.match(/(\d{1,2}:\d{2})/g);
    if (!all || all.length < 2) return null;
    const s = toMin(all[0]), end = toMin(all[1]);
    return (s !== null && end !== null) ? { s, e: end } : null;
  }

  const myIv = parseInterval(e.heure);
  if (!myIv) return {};
  const myId   = e.id || '';
  const BUFFER = 90; // minutes â€” fenÃªtre "proche" avant/aprÃ¨s

  // Personnes dÃ©jÃ  assignÃ©es Ã  l'atelier en cours dans les AUTRES champs â†’ rouge
  // On exclut le champ courant (excludeField) pour voir la vraie dispo de la personne
  // qui y est dÃ©jÃ  affectÃ©e (son statut viendra de l'AGENDA, pas du doublon sur soi-mÃªme)
  const ALL_FIELDS = ['fac1','fac2','fac3','fac4','traduction',
                      'helper1','helper2','helper3','helper4','angel'];
  const onOtherFields = new Set(
    ALL_FIELDS
      .filter(function(f) { return f !== excludeField; })
      .map(function(f) { return e[f]; })
      .filter(Boolean)
      .map(function(p) { return p.trim(); })
  );

  const result = {};

  // Marquer rouge les personnes dans les autres champs de l'atelier courant
  onOtherFields.forEach(function(p) { result[p] = 'red'; });

  AGENDA.forEach(function(a) {
    if (!a || !a.jour || a.jour !== e.jour) return;
    if (myId && a.id === myId) return; // exclure l'atelier courant
    const iv = parseInterval(a.heure);
    if (!iv) return;

    const overlaps = !(iv.s >= myIv.e || iv.e <= myIv.s);
    // Orange : atelier qui se termine dans les 90 min avant le dÃ©but
    //          OU qui commence dans les 90 min aprÃ¨s la fin
    const isNear = !overlaps && (
      (iv.e > myIv.s - BUFFER && iv.e <= myIv.s) ||
      (iv.s >= myIv.e          && iv.s < myIv.e + BUFFER)
    );

    if (!overlaps && !isNear) return;

    // Tous les rÃ´les sont pris en compte : animateur, helper, traducteur, angel
    const persons = [a.fac1, a.fac2, a.fac3, a.fac4,
                     a.helper1, a.helper2, a.helper3, a.helper4,
                     a.traduction, a.angel];
    persons.forEach(function(p) {
      if (!p || !p.trim()) return;
      const name = p.trim();
      if (overlaps) {
        result[name] = 'red';                          // chevauchement â†’ rouge (prioritÃ© max)
      } else if (isNear && result[name] !== 'red') {
        result[name] = 'orange';                       // proche â†’ orange
      }
    });
  });

  return result;
}

// Alias conservÃ© pour compatibilitÃ© avec les appels existants Ã©ventuels
function getBusyPersons() {
  const av = getAvailability();
  const busy = {};
  Object.keys(av).forEach(function(k){ if (av[k] === 'red') busy[k] = true; });
  return busy;
}

// Set des IDs de personnes ayant le rÃ´le "colibri" ou "Mi-Colibri" dans REF_RESSOURCES.
// RecalculÃ© une seule fois â€” utilisÃ© par buildPersonSelect pour afficher le logo ðŸ¦.
const _COLIBRI_IDS = (function() {
  const s = new Set();
  if (typeof REF_RESSOURCES !== 'undefined') {
    REF_RESSOURCES.forEach(function(r) {
      if (r.roles && (r.roles.indexOf('colibri') !== -1 || r.roles.indexOf('Mi-Colibri') !== -1)) {
        s.add(r.id);
      }
    });
  }
  return s;
})();

function buildPersonSelect(id, refArr, val, availMap) {
  // availMap : objet { nom: 'red' | 'orange' } â€” les absents sont 'green'
  // val : NOM ou ID de la ressource actuellement sÃ©lectionnÃ©e
  //       On accepte les deux formats pour la compatibilitÃ© avec data.js existant.
  const avail = availMap || {};

  // RÃ©soudre val en ID si c'est un nom (data.js stocke des noms)
  function resolveToId(v) {
    if (!v) return '';
    // DÃ©jÃ  un ID (commence par R_)
    if (v.startsWith('R_')) return v;
    // Chercher par value dans REF_RESSOURCES
    if (typeof REF_RESSOURCES !== 'undefined') {
      const r = REF_RESSOURCES.find(function(x){ return x.value === v; });
      if (r) return r.id;
    }
    return v; // inconnu â†’ retourner tel quel
  }

  // availMap est indexÃ© par NOM (depuis getAvailability) â€” construire un index par ID aussi
  const availById = {};
  if (typeof REF_RESSOURCES !== 'undefined') {
    REF_RESSOURCES.forEach(function(r) {
      if (avail[r.value] && !availById[r.id]) availById[r.id] = avail[r.value];
    });
  }
  Object.keys(avail).forEach(function(k) { if (!availById[k]) availById[k] = avail[k]; });

  const currentId = resolveToId(val);

  const getStatus = function(rid) {
    const v = availById[rid];
    if (v === 'red'    || v === true) return 'red';
    if (v === 'orange')               return 'orange';
    return 'green';
  };
  const opts = `<option value="">â€” aucun â€”</option>` +
    refArr.map(r => {
      const status    = getStatus(r.id);
      const isCurrent = r.id === currentId;
      const prefix    = status === 'red' ? 'ðŸ”´ ' : status === 'orange' ? 'ðŸŸ  ' : 'ðŸŸ¢ ';
      const colibri   = _COLIBRI_IDS.has(r.id) ? 'ðŸ¦ ' : '';
      const title     = status === 'red'    ? 'Non disponible â€” dÃ©jÃ  assignÃ© sur ce crÃ©neau'
                      : status === 'orange' ? 'Disponible â€” atelier dans les 90 min avant ou aprÃ¨s'
                      :                       'Disponible';
      // value = ID (stable), texte = nom affichÃ©
      return `<option value="${esc(r.id)}"${isCurrent ? ' selected' : ''} title="${title}">${prefix}${esc(r.value)}${colibri ? ' ðŸ¦' : ''}</option>`;
    }).join('');
  return `<select id="${id}" onchange="fieldChange('${id}')">${opts}</select>`;
}

// Cherche une entrÃ©e dans REF_DESCRIPTIONS :
//   1. D'abord par atelierId (robuste au renommage)
//   2. Fallback par nom (compatibilitÃ© avec les entrÃ©es sans ID)
function findDesc(atelierName, atelierId) {
  if (typeof REF_DESCRIPTIONS === 'undefined') return null;
  if (atelierId) {
    const byId = REF_DESCRIPTIONS.find(d => d.atelierId === atelierId);
    if (byId) return byId;
  }
  return REF_DESCRIPTIONS.find(d => (d.atelier||'').trim() === (atelierName||'').trim()) || null;
}

function escJs(v) {
  return (v||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r\n/g,'\\n').replace(/\r/g,'\\n').replace(/\n/g,'\\n');
}

function generateAtelierId(extraIds) {
  // extraIds : Set optionnel d'IDs dÃ©jÃ  rÃ©servÃ©s (ex: en cours de sÃ©rialisation)
  const used = extraIds || new Set();
  let id = '';
  do {
    id = 'A_' + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  } while (AGENDA.some(e => e.id === id) || used.has(id));
  return id;
}

function genererDataJs() {

  genererDataJs._lastTs = ts; // exposÃ© pour le polling post-sauvegarde

  const header =
`// @saved:${ts}
/**

 */

var AGENDA = [`;

/**

function agendaToRaw(entries) {

}`;
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// FUSION COLLABORATIVE data.js â€” SAUVEGARDE MULTI-UTILISATEURS
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
//
// StratÃ©gie "merge-before-write" :
//   1. RÃ©cupÃ©rer data.js FRAIS depuis l'API GitHub (jamais depuis le cache local)
//   2. Parser le contenu pour reconstruire la liste des ateliers tels qu'ils sont
//      sur GitHub EN CE MOMENT (= inclut les modifications d'autres utilisateurs)
//   3. Appliquer UNIQUEMENT les changements locaux (par ID) sur cette base fraÃ®che
//   4. Ã‰crire la version fusionnÃ©e â†’ les modifications des autres sont prÃ©servÃ©es
//
// RÃ©sultat : deux utilisateurs Ã©ditant des ateliers diffÃ©rents ne se gÃªnent plus.
//
// @param {Array}   changedEntries  â€” tableau d'objets {entry} Ã  upsert (par id)
// @param {Array}   [deletedIds]    â€” tableau d'IDs Ã  supprimer
// @returns {Promise<void>}

async function mergeAndSaveDataJs(changedEntries, deletedIds) {
  deletedIds = deletedIds || [];

  // â”€â”€ Ã‰tape 1 : rÃ©cupÃ©rer la version fraÃ®che de data.js depuis l'API GitHub â”€â”€
  // En local on ne fait pas la fusion (le serveur Python Ã©crit directement).
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (isLocal) {
    // En local, les conflits multi-utilisateurs ne se posent pas (un seul serveur).
    // On rÃ©gÃ©nÃ¨re depuis AGENDA local et on sauvegarde directement.
    return saveFile('data.js', genererDataJs());
  }

  var freshAgenda = null;
  try {
    const token = localStorage.getItem('tm_gh_token');
    const apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO +
                   '/contents/data.js?ref=' + GITHUB_BRANCH + '&_t=' + Date.now();
    const headers = { 'Accept': 'application/vnd.github+json', 'If-None-Match': '' };
    if (token) headers['Authorization'] = 'token ' + token;
    const res = await fetch(apiUrl, { headers: headers, cache: 'no-store' });
    if (res.ok) {
      const data    = await res.json();
      const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
      // Enregistrer le SHA frais pour que saveFile() ne lÃ¨ve pas de faux conflit
      if (data.sha && typeof githubRegisterLoadedSha === 'function') {
        githubRegisterLoadedSha('data.js', data.sha);
      }
      freshAgenda = parseDataJs(content);
    }
  } catch(_) { /* rÃ©seau indispo â†’ on tombe sur le fallback ci-dessous */ }

  if (!freshAgenda || !Array.isArray(freshAgenda)) {
    // Pas pu rÃ©cupÃ©rer la version fraÃ®che â†’ on sauvegarde depuis AGENDA local
    // (comportement dÃ©gradÃ© identique Ã  avant)
    console.warn('[mergeAndSave] Fallback : sauvegarde depuis AGENDA local (impossible de rÃ©cupÃ©rer data.js frais)');
    return saveFile('data.js', genererDataJs());
  }

  // â”€â”€ Ã‰tape 2 : fusionner les changements locaux sur la base fraÃ®che â”€â”€â”€â”€â”€â”€â”€â”€
  // Index par ID pour O(1)
  const freshById = {};
  freshAgenda.forEach(function(e, i) { if (e.id) freshById[e.id] = i; });

  // Upsert : pour chaque entrÃ©e modifiÃ©e localement, remplacer dans la base fraÃ®che
  changedEntries.forEach(function(entry) {
    if (!entry.id) return;
    if (freshById[entry.id] !== undefined) {
      freshAgenda[freshById[entry.id]] = entry; // mise Ã  jour
    } else {
      freshAgenda.push(entry); // nouvel atelier
    }
  });

  // Supprimer les IDs marquÃ©s pour suppression
  if (deletedIds.length) {
    const delSet = new Set(deletedIds);
    freshAgenda = freshAgenda.filter(function(e) { return !delSet.has(e.id); });
  }

  // â”€â”€ Ã‰tape 3 : regÃ©nÃ©rer data.js depuis la base fusionnÃ©e â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // On remplace temporairement AGENDA pour rÃ©utiliser genererDataJs() tel quel,
  // puis on restaure le tableau local.
  const savedAgenda = AGENDA.slice();
  AGENDA.length = 0;
  freshAgenda.forEach(function(e) { AGENDA.push(e); });
  const mergedContent = genererDataJs();
  AGENDA.length = 0;
  savedAgenda.forEach(function(e) { AGENDA.push(e); });

  // â”€â”€ Ã‰tape 4 : sauvegarder la version fusionnÃ©e â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  // skipConflictCheck = true : on vient de rÃ©cupÃ©rer le SHA frais Ã  l'Ã©tape 1,
  // inutile de refaire un GET â€” Ã©vite un double appel API et un faux conflit.
  await saveFile('data.js', mergedContent, { skipConflictCheck: true });
  console.log('[mergeAndSave] âœ… data.js fusionnÃ© (' + freshAgenda.length + ' ateliers)');
}

// â”€â”€ Parseur de data.js â€” reconstruit AGENDA[] sans eval() â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Extrait chaque objet littÃ©ral { id:"...", jour:"...", ... } du tableau AGENDA.
// StratÃ©gie : dÃ©couper le contenu entre [ et ] du tableau, puis extraire objet par objet
// en comptant les accolades (gÃ¨re les accolades imbriquÃ©es de _equipements/_corecSelected).
function parseDataJs(src) {
  // Extraire le contenu entre les crochets de var AGENDA = [ ... ]
  const arrMatch = src.match(/var\s+AGENDA\s*=\s*\[([\s\S]*?)\];\s*\n?\s*function/);
  if (!arrMatch) return null;
  const arrSrc = arrMatch[1];

  // DÃ©couper en objets { ... } en comptant les accolades
  const objects = [];
  let depth = 0, start = -1;
  for (let i = 0; i < arrSrc.length; i++) {
    if (arrSrc[i] === '{') { if (depth === 0) start = i; depth++; }
    else if (arrSrc[i] === '}') {
      depth--;
      if (depth === 0 && start !== -1) { objects.push(arrSrc.slice(start, i + 1)); start = -1; }
    }
  }

  // Extraire les champs de chaque objet
  function str(obj, key) {
    const m = obj.match(new RegExp(key + '\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    if (!m) return '';
    return m[1].replace(/\\n/g,'\n').replace(/\\"/g,'"').replace(/\\\\/g,'\\');
  }
  function num(obj, key) {
    const m = obj.match(new RegExp(key + '\\s*:\\s*(-?\\d+(?:\\.\\d+)?)'));
    return m ? parseFloat(m[1]) : 0;
  }
  function bool(obj, key) {
    const m = obj.match(new RegExp(key + '\\s*:\\s*(true|false)'));
    return m ? (m[1] === 'true') : false;
  }
  function json(obj, key) {
    // Extraire un sous-objet JSON { ... } aprÃ¨s la clÃ©
    const re = new RegExp(key + '\\s*:\\s*(\\{)');
    const km = obj.match(re);
    if (!km) return undefined;
    const kStart = obj.indexOf(km[0]) + km[0].length - 1;
    let d = 0, j = kStart;
    for (; j < obj.length; j++) {
      if (obj[j] === '{') d++;
      else if (obj[j] === '}') { d--; if (d === 0) break; }
    }
    try { return JSON.parse(obj.slice(kStart, j + 1)); } catch(_) { return undefined; }
  }

  return objects.map(function(obj) {
    const entry = {
      id:           str(obj, 'id'),
      jour:         str(obj, 'jour'),
      date:         str(obj, 'date'),
      heure:        str(obj, 'heure'),
      type:         str(obj, 'type'),
      atelier:      str(obj, 'atelier'),
      lieu:         str(obj, 'lieu'),
      fac1:         str(obj, 'fac1'),
      fac2:         str(obj, 'fac2'),
      fac3:         str(obj, 'fac3'),
      fac4:         str(obj, 'fac4'),
      traduction:   str(obj, 'traduction'),
      helper1:      str(obj, 'helper1'),
      helper2:      str(obj, 'helper2'),
      helper3:      str(obj, 'helper3'),
      helper4:      str(obj, 'helper4'),
      angel:        str(obj, 'angel'),
      note:         str(obj, 'note'),
      piment:       num(obj, 'piment'),
      colibri:      bool(obj, 'colibri'),
      logisticId:   str(obj, 'logisticId'),
      meetingRoles: str(obj, 'meetingRoles'),
    };
    // Champs optionnels structurÃ©s
    const minRes     = obj.match(/_minRes\s*:\s*(\d+)/);
    const minHelpers = obj.match(/_minHelpers\s*:\s*(\d+)/);
    const minTrad    = obj.match(/_minTrad\s*:\s*(\d+)/);
    const tradCounts = obj.match(/_tradCounts\s*:\s*(\d+)/);
    if (minRes)     entry._minRes     = parseInt(minRes[1], 10);
    if (minHelpers) entry._minHelpers = parseInt(minHelpers[1], 10);
    if (minTrad)    entry._minTrad    = parseInt(minTrad[1], 10);
    if (tradCounts) entry._tradCounts = parseInt(tradCounts[1], 10);
    const equip = json(obj, '_equipements');
    if (equip) entry._equipements = equip;
    const consDisabled = json(obj, '_consignesDisabled');
    if (consDisabled) entry._consignesDisabled = consDisabled;
    const corec = json(obj, '_corecSelected');
    if (corec) entry._corecSelected = corec;
    return entry;

function formatExportDate(dateStr) {
  if (!dateStr) return '';
  var match = String(dateStr).match(/(\d{1,2})\s+[A-Za-zÃ©Ã»\.]+\s+(\d{4})/);
  if (!match) return dateStr;
  var day = String(parseInt(match[1], 10)).padStart(2, '0');
  var year = match[2];
  var monthMap = {
    janvier:'01', fevrier:'02', fÃ©vrier:'02', mars:'03', avril:'04', mai:'05', juin:'06', juillet:'07',
    aout:'08', aoÃ»t:'08', septembre:'09', octobre:'10', novembre:'11', decembre:'12', dÃ©cembre:'12'
  };
  var monthKey = String(dateStr).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').match(/\d{1,2}\s+([a-z]+)\s+\d{4}/);
  var month = monthKey && monthMap[monthKey[1]] ? monthMap[monthKey[1]] : '';
  return month ? (day + '/' + month + '/' + year) : dateStr;
}

function getExportDateValue(entry) {
  var refJour = typeof REF_JOURS !== 'undefined'

  if (refJour && refJour.dateDdMmYyyy) return refJour.dateDdMmYyyy;
  return formatExportDate(entry.date || '');
}

async function downloadExcelFile(rows, filename) {
  var workbook = new ExcelJS.Workbook();
  var sheet = workbook.addWorksheet('Ateliers');
  var headers = [
    'ID','Atelier (FR)','Animateur 1','Animateur 2','Animateur 3','Animateur 4','Type','Date (DD/MM/YYYY)','Jour','Heure de dÃ©but','Heure de fin','Lieu','Piment','Note',
    'Workshop name (ENG)','Description (FR)','Description (ENG)','Instructions participants (FR)','Participant instructions (ENG)',
    'Estimation prÃ©paration','Informations logistiques','Besoins logistiques spÃ©cifiques','Consignes HELPER â€“ AVANT','Consignes HELPER â€“ PENDANT','Consignes HELPER â€“ APRES'
  ];
  var grayColumns = { 13:true, 15:true, 16:true, 17:true, 18:true, 19:true, 20:true, 21:true, 22:true, 23:true, 24:true, 25:true };
  var columnWidths = [12, 30, 24, 24, 24, 24, 18, 14, 12, 14, 14, 16, 10, 18, 28, 36, 36, 36, 36, 20, 40, 40, 30, 30, 30];

  sheet.addRow(headers);
  buildExcelRows(rows).forEach(function(values) {
    sheet.addRow(values);
  });

  sheet.columns.forEach(function(column, index) {
    column.width = columnWidths[index] || 18;
  });
 
  sheet.autoFilter = {
    from: { row: 1, column: 1 },
    to: { row: 1, column: headers.length }
  };
  sheet.views = [{ state: 'frozen', xSplit: 2, ySplit: 1 }];

  sheet.getRow(1).eachCell(function(cell) {
    cell.font = { bold: true };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9EAF7' } };
    cell.border = {
      right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
      bottom: { style: 'thin', color: { argb: 'FFD1D5DB' } }
    };
  });

  sheet.eachRow(function(row, rowNumber) {
    if (rowNumber === 1) return;
    var baseColor = rowNumber % 2 === 0 ? 'FFFFFFFF' : 'FFF3F4F6';
    row.eachCell(function(cell, colNumber) {
      var fillColor = grayColumns[colNumber] ? 'FFE5E7EB' : baseColor;
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fillColor } };
      cell.border = {
        right: { style: 'dotted', color: { argb: 'FF9CA3AF' } },
        bottom: { style: 'thin', color: { argb: 'FFE5E7EB' } }
      };
      cell.alignment = {
        vertical: 'top',
        wrapText: colNumber >= 13
      };
      if (colNumber === 6 && cell.value) {
        cell.numFmt = 'dd/mm/yyyy';
      }
    });
  });

  sheet.getColumn(6).eachCell(function(cell, rowNumber) {
    if (rowNumber === 1 || !cell.value) return;
    var parts = String(cell.value).split('/');
    if (parts.length === 3) {
      cell.value = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
      cell.numFmt = 'dd/mm/yyyy';
    }
  });

  var buffer = await workbook.xlsx.writeBuffer();
  var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function placeCursorAtEnd(el) {

// â”€â”€ GÃ‰NÃ‰RATION DE logistics.js â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function escJs(v) {
  return (v||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r\n/g,'\\n').replace(/\r/g,'\\n').replace(/\n/g,'\\n');
}

function genererLogisticsJs() {
  var keys    = Object.keys(LOG);
  var entries = keys.map(function(k) {
    var e = LOG[k];
    var prep = (typeof e.prepDuration === 'number') ? e.prepDuration : 15;
    return '  "' + escJs(k) + '": {\n' +
      '    html: "' + escJs(e.html || '') + '",\n' +
      '    text: "' + escJs(e.text || '') + '",\n' +
      '    validatedByFac: ' + (e.validatedByFac ? 'true' : 'false') + ',\n' +
      '    prepDuration: ' + prep + ',\n' +
      '    updatedAt: "' + escJs(e.updatedAt || '') + '"\n' +
      '  }';
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 â€” Informations Logistiques\n * ===========================================\n * Structure : LOGISTICS = { "<logisticId>": { html, text, validatedByFac, prepDuration, updatedAt } }\n */\n\nvar LOGISTICS = {\n\n' +
    entries + (entries ? '\n\n' : '') + '};\n';
}

function genererLogisticsSpecialJs() {
  var keys    = Object.keys(LOG_SPECIAL);
  var entries = keys.map(function(k) {
    var e = LOG_SPECIAL[k];
    return '  "' + escJs(k) + '": {\n' +
      '    html: "' + escJs(e.html || '') + '",\n' +
      '    text: "' + escJs(e.text || '') + '",\n' +
      '    updatedAt: "' + escJs(e.updatedAt || '') + '"\n' +
      '  }';
  }).join(',\n\n');
  return '/**\n * TANTRAMOUR 2026 â€” Informations Logistiques SpÃ©ciales (SupplÃ©mentaires)\n * =======================================================================\n * Structure : LOGISTICS_SPECIAL = { "<logisticId>": { html, text, updatedAt } }\n */\n\nvar LOGISTICS_SPECIAL = {\n\n' +
    entries + (entries ? '\n\n' : '') + '};\n';
}

// Toggle sÃ©lection d'un Ã©quipement au clic sur la boÃ®te

function toggleEqCat(catId) {
  var toggle = document.getElementById(catId + '-toggle');
  var body   = document.getElementById(catId + '-body');
  if (!toggle || !body) return;
  var isOpen = body.classList.contains('open');
  if (isOpen) {
    body.classList.remove('open');
    toggle.classList.remove('open');
  } else {
    body.classList.add('open');
    toggle.classList.add('open');
  }
}
window.toggleEqCat = toggleEqCat;

// Met Ã  jour le compteur d'une catÃ©gorie accordÃ©on aprÃ¨s un changement de sÃ©lection
function _refreshEqCatCount(itemEl) {
  var section = itemEl ? itemEl.closest('.eq-cat-section') : null;
  if (!section) return;
  var toggle = section.querySelector('.eq-cat-toggle');
  if (!toggle) return;
  var countEl = toggle.querySelector('.eq-cat-toggle-count');
  if (!countEl) return;
  var allItems  = section.querySelectorAll('.eq-item');
  var selItems  = section.querySelectorAll('.eq-item.selected');
  var total     = allItems.length;
  var selCount  = selItems.length;
  if (selCount > 0) {
    countEl.textContent = selCount + '/' + total + ' sÃ©lectionnÃ©' + (selCount > 1 ? 's' : '');
    countEl.classList.add('has-sel');
  } else {
    countEl.textContent = total + ' Ã©quipement' + (total > 1 ? 's' : '');
    countEl.classList.remove('has-sel');
  }
}

function eqToggle(eqId, itemEl) {
  if (!editedData) return;
  if (!editedData._equipements) editedData._equipements = {};
  var isSelected = itemEl.classList.contains('selected');
  if (isSelected) {
    // DÃ©sÃ©lectionner â†’ qty = 0
    delete editedData._equipements[eqId];
    itemEl.classList.remove('selected');
    var inp = itemEl.querySelector('.eq-qty');
    if (inp) inp.value = '0';
  } else {
    // SÃ©lectionner â†’ qty = 1 (si dÃ©jÃ  > 0, conserver)
    var current = editedData._equipements[eqId] || 0;
    var newQty = current > 0 ? current : 1;
    editedData._equipements[eqId] = newQty;
    itemEl.classList.add('selected');
    var inp = itemEl.querySelector('.eq-qty');
    if (inp) inp.value = String(newQty);
  }
  _refreshEqCatCount(itemEl);
}
window.eqToggle = eqToggle;

// Met Ã  jour la quantitÃ© d'un Ã©quipement et synchronise l'Ã©tat selected de la boÃ®te
function eqQtyChange(eqId, val, itemEl) {
  if (!editedData) return;
  if (!editedData._equipements) editedData._equipements = {};
  var qty = parseInt(val, 10) || 0;
  if (qty <= 0) {
    delete editedData._equipements[eqId];
    if (itemEl) itemEl.classList.remove('selected');
  } else {
    editedData._equipements[eqId] = qty;
    if (itemEl) itemEl.classList.add('selected');
  }
  _refreshEqCatCount(itemEl);
}
window.eqQtyChange = eqQtyChange;

// Ajouter un nouvel Ã©quipement â€” choix du fournisseur (type) + catÃ©gorie
async function eqDemandeAjouter() {
  var typeEl = document.getElementById('eq-new-type');
  var catEl  = document.getElementById('eq-new-cat');
  var nomEl  = document.getElementById('eq-new-nom');
  var descEl = document.getElementById('eq-new-desc');
  var qtyEl  = document.getElementById('eq-new-qty');
  var type   = (typeEl ? typeEl.value : 'Hameau');
  var cat    = (catEl  ? catEl.value  : 'Divers');
  var nom    = (nomEl  ? nomEl.value.trim()  : '');
  var desc   = (descEl ? descEl.value.trim() : '');
  var qty    = parseInt(qtyEl ? qtyEl.value : '1', 10) || 1;
  if (!nom) { showToast('âš ï¸ Le nom de l\'Ã©quipement est obligatoire', true); return; }

  // GÃ©nÃ©rer un ID numÃ©rique unique via generateEquipId()
  var newId = (typeof generateEquipId === 'function') ? generateEquipId() : Math.floor(100000 + Math.random() * 900000);

  var newEq = { type: type, categorie: cat, id: newId, value: nom, stock: 0, description: desc, remarque: '' };
  if (typeof REF_EQUIPEMENTS === 'undefined') window.REF_EQUIPEMENTS = [];
  REF_EQUIPEMENTS.push(newEq);

  // Enregistrer la quantitÃ© souhaitÃ©e sur l'atelier courant
  if (!editedData._equipements) editedData._equipements = {};
  if (qty > 0) editedData._equipements[newId] = qty;

  // Sauvegarder ref_equipements.js
  try {
    await saveFile('ref_equipements.js', genererRefEquipementsJs());
    showToast('âœ… Ã‰quipement ajoutÃ© et sauvegardÃ© !');
    renderEditor();
  } catch(err) {
    // Rollback en mÃ©moire
    REF_EQUIPEMENTS.pop();
    delete editedData._equipements[newId];
    showToast('âŒ Sauvegarde impossible : ' + err.message, true);
  }
}
window.eqDemandeAjouter = eqDemandeAjouter;

// GÃ©nÃ¨re le contenu de ref_equipements.js
function genererRefEquipementsJs() {
  var lines = (REF_EQUIPEMENTS || []).map(function(eq) {
    var stock = (eq.stock === 'N/A') ? '"N/A"' : (parseInt(eq.stock,10) || 0);
    var cat   = escJs(eq.categorie || 'Divers');
    var idVal = (typeof eq.id === 'number') ? eq.id : (isNaN(parseInt(eq.id)) ? ('"' + escJs(String(eq.id)) + '"') : parseInt(eq.id));
    return '  { type: "' + escJs(eq.type) + '", categorie: "' + cat + '", id: ' + idVal + ', value: "' + escJs(eq.value) + '", stock: ' + stock + ', description: "' + escJs(eq.description || '') + '", remarque: "' + escJs(eq.remarque || '') + '" }';
  });
  return '/**\n * TANTRAMOUR 2026 â€” RÃ©fÃ©rentiel : Ã‰quipements\n' +
    ' * Chaque entrÃ©e : { id, value, type, categorie, stock, description, remarque }\n' +
    ' *   value       : nom de l\'Ã©quipement\n' +
    ' *   type        : "Hameau" | "Tantramour" | "Animateur" | "Autre" (fournisseur)\n' +
    ' *   categorie   : nom de la catÃ©gorie â€” gÃ©rÃ© via ref_equip_cat.js (REF_EQUIP_CAT)\n' +
    ' *   stock       : nombre (0-1000) ou "N/A"\n' +
    ' *   description : texte libre\n' +
    ' *   remarque    : texte libre\n' +
    ' */\n' +
    'var REF_EQUIPEMENTS = [\n' + lines.join(',\n') + '\n];\n';
}
