<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantramour 2026 — Planning par Jour</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f7f8fa; --border: #e5e7eb;
    --text: #1f2328; --muted: #57606a; --accent: #3b82d4;
    --header-bg: #f0f4fb; --row-alt: #f7f8fa; --tag-bg: #eef2ff; --tag-text: #3b5bdb;
    --badge-h: #e0f2fe; --badge-ht: #0369a1;
    --badge-a: #fce7f3; --badge-at: #9d174d;
    --badge-f: #dcfce7; --badge-ft: #166534;
  }
  .dark {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --header-bg: #1c2333; --row-alt: #161b22; --tag-bg: #1c2a4a; --tag-text: #79a8ff;
    --badge-h: #0c2d48; --badge-ht: #58a6ff;
    --badge-a: #3b1030; --badge-at: #f0abca;
    --badge-f: #0a2e1a; --badge-ft: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,"Segoe UI",system-ui,sans-serif; font-size: 14px; line-height: 1.6; background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .logo { display: flex; flex-direction: column; }
  .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .logo p { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: .3px; line-height: 1.2; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mode-btn { cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 13px; color: var(--text); font-family: inherit; transition: background .15s; }
  .mode-btn:hover { background: var(--border); }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; align-items: flex-end; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; color: var(--text); font-family: inherit; min-width: 200px; cursor: pointer; }
  .stats { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .stats span { color: var(--accent); font-weight: 600; }
  /* ── TABLE VIEW ── */
  .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* Largeurs fixes — sans colonne Date, noms sur plusieurs lignes */
  col.c-jour   { width: 48px; }
  col.c-date   { width: 100px; }
  col.c-heure  { width: 108px; }
  col.c-type   { width: 118px; }
  col.c-atelier{ width: 190px; }
  col.c-piment { width: 42px; }
  col.c-lieu   { width: 76px; }
  col.c-fac    { width: 160px; }
  col.c-trad   { width: 90px; }
  col.c-helper { width: 180px; }
  col.c-angel  { width: 110px; }
  col.c-edit   { width: 30px; }
  thead th { background: var(--header-bg); padding: 7px 8px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 1; overflow: hidden; text-overflow: ellipsis; }
  thead th:hover { color: var(--accent); }
  thead th .sort-icon { display: inline-block; margin-left: 3px; opacity: .5; font-size: 9px; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-alt); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:nth-child(even):hover { filter: brightness(.97); }
  tbody tr.conflict-row { background: #fff0f3 !important; }
  tbody tr.conflict-row:hover { background: #ffe0e8 !important; }
  td { padding: 6px 8px; font-size: 12px; vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.td-wrap { white-space: normal; }
  /* Colonnes où les noms doivent pouvoir passer à la ligne */
  td.td-names { white-space: normal; overflow: visible; }
  td.td-names .pill { display: block; margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Colonne Piment — centrée */
  td.td-piment, th.th-piment { text-align: center; }
  td.conflict-cell { background: #fef08a !important; }
  td.conflict-cell .pill, td.conflict-cell span.pill { background: #fef08a !important; color: #b91c1c !important; font-weight: 700 !important; border: 1px solid #f59e0b; }
  td.conflict-cell-text { background: #fef08a !important; color: #b91c1c !important; font-weight: 700 !important; }
  /* ── CARD VIEW ── */
  .card-list { display: none; flex-direction: column; gap: 20px; }
  /* Groupe jour */
  .card-day-group { display: flex; flex-direction: column; gap: 8px; }
  .card-day-header { font-size: 15px; font-weight: 700; color: var(--text); padding: 10px 14px; background: var(--header-bg); border: 1px solid var(--border); border-radius: 10px; }
  .card-day-sub { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  /* Bloc de groupe visuel (par type) */
  .vg-block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .vg-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .vg-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); flex: 1; }
  .vg-angel { font-size: 11px; font-weight: 600; color: var(--badge-at); background: var(--badge-a); border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
  .vg-angel-tel { font-size: 10px; font-weight: 400; opacity: .8; }
  /* Rangée de mini-cartes */
  .vg-cards { display: flex; flex-direction: row; }
  .vg-cards .mini-card:not(:last-child) { border-right: 1px solid var(--border); }
  /* Mini-carte individuelle */
  .mini-card { flex: 1; min-width: 0; background: var(--bg); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .mini-card-heure { font-size: 11px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .mini-card-prep { font-size: 10px; color: var(--muted); }
  .mini-card-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .mini-card-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .mini-card-rows { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .mini-card-row { display: flex; gap: 5px; align-items: flex-start; }
  .mini-card-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); font-weight: 600; min-width: 58px; padding-top: 2px; flex-shrink: 0; }
  .mini-card-val { font-size: 11px; color: var(--text); flex: 1; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; line-height: 1.4; }
  /* Ligne discrète (repas, réunion, prépa) */
  .vg-small { padding: 4px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .vg-small-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .vg-small-items { font-size: 11px; color: var(--muted); }
  /* ── SHARED ── */
  .tag { display: inline-block; background: var(--tag-bg); color: var(--tag-text); border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; margin: 1px 2px; white-space: nowrap; }
  .pill-h { background: var(--badge-h); color: var(--badge-ht); }
  .pill-a { background: var(--badge-a); color: var(--badge-at); }
  .pill-f { background: var(--badge-f); color: var(--badge-ft); }
  .pill-t { background: var(--tag-bg); color: var(--tag-text); }
  .heure { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--muted); }
  /* ── RESPONSIVE AUTO-SWITCH ── */
  @media (max-width: 767px) {
    .wrap { padding: 16px 12px; }
    select { min-width: 100%; }
    .filters { gap: 10px; }
  }

  /* ── MODALE DÉTAIL (identique à Mon Planning V2) ── */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; }
  .modal-overlay.open { display:flex; }
  .modal-box { position:relative; background:var(--bg); border-radius:14px; max-width:680px; width:100%; border:1px solid var(--border); box-shadow:0 12px 40px rgba(0,0,0,.2); }
  .modal-top { display:flex; align-items:flex-start; justify-content:space-between; padding:18px 22px 14px; border-bottom:1px solid var(--border); gap:12px; }
  .modal-top-left { flex:1; min-width:0; }
  .modal-top-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; padding-top:28px; }
  .modal-atelier { font-size:18px; font-weight:800; line-height:1.3; }
  .modal-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .modal-close { position:absolute; top:18px; right:22px; cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:15px; font-weight:700; font-family:inherit; color:var(--text); line-height:1; }
  .modal-close:hover { background:var(--border); }
  .modal-lang-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .modal-lang-btn { cursor:pointer; background:var(--surface); border:none; padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit; color:var(--muted); }
  .modal-lang-btn:not(:last-child) { border-right:1px solid var(--border); }
  .modal-lang-btn.active { background:var(--accent); color:#fff; }
  .modal-body { padding:18px 22px 22px; display:flex; flex-direction:column; gap:20px; }
  .modal-grid { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:start; }
  .modal-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); white-space:nowrap; padding-top:2px; }
  .modal-val { font-size:13px; }
  .modal-desc-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.6; }
  .modal-desc-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:6px; }
  .no-content { font-style:italic; color:var(--muted); font-size:12px; }
  .validated-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; }
  .validated-yes { background:#dcfce7; color:#166534; }
  .validated-no  { background:#fee2e2; color:#dc2626; }
  .dark .validated-yes { background:#0a2e1a; color:#4ade80; }
  .dark .validated-no  { background:#2d0a0a; color:#f87171; }
  .piment-modal { letter-spacing:-2px; font-size:13px; }
  .badge-lang { font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; }
  .badge-fr { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
  .badge-en { background:#f0fdf4; color:#166534; border:1px solid #86efac; }
  @media(max-width:640px) {
    .modal-top { flex-direction:column; }
    .modal-top-right { flex-direction:row; align-items:center; }
  }
  /* ── BOUTON POSE MASSAGE ── */
  .btn-massage {
    display: inline-flex; align-items: center; gap: 5px;
    background: #d1fae5; color: #065f46; border: 1.5px solid #6ee7b7;
    border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s, border-color .15s;
    vertical-align: middle;
  }
  .btn-massage:hover { background: #a7f3d0; border-color: #34d399; }
  .btn-massage .sun-icon { font-size: 14px; }
  /* ── POPUP POSE MASSAGE ── */
  #pmOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 9998; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: 40px 16px;
  }
  #pmOverlay.open { display: flex; }
  #pmModal {
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 30px 28px; max-width: 520px; width: 92%;
    box-shadow: 0 8px 36px rgba(0,0,0,.18); font-family: inherit; position: relative;
    margin: auto; flex-shrink: 0;
  }
  #pmModal .pm-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  #pmModal .pm-sun { font-size: 28px; line-height: 1; }
  #pmModal .pm-title { font-size: 17px; font-weight: 700; color: var(--text); }
  #pmModal .pm-day { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  #pmModal .pm-body {
    font-size: 14px; color: var(--text); line-height: 1.75; white-space: pre-wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 18px; margin-bottom: 20px;
  }
  #pmModal .pm-close {
    display: block; width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: #d1fae5; color: #065f46; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .15s;
  }
  #pmModal .pm-close:hover { background: #a7f3d0; }
  #pmModal .pm-close-x {
    position: absolute; top: 14px; right: 16px; background: none; border: none;
    font-size: 18px; cursor: pointer; color: var(--muted); line-height: 1;
  }
  #pmModal .pm-close-x:hover { color: var(--text); }
</style>
<script src="ref_translations.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<!-- ── MODALE MOT DE PASSE ADMIN ── -->
<div id="editPwOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:36px 32px;max-width:340px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;">
    <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#57606a;margin-bottom:6px;">⚙️ Admin — Édition</p>
    <p style="font-size:17px;font-weight:700;color:#1f2328;margin-bottom:6px;" data-i18n="pw_acces_restreint">🔒 Accès restreint</p>
    <p style="font-size:13px;color:#57606a;margin-bottom:16px;" id="editPwAtelier"></p>
    <input id="editPwInput" type="password" placeholder="Mot de passe" autocomplete="off"
      style="width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:15px;outline:none;margin-bottom:8px;"
      onkeydown="if(event.key==='Enter')checkEditPw()" />
    <p id="editPwError" style="font-size:12px;color:#dc2626;min-height:18px;margin-bottom:12px;"></p>
    <div style="display:flex;gap:10px;">
      <button onclick="closeEditPw()" style="flex:1;padding:10px;border:1px solid #e5e7eb;border-radius:8px;background:#f7f8fa;font-size:14px;cursor:pointer;" data-i18n="pw_annuler">Annuler</button>
      <button onclick="checkEditPw()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#3b82d4;color:#fff;font-size:14px;font-weight:600;cursor:pointer;" data-i18n="pw_ouvrir">Ouvrir</button>
    </div>
  </div>
</div>

<!-- ── POPUP POSE MASSAGE ── -->
<div id="pmOverlay">
  <div id="pmModal" onclick="pmClose()">
    <button class="pm-close-x" onclick="event.stopPropagation();pmClose()" aria-label="Fermer">✕</button>
    <div class="pm-header">
      <div class="pm-sun">🌞</div>
      <div>
        <div class="pm-title" id="pmTitle">Pause Massage</div>
        <div class="pm-day" id="pmDay"></div>
      </div>
    </div>
    <div class="pm-body" id="pmBody"></div>
    <div style="display:flex;gap:10px;">
      <button class="pm-close" style="flex:1;" onclick="event.stopPropagation();pmClose()">Fermer</button>
      <button class="pm-lang-btn" onclick="event.stopPropagation();pmToggleLang()" style="flex:0 0 auto;padding:10px 16px;border:1px solid #6ee7b7;border-radius:8px;background:#f0fdf4;color:#065f46;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;">🌐 EN</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="logo">
      <h1>Tantramour 2026</h1>
      <p data-i18n="r1_title">Planning par Jour</p>
    </div>
    <div class="header-actions">
      <a class="mode-btn" href="index.html" data-i18n="nav_accueil">🏠 Accueil</a>
      <a class="mode-btn" href="index_bis.html" data-i18n="nav_dreamteam">🌀 DreamTeam</a>
      <a class="mode-btn" href="gestion_planning.html" data-i18n="nav_admin">⚙️ Admin</a>
      <button class="mode-btn" onclick="hardReload()">🔄 <span data-i18n="nav_refresh">Refresh</span></button>
      <button class="mode-btn" id="viewBtn" onclick="toggleView()">📱 <span data-i18n="nav_vue_mobile" id="viewBtnText">Vue Mobile</span></button>
      <button class="mode-btn" onclick="exportXlsx()">📥 <span data-i18n="nav_export_excel">Export Excel</span></button>
      <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙 <span data-i18n="nav_mode_nuit" id="modeBtnText">Mode Nuit</span></button>
      <button class="mode-btn tm-lang-btn" onclick="I18n.setLang(I18n.getLang()==='fr'?'en':'fr')">🌐 EN</button>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group">
      <label data-i18n="filter_jour_date">Jour / Date</label>
      <select id="filterJour" onchange="render()">
        <option value="" data-i18n="filter_tous_jours">Tous les jours</option>
        <option value="Jour 1" data-i18n="jour1_label">Jour 1 — Sam. 29 août</option>
        <option value="Jour 2" data-i18n="jour2_label">Jour 2 — Dim. 30 août</option>
        <option value="Jour 3" data-i18n="jour3_label">Jour 3 — Lun. 31 août</option>
        <option value="Jour 4" data-i18n="jour4_label">Jour 4 — Mar. 1 sept.</option>
        <option value="Jour 5" data-i18n="jour5_label">Jour 5 — Mer. 2 sept.</option>
        <option value="Jour 6" data-i18n="jour6_label">Jour 6 — Jeu. 3 sept.</option>
        <option value="Jour 7" data-i18n="jour7_label">Jour 7 — Ven. 4 sept.</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="filter_type_atelier">Type d'atelier</label>
      <select id="filterType" onchange="render()">
        <option value="" data-i18n="filter_tous_types">Tous les types</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="col_lieu">Lieu</label>
      <select id="filterLieu" onchange="render()">
        <option value="" data-i18n="filter_tous_lieux">Tous les lieux</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="filter_animateur">Animateur</label>
      <select id="filterFac" onchange="render()">
        <option value="" data-i18n="filter_tous_fac">Tous les animateurs</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="filter_traducteur">Traducteur</label>
      <select id="filterTrad" onchange="render()">
        <option value="" data-i18n="filter_tous_trad">Tous les traducteurs</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="filter_helper">Helper</label>
      <select id="filterHelper" onchange="render()">
        <option value="" data-i18n="filter_tous_helpers">Tous les helpers</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="col_angel">Angel</label>
      <select id="filterAngel" onchange="render()">
        <option value="" data-i18n="filter_tous_angels">Tous les angels</option>
      </select>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="table-wrap" id="tableView">
    <table id="mainTable">
      <colgroup>
        <col class="c-jour"><col class="c-date"><col class="c-heure">
        <col class="c-type"><col class="c-atelier"><col class="c-piment">
        <col class="c-lieu"><col class="c-fac"><col class="c-trad">
        <col class="c-helper"><col class="c-angel">
      </colgroup>
      <thead>
        <tr>

          <th onclick="sortBy(2)"><span data-i18n="col_heure">Heure</span><span class="sort-icon" id="si2">⇅</span></th>
          <th onclick="sortBy(3)"><span data-i18n="col_type">Type</span><span class="sort-icon" id="si3">⇅</span></th>

<script>
loadData(['data.js', 'logistics.js', 'ref_descriptions.js', 'logistics.helpers.js', 'logistics.special.js', 'ref_consignes_type.js', 'ref_consignes_recurrentes.js'], function() {
// RAW : chaque entrée est augmentée d'une propriété _idx = index dans AGENDA
const RAW = AGENDA.map((e, i) => {
  const r = [
    e.jour, e.date, e.heure, e.type, e.atelier, e.lieu,
    e.fac1, e.fac2, e.traduction,
    e.helper1, e.helper2, e.helper3, e.helper4 || '',
    e.angel, e.note, e.logisticId || '', e.piment || 0,
    e.fac3 || '', e.fac4 || ''
  ];
  r._idx = i; // index stable dans AGENDA
  return r;
});

// ─── Détection des conflits (même logique que Rapport4) ──────────────────────
function parseIntervalle(h) {
  if (!h) return null;
  const norm = h.replace(/\./g, ':').replace(/â€"|–|—/g, '-');
  const m = norm.match(/(\d{1,2}):(\d{2})\s*[-–—]+\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const debut = parseInt(m[1]) * 60 + parseInt(m[2]);
  let fin     = parseInt(m[3]) * 60 + parseInt(m[4]);
  if (fin <= debut) fin += 24 * 60;
  return [debut, fin];
}
function chevauche(a, b) { return a && b && a[0] < b[1] && b[0] < a[1]; }

// Retourne une Map : "atelier||jour" → Set de noms en conflit + leurs rôles
// et un Set de clés "atelier||jour" ayant au moins un conflit
function buildConflictIndex() {
  // parPersonne : nom → [{atelier, jour, heure, iv, role, field}]
  const parPersonne = new Map();
  AGENDA.forEach(e => {
    const iv = parseIntervalle(e.heure);
    if (!iv) return;
    const add = (nom, role, field) => {
      if (!nom) return;
      if (!parPersonne.has(nom)) parPersonne.set(nom, []);
      parPersonne.get(nom).push({ atelier: e.atelier, jour: e.jour, heure: e.heure, iv, role, field });
    };
    add(e.fac1,       'Animateur', 'fac1');
    add(e.fac2,       'Animateur', 'fac2');
    add(e.fac3,       'Animateur', 'fac3');
    add(e.fac4,       'Animateur', 'fac4');
    add(e.traduction, 'Traducteur',   'traduction');
    add(e.helper1,    'Helper',       'helper1');
    add(e.helper2,    'Helper',       'helper2');
    add(e.helper3,    'Helper',       'helper3');
    add(e.helper4,    'Helper',       'helper4');
    add(e.angel,      'Angel',        'angel');
  });

  // conflictFields : "atelier||jour" → Set de champs (fac1, helper2...) en conflit
  const conflictFields = new Map(); // clé → Set<field>

  parPersonne.forEach((slots, nom) => {
    const parJour = new Map();
    slots.forEach(s => {
      if (!parJour.has(s.jour)) parJour.set(s.jour, []);
      parJour.get(s.jour).push(s);
    });
    parJour.forEach(daySlots => {
      for (let i = 0; i < daySlots.length; i++) {
        for (let j = i + 1; j < daySlots.length; j++) {
          const a = daySlots[i], b = daySlots[j];
          if (a.role === 'Angel' && b.role === 'Angel') continue;
          if (chevauche(a.iv, b.iv)) {
            // Marquer les deux ateliers impliqués
            [[a.atelier, a.jour, a.field], [b.atelier, b.jour, b.field]].forEach(([at, jr, fld]) => {
              const k = `${at}||${jr}`;
              if (!conflictFields.has(k)) conflictFields.set(k, new Set());
              conflictFields.get(k).add(fld);
            });
          }
        }
      }
    });
  });

  return conflictFields;
}

const CONFLICT_INDEX = buildConflictIndex();

// ─── Set des animateurs anglophones ───────────────────────────────────────
const ANGLOPHONES = new Set(
  (typeof REF_RESSOURCES !== 'undefined' ? REF_RESSOURCES : [])
    .filter(r => r.roles && r.roles.indexOf('anglophone') !== -1)
    .map(r => r.value)
);
function isAnglophone(nom) { return nom && ANGLOPHONES.has(nom); }
function hasAnglophoneFac(r) { return isAnglophone(r[6]) || isAnglophone(r[7]); }

// Retourne le Set de champs en conflit pour une ligne RAW (ou null)
function getConflictFields(r) {
  const k = `${r[4]}||${r[0]}`; // atelier||jour
  return CONFLICT_INDEX.get(k) || null;
}

// Peupler le filtre Type
const types = [...new Set(RAW.map(r=>r[3]).filter(Boolean))].sort();
const selType = document.getElementById('filterType');
types.forEach(t => { const o=document.createElement('option'); o.value=t; o.text=t; selType.appendChild(o); });

// Peupler le filtre Lieu depuis REF_LIEUX (seulement les lieux présents dans les données)
const lieuxPresents = new Set(RAW.map(r=>r[5]).filter(Boolean));
const selLieu = document.getElementById('filterLieu');
REF_LIEUX.filter(l => lieuxPresents.has(l.value)).forEach(l => {
  const o=document.createElement('option'); o.value=l.value; o.text=l.label||l.value; selLieu.appendChild(o);
});

// Peupler le filtre Animateur depuis REF_ANIMATEURS (seulement ceux présents dans les données)
const facsPresents = new Set(RAW.flatMap(r=>[r[6],r[7]]).filter(Boolean));
const selFac = document.getElementById('filterFac');
REF_ANIMATEURS.filter(f => facsPresents.has(f.value)).forEach(f => {
  const o=document.createElement('option'); o.value=f.value; o.text=f.value; selFac.appendChild(o);
});

// Peupler le filtre Traducteur depuis REF_TRADUCTEURS (seulement ceux présents dans les données)
const tradsPresents = new Set(RAW.map(r=>r[8]).filter(Boolean));
const selTrad = document.getElementById('filterTrad');
REF_TRADUCTEURS.filter(t => tradsPresents.has(t.value)).forEach(t => {
  const o=document.createElement('option'); o.value=t.value; o.text=t.value; selTrad.appendChild(o);
});

// Peupler le filtre Helper depuis REF_HELPERS (seulement ceux présents dans les données)
const helpersPresents = new Set(RAW.flatMap(r=>[r[9],r[10],r[11],r[12]]).filter(Boolean));
const selHelper = document.getElementById('filterHelper');
REF_HELPERS.filter(h => helpersPresents.has(h.value)).forEach(h => {
  const o=document.createElement('option'); o.value=h.value; o.text=h.value; selHelper.appendChild(o);
});

// Peupler le filtre Angel depuis REF_ANGELS (seulement ceux présents dans les données)
const angelsPresents = new Set(RAW.map(r=>r[13]).filter(Boolean));
const selAngel = document.getElementById('filterAngel');
REF_ANGELS.filter(a => angelsPresents.has(a.value)).forEach(a => {
  const o=document.createElement('option'); o.value=a.value; o.text=a.value; selAngel.appendChild(o);
});

let sortCol = -1, sortAsc = true;

function getFiltered() {
  const j = document.getElementById('filterJour').value;
  const t = document.getElementById('filterType').value;
  const l = document.getElementById('filterLieu').value;
  const f = document.getElementById('filterFac').value;
  const tr = document.getElementById('filterTrad').value;
  const h = document.getElementById('filterHelper').value;
  const a = document.getElementById('filterAngel').value;
  return RAW.filter(r =>
    (!j  || r[0]===j) &&
    (!t  || r[3]===t) &&
    (!l  || r[5]===l) &&
    (!f  || r[6]===f || r[7]===f) &&
    (!tr || r[8]===tr) &&
    (!h  || r[9]===h || r[10]===h || r[11]===h || r[12]===h) &&
    (!a  || r[13]===a)
  );
}

function sortBy(col) {
  if(sortCol===col) sortAsc=!sortAsc; else { sortCol=col; sortAsc=true; }
  // Réinitialiser toutes les icônes de tri présentes dans le thead
  document.querySelectorAll('.sort-icon').forEach(el => {
    el.textContent = '⇅';
    el.parentElement.classList.remove('sorted');
  });
  const si=document.getElementById('si'+col);
  if(si){ si.textContent=sortAsc?'↑':'↓'; si.parentElement.classList.add('sorted'); }
  render();
}

function getVal(row, col) {
  switch(col){
    case 0: return row[0]; case 1: return row[1]; case 2: return row[2]; case 3: return row[3];
    case 4: return row[4]; case 5: return row[5];
    case 6: return [row[6],row[7]].filter(Boolean).join(' / ');
    case 7: return row[8];
    case 8: return [row[9],row[10],row[11]].filter(Boolean).join(' / ');
    case 9: return row[12];
    case 10: return String(row[15] || 0);
  }
  return '';
}

function pills(vals, cls) {
  return vals.filter(Boolean).map(v=>`<span class="pill ${cls}">${v}</span>`).join('');
}

let isMobileView = window.innerWidth < 768;

// Convertit une heure texte en minutes pour le tri (ex: "11:15 - 13:00" → 675)
// Les heures floues ("Matin", "APRES MIDI") sont renvoyées en fin de liste
function heureEnMinutes(h) {
  if (!h) return 9999;
  const norm = h.replace(/\./g, ':');
  const m = norm.match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 9999;
}

function render() {
  let data = getFiltered();
  if(sortCol>=0) {
    data = [...data].sort((a,b)=>{
      const av=getVal(a,sortCol)||'', bv=getVal(b,sortCol)||'';
      return sortAsc ? av.localeCompare(bv,'fr') : bv.localeCompare(av,'fr');
    });
  } else {
    // Tri par défaut : jour (ordre naturel) puis heure de début
    const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];
    data = [...data].sort((a,b) => {
      const dj = JOUR_ORDER.indexOf(a[0]) - JOUR_ORDER.indexOf(b[0]);
      return dj !== 0 ? dj : heureEnMinutes(a[2]) - heureEnMinutes(b[2]);
    });
  }
  const _filterJourVal = document.getElementById('filterJour').value;
  const _pmBtnStat = (!isMobileView && _filterJourVal) ? buildMassageBtn(_filterJourVal) : '';
  document.getElementById('stats').innerHTML = `<span>${data.length}</span> ${I18n.t('stats_ateliers')}${_pmBtnStat ? ' &nbsp;' + _pmBtnStat : ''}`;
  if (isMobileView) {
    renderCards(data);
  } else {
    renderTable(data);
  }
}

// Champs RAW → colonne tableau (index colonne → champ(s) de l'entrée AGENDA)
const COL_FIELDS = {
  6: ['fac1','fac2','fac3','fac4'],
  7: ['traduction'],
  8: ['helper1','helper2','helper3','helper4'],
  9: ['angel'],
};

function renderTable(data) {
  const tb = document.getElementById('tbody');
  if(!data.length) { tb.innerHTML=`<tr><td colspan="11" class="empty">Aucun résultat</td></tr>`; return; }
  tb.innerHTML = data.map(r => {
    const cf = getConflictFields(r);
    const rowCls = cf ? ' class="conflict-row"' : '';

    // Classe conflit sur une cellule td-names
    const ccNames = (colIdx) => {
      if (!cf) return ' class="td-names"';
      const fields = COL_FIELDS[colIdx] || [];
      return fields.some(f => cf.has(f)) ? ' class="td-names conflict-cell"' : ' class="td-names"';
    };

    // Pills avec wrapping vertical, conflit éventuel
    const pillsNames = (vals, fields, cls) => vals.map((v, i) => {
      if (!v) return '';
      const inConflict = cf && cf.has(fields[i]);
      return inConflict
        ? `<span class="pill ${cls}" style="background:#fef08a;color:#b91c1c;font-weight:700;border:1px solid #f59e0b">${v}</span>`
        : `<span class="pill ${cls}">${v}</span>`;
    }).join('');

    const piment = parseInt(r[16]) || 0;
    const pimentHtml = piment > 0 ? '🌶️'.repeat(piment) : '';

    const realIdx = r._idx !== undefined ? r._idx : 0;
    const enBadge = hasAnglophoneFac(r) ? '<span title="Atelier anglophone" style="font-size:11px;margin-left:5px">🇬🇧</span>' : '';

    // Traducteur avec conflit éventuel
    const tradHtml = r[8]
      ? `<span class="pill pill-t"${cf&&cf.has('traduction')?' style="background:#fef08a;color:#b91c1c;font-weight:700;border:1px solid #f59e0b"':''}>${r[8]}</span>`
      : '';

    // Angel avec conflit éventuel
    const angelHtml = r[13]
      ? `<span class="pill pill-a"${cf&&cf.has('angel')?' style="background:#fef08a;color:#b91c1c;font-weight:700;border:1px solid #f59e0b"':''}>${r[13]}</span>`
      : '';

    return `<tr${rowCls} style="cursor:pointer" onclick="openDetail(${realIdx})">
      <td>${r[0]||''}</td>
      <td>${r[1]||''}</td>
      <td class="heure">${r[2]||''}</td>
      <td><span class="tag" style="font-size:10px">${r[3]||''}</span></td>
      <td class="td-wrap">${r[4]||''}${enBadge}${r[14]?'<span style="color:#e53e3e;font-weight:700;margin-left:3px">*</span>':''}</td>
      <td class="td-piment">${pimentHtml}</td>
      <td>${r[5]||''}</td>
      <td${ccNames(6)}>${pillsNames([r[6],r[7],r[17],r[18]],['fac1','fac2','fac3','fac4'],'pill-f')}</td>
      <td class="td-names">${tradHtml}</td>
      <td${ccNames(8)}>${pillsNames([r[9],r[10],r[11],r[12]],['helper1','helper2','helper3','helper4'],'pill-h')}</td>
      <td class="td-names">${angelHtml}</td>
    </tr>`;
  }).join('');
}

// Extrait l'heure de début pour trier (ex: "9:45 - 11:00" → 9*60+45=585)
function parseHeure(h) {
  if (!h) return 9999;
  const m = h.match(/(\d+)[:.h](\d+)/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : 9999;
}

// Convertit une heure texte "H:MM" en minutes depuis minuit pour les calculs
function heureMinutes(h) {
  if (!h) return null;
  const m = String(h).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : null;
}
// Formate un nombre de minutes en "H:MM"
function minutesToHeure(mins) {
  if (mins == null || mins < 0) return '';
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return h + ':' + (m < 10 ? '0' : '') + m;
}

// ── Lookup téléphone d'un angel depuis REF_RESSOURCES ──────────────────────
function angelTel(nom) {
  if (!nom || typeof REF_RESSOURCES === 'undefined') return '';
  const r = REF_RESSOURCES.find(x => x.value === nom);
  return (r && r.tel) ? r.tel : '';
}

// ── Construit une mini-carte atelier ───────────────────────────────────────
function buildMiniCard(r) {
  const enBadge = hasAnglophoneFac(r) ? ' <span title="Anglophone" style="font-size:11px">🇬🇧</span>' : '';
  const lieu    = r[5] ? `<span class="tag" style="font-size:10px">${r[5]}</span>` : '';
  const facs    = pills([r[6],r[7]],'pill-f');
  const trad    = r[8]  ? `<span class="pill pill-t">${r[8]}</span>` : '';
  const helpers = pills([r[9],r[10],r[11],r[12]],'pill-h');

  // Heure + prep
  const logId  = r[15];
  const logE   = logId && typeof LOGISTICS !== 'undefined' ? LOGISTICS[logId] : null;
  const prepMin = logE && logE.prepDuration != null ? logE.prepDuration : null;
  const debut   = heureMinutes(r[2]);
  const arrivee = (debut !== null && prepMin !== null) ? minutesToHeure(debut - prepMin) : '';
  const heureHtml = r[2] ? `<div class="mini-card-heure">${r[2]}${prepMin !== null ? `<span class="mini-card-prep"> ⏱${prepMin}mn${arrivee?' ↑'+arrivee:''}</span>` : ''}</div>` : '';

  const rows = [];
  if (facs)    rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Fac.</span><span class="mini-card-val">${facs}</span></div>`);
  if (trad)    rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Trad.</span><span class="mini-card-val">${trad}</span></div>`);
  if (helpers) rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Helpers</span><span class="mini-card-val">${helpers}</span></div>`);
  if (r[14])   rows.push(`<div class="mini-card-row"><span class="mini-card-lbl">Note</span><span class="mini-card-val" style="color:#e53e3e;font-size:10px">${r[14]}</span></div>`);

  const realIdx = r._idx !== undefined ? r._idx : 0;
  return `<div class="mini-card" style="cursor:pointer" onclick="openDetail(${realIdx})">
    ${heureHtml}
    <div class="mini-card-title">${r[4]||'—'}${enBadge}</div>
    <div class="mini-card-meta">${lieu}</div>
    ${rows.length ? `<div class="mini-card-rows">${rows.join('')}</div>` : ''}
  </div>`;
}

// ── Construit un bloc visuel (header + rangée de mini-cartes) ──────────────
function buildVgBlock(title, items, angelRow) {
  const angelHtml = angelRow
    ? `<span class="vg-angel">👼 ${angelRow.nom}${angelRow.tel ? `<span class="vg-angel-tel"> · ${angelRow.tel}</span>` : ''}</span>`
    : '';
  return `<div class="vg-block">
    <div class="vg-header"><span class="vg-title">${title}</span>${angelHtml}</div>
    <div class="vg-cards">${items.map(buildMiniCard).join('')}</div>
  </div>`;
}

// ── Construit une ligne discrète (repas, réunion d'équipe, prépa) ──────────
function buildSmallLine(emoji, label, items) {
  const txt = items.map(r => r[4]).filter(Boolean).join(' · ');
  return `<div class="vg-small"><span class="vg-small-lbl">${emoji} ${label}</span><span class="vg-small-items">${txt||'—'}</span></div>`;
}

function renderCards(data) {
  const cv = document.getElementById('cardView');
  if (!data.length) { cv.innerHTML=`<div class="empty">Aucun résultat</div>`; return; }

  const DAY_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];

  // Grouper par jour
  const dayMap = new Map();
  data.forEach(r => {
    if (!dayMap.has(r[0])) dayMap.set(r[0], { jour: r[0], date: r[1], items: [] });
    dayMap.get(r[0]).items.push(r);
  });
  dayMap.forEach(g => g.items.sort((a,b) => parseHeure(a[2]) - parseHeure(b[2])));
  const groups = DAY_ORDER.filter(j => dayMap.has(j)).map(j => dayMap.get(j));

  // ── Ordre des groupes visuels ────────────────────────────────────────────
  // Chaque entrée : { key, types[], label, mode }
  //   mode = 'cards'  → mini-cartes côte à côte (avec angel)
  //   mode = 'small'  → ligne discrète
  //   mode = 'group'  → regroupe plusieurs types en petite ligne (prepa+rassemblement)
  const VG_ORDER = [
    { key:'yoga',        types:['MEDITATION / YOGA'],                                    label:'🧘 Méditation / Yoga',          mode:'cards'  },
    { key:'ptdej',       types:['REPAS & PAUSE'],         heureMax: 11*60,               label:'Petit déjeuner',                mode:'small'  },
    { key:'reunion_am',  types:["REUNION D'EQUIPE"],      heureMax: 11*60,               label:'Réunion d\'équipe',             mode:'small'  },
    { key:'prepa_rass',  types:['PREPA & LOGISTICS','RASSEMBLEMENT'], heureMax: 12*60,   label:'🎯 Préparation & Rassemblement', mode:'cards'  },
    { key:'tantra_am',   types:['ATELIERS TANTRA (Matin)','TANTRA CAFE & CONFERENCE'],   label:'🌀 Ateliers Tantra – Matin',    mode:'cards', withAngel:'AM' },
    { key:'art_am',      types:['ATELIER ARTISTIQUE (Matin)','TANTRA CAFE & CONFERENCE'],label:'🎨 Ateliers Artistiques – Matin',mode:'cards', withAngel:'AM' },
    { key:'dejeuner',    types:['REPAS & PAUSE'],         heureMin: 11*60, heureMax:15*60,label:'Déjeuner',                     mode:'small'  },
    { key:'support',     types:['SUPPORT EMOTIONNEL'],                                   label:'💙 Support Émotionnel',         mode:'cards'  },
    { key:'pool_cafe_am',types:['DJ Set','POOL PARTY','TANTRA CAFE & CONFERENCE'], heureMin:12*60, heureMax:16*60, label:'Pool Party / Tantra Café', mode:'cards' },
    { key:'tantra_pm',   types:['ATELIERS TANTRA (Apres-Midi)','TANTRA CAFE & CONFERENCE'], heureMin:14*60, label:'🌀 Ateliers Tantra – Après-midi', mode:'cards', withAngel:'PM' },
    { key:'art_pm',      types:['ATELIER ARTISTIQUE (Apres-Midi)','TANTRA CAFE & CONFERENCE'], heureMin:14*60, label:'🎨 Ateliers Artistiques – Après-midi', mode:'cards', withAngel:'PM' },
    { key:'gouter_dinner',types:['REPAS & PAUSE'],        heureMin: 15*60,               label:'Dîner / Goûter',               mode:'small'  },
    { key:'prepa_soir',  types:['PREPA & LOGISTICS'],     heureMin: 18*60,               label:'Prépa & Logistique – Soir',    mode:'small'  },
    { key:'reunion_pm',  types:["REUNION D'EQUIPE"],      heureMin: 11*60,               label:'Réunion d\'équipe',            mode:'small'  },
    { key:'soir',        types:['CEREMONIE & CONCERT','LOVE TEMPLE','DJ Set','POOL PARTY'], heureMin:18*60, label:'🌙 Soirée', mode:'cards'  },
  ];

  cv.innerHTML = groups.map(g => {
    const items = g.items;

    // Index les SHIFT ANGEL par shift (AM / PM / Soir)
    const angelByShift = {};
    items.filter(r => r[3] === 'SHIFT ANGEL').forEach(r => {
      const atName = (r[4]||'').toLowerCase();
      const shift  = atName.includes('matin') || atName.includes('am')  ? 'AM'
                   : atName.includes('pm')    || atName.includes('midi') || atName.includes('apr') ? 'PM'
                   : 'Soir';
      if (!angelByShift[shift] && r[13]) {
        angelByShift[shift] = { nom: r[13], tel: angelTel(r[13]) };
      }
    });

    // Tracker pour ne pas afficher deux fois le même atelier
    const used = new Set();
    const markUsed = arr => arr.forEach(r => used.add(r));

    // Filtre selon types + fenêtre horaire + non-déjà-utilisé
    const pick = (types, opts) => {
      opts = opts || {};
      return items.filter(r => {
        if (used.has(r)) return false;
        if (!types.includes(r[3])) return false;
        const hm = heureMinutes(r[2]) ?? 9999;
        if (opts.heureMin !== undefined && hm < opts.heureMin) return false;
        if (opts.heureMax !== undefined && hm >= opts.heureMax) return false;
        return true;
      });
    };

    const blocks = [];

    VG_ORDER.forEach(vg => {
      const rows = pick(vg.types, vg);
      if (!rows.length) return;
      markUsed(rows);

      if (vg.mode === 'small') {
        blocks.push(buildSmallLine('', vg.label, rows));
      } else {
        const angel = vg.withAngel ? (angelByShift[vg.withAngel] || null) : null;
        blocks.push(buildVgBlock(vg.label, rows, angel));
      }
    });

    // Résidus non capturés → un bloc générique
    const leftover = items.filter(r => !used.has(r) && r[3] !== 'SHIFT ANGEL');
    if (leftover.length) {
      blocks.push(buildVgBlock('Autres', leftover, null));
    }

    const nb = items.filter(r => r[3] !== 'SHIFT ANGEL').length;
    // Bouton Pause Massage pour ce jour
    const pmBtn = buildMassageBtn(g.jour);
    return `<div class="card-day-group">
      <div class="card-day-header" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">${g.jour}<span class="card-day-sub"> — ${g.date}</span><span class="card-day-sub"> (${nb} atelier${nb>1?'s':''})</span>${pmBtn}</div>
      ${blocks.join('')}
    </div>`;
  }).join('');
}

// Cherche l'entrée Pause Massage pour un jour donné (value = "Jour 1", etc.)
function pmFindEntry(jourValue) {
  if (typeof REF_PAUSE_MASSAGE === 'undefined' || !REF_PAUSE_MASSAGE) return null;
  if (typeof REF_JOURS === 'undefined') return null;
  // Trouver l'id REF_JOURS correspondant à la value du jour
  const jourDef = REF_JOURS.find(j => j.value === jourValue);
  if (!jourDef) return null;
  // Chercher une entrée spécifique à ce jour, puis une entrée "tous les jours"
  return REF_PAUSE_MASSAGE.find(p => p.actif !== false && p.jourId === jourDef.id)
      || REF_PAUSE_MASSAGE.find(p => p.actif !== false && !p.jourId);
}

// Construit le bouton HTML pour un jour — renvoie '' si pas de donnée active
function buildMassageBtn(jourValue) {
  const entry = pmFindEntry(jourValue);
  if (!entry) return '';
  const lang = (typeof I18n !== 'undefined') ? I18n.getLang() : 'fr';
  const label = lang === 'en' ? 'Massage Break' : 'Pause Massage';
  return `<button class="btn-massage" onclick="pmOpen('${jourValue.replace(/'/g,"\\'")}')"><span class="sun-icon">🌞</span>${label}</button>`;
}

// Ouvre la popup
function pmOpen(jourValue) {
  const entry = pmFindEntry(jourValue);
  if (!entry) return;
  const lang = (typeof I18n !== 'undefined') ? I18n.getLang() : 'fr';
  const title = lang === 'en' ? 'Massage Break' : 'Pause Massage';
  const body  = lang === 'en' ? (entry.textEn || entry.textFr || '') : (entry.textFr || entry.textEn || '');
  // Label jour
  const jourDef = (typeof REF_JOURS !== 'undefined') ? REF_JOURS.find(j => j.value === jourValue) : null;
  const dayLabel = jourDef ? jourDef.label : jourValue;
  document.getElementById('pmTitle').textContent = title;
  document.getElementById('pmDay').textContent   = dayLabel;
  document.getElementById('pmBody').textContent  = body;
  document.getElementById('pmOverlay').classList.add('open');
}
window.pmOpen = pmOpen;

function pmClose() {
  document.getElementById('pmOverlay').classList.remove('open');
}
window.pmClose = pmClose;

// Fermer en cliquant sur le fond
document.getElementById('pmOverlay').addEventListener('click', function(e) {

// EXPORT XLSX (SpreadsheetML — pur navigateur)
// ════════════════════════════════════════════════
function exportXlsx() {
  // ── Données filtrées triées comme à l'écran ──────────────────────────────
  let data = getFiltered();
  const JOUR_ORDER = ['Jour 1','Jour 2','Jour 3','Jour 4','Jour 5','Jour 6','Jour 7'];
  data = [...data].sort((a, b) => {
    const dj = JOUR_ORDER.indexOf(a[0]) - JOUR_ORDER.indexOf(b[0]);
    return dj !== 0 ? dj : heureEnMinutes(a[2]) - heureEnMinutes(b[2]);
  });

  // ── Colonnes ────────────────────────────────────────────────────────────
  const HEADERS = ['Jour','Date','Heure','Type','Atelier','Piment','Lieu',
                   'Animateur 1','Animateur 2','Animateur 3','Animateur 4','Traducteur',
                   'Helper 1','Helper 2','Helper 3','Helper 4','Angel','Note'];

  // ── Helpers XML ─────────────────────────────────────────────────────────
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  // Convertit un numéro de colonne (0-based) en lettre(s) Excel : 0→A, 25→Z, 26→AA
  function colLetter(n) {
    let s = '';
    n++;
    while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
    return s;
  }

  function cellRef(col, row) { return colLetter(col) + row; }

  // Cellule texte
  function cellS(col, row, val) {
    return `<c r="${cellRef(col, row)}" t="inlineStr"><is><t>${esc(val)}</t></is></c>`;
  }

  // ── Construction des lignes XML ──────────────────────────────────────────
  let rowsXml = '';

  // En-tête (ligne 1)
  rowsXml += `<row r="1">`;
  HEADERS.forEach((h, ci) => { rowsXml += cellS(ci, 1, h); });
  rowsXml += `</row>`;

  // Données (à partir de la ligne 2)
  data.forEach((r, ri) => {
    const rowNum = ri + 2;
    // r = [jour, date, heure, type, atelier, lieu, fac1, fac2, trad, h1, h2, h3, h4, angel, note, logisticId, piment, fac3, fac4]
    const vals = [r[0],r[1],r[2],r[3],r[4], r[16]||0, r[5],r[6],r[7],r[17]||'',r[18]||'',r[8],r[9],r[10],r[11],r[12],r[13],r[14]];
    rowsXml += `<row r="${rowNum}">`;
    vals.forEach((v, ci) => { rowsXml += cellS(ci, rowNum, v == null ? '' : v); });
    rowsXml += `</row>`;
  });

  // ── Calcul des largeurs de colonnes ─────────────────────────────────────
  const colWidths = HEADERS.map((h, ci) => {
    const maxLen = data.reduce((m, r) => {
      const vals = [r[0],r[1],r[2],r[3],r[4], r[16]||0, r[5],r[6],r[7],r[8],r[9],r[10],r[11],r[12],r[13],r[14]];
      return Math.max(m, String(vals[ci] == null ? '' : vals[ci]).length);
    }, h.length);
    return Math.min(Math.max(maxLen + 2, 10), 60);
  });
  const colsXml = colWidths.map((w, ci) =>
    `<col min="${ci+1}" max="${ci+1}" width="${w}" customWidth="1"/>`
  ).join('');

  // ── Assemblage du fichier XLSX (ZIP SpreadsheetML minimal) ───────────────
  // Nom de fichier reflétant les filtres actifs
  const fj  = document.getElementById('filterJour').value;
  const ft  = document.getElementById('filterType').value;
  const fileName = ['TantramourAgenda', fj||'TousJours', ft||''].filter(Boolean).join('_') + '.xlsx';

  // Contenu des fichiers internes du ZIP XLSX
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
  <cols>${colsXml}</cols>
  <sheetData>${rowsXml}</sheetData>
  <autoFilter ref="A1:${colLetter(HEADERS.length - 1)}1"/>
</worksheet>`;

  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets><sheet name="Agenda" sheetId="1" r:id="rId1"/></sheets>
</workbook>`;

  const relsWorkbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`;

  const relsRoot = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`;

  // ── Construction du ZIP en JavaScript pur ────────────────────────────────
  // Implémentation minimale du format ZIP (Local File Header + Central Directory)
  function strToBytes(str) {
    const enc = new TextEncoder();
    return enc.encode(str);
  }

  function crc32(bytes) {
    const table = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c;
      }
      return t;
    })();
    let crc = 0xFFFFFFFF;
    for (const b of bytes) crc = table[(crc ^ b) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function uint16LE(n) { return [n & 0xFF, (n >> 8) & 0xFF]; }
  function uint32LE(n) { return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF]; }

  function makeZipEntry(name, content) {
    const nameBytes    = strToBytes(name);
    const contentBytes = strToBytes(content);
    const crc          = crc32(contentBytes);
    const size         = contentBytes.length;
    const date = 0x5765; // 2026-xx-xx (valeur arbitraire)
    const time = 0x0000;

    // Local file header
    const localHeader = [
      0x50, 0x4B, 0x03, 0x04,   // signature
      ...uint16LE(20),           // version needed
      ...uint16LE(0),            // flags
      ...uint16LE(0),            // compression (stored)
      ...uint16LE(time),
      ...uint16LE(date),
      ...uint32LE(crc),
      ...uint32LE(size),
      ...uint32LE(size),
      ...uint16LE(nameBytes.length),
      ...uint16LE(0),            // extra length
      ...nameBytes,
    ];

    return {
      name, nameBytes, crc, size, date, time,
      localOffset: 0, // sera rempli lors de l'assemblage
      localHeader: new Uint8Array(localHeader),
      content: contentBytes,
    };
  }

  function buildZip(entries) {
    // Calculer les offsets
    let offset = 0;
    entries.forEach(e => {
      e.localOffset = offset;
      offset += e.localHeader.length + e.content.length;
    });

    const centralDirOffset = offset;

    // Central directory entries
    const centralParts = entries.map(e => {
      const cd = [
        0x50, 0x4B, 0x01, 0x02,
        ...uint16LE(20), ...uint16LE(20),
        ...uint16LE(0), ...uint16LE(0),
        ...uint16LE(e.time), ...uint16LE(e.date),
        ...uint32LE(e.crc),
        ...uint32LE(e.size), ...uint32LE(e.size),
        ...uint16LE(e.nameBytes.length),
        ...uint16LE(0), ...uint16LE(0),
        ...uint16LE(0), ...uint16LE(0),
        ...uint32LE(0),
        ...uint32LE(e.localOffset),
        ...e.nameBytes,
      ];
      return new Uint8Array(cd);
    });

    const centralDirSize = centralParts.reduce((s, p) => s + p.length, 0);

    // End of central directory
    const eocd = new Uint8Array([
      0x50, 0x4B, 0x05, 0x06,
      ...uint16LE(0), ...uint16LE(0),
      ...uint16LE(entries.length), ...uint16LE(entries.length),
      ...uint32LE(centralDirSize),
      ...uint32LE(centralDirOffset),
      ...uint16LE(0),
    ]);

    // Assembler tout
    const totalSize = offset + centralDirSize + eocd.length;
    const buf = new Uint8Array(totalSize);
    let pos = 0;
    entries.forEach(e => {
      buf.set(e.localHeader, pos); pos += e.localHeader.length;
      buf.set(e.content, pos);     pos += e.content.length;
    });
    centralParts.forEach(p => { buf.set(p, pos); pos += p.length; });
    buf.set(eocd, pos);
    return buf;
  }

  // ── Assembler les fichiers du XLSX ───────────────────────────────────────
  const entries = [
    makeZipEntry('[Content_Types].xml',          contentTypes),
    makeZipEntry('_rels/.rels',                   relsRoot),
    makeZipEntry('xl/workbook.xml',               workbookXml),
    makeZipEntry('xl/_rels/workbook.xml.rels',    relsWorkbook),
    makeZipEntry('xl/worksheets/sheet1.xml',      sheetXml),
  ];

  const zipBytes = buildZip(entries);

  // ── Téléchargement ───────────────────────────────────────────────────────
  const blob = new Blob([zipBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var _modalLang  = 'fr';
var _modalEntry = null;

function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function _lieuLabel(lieu) {
  if (!lieu) return '—';
  if (typeof REF_LIEUX !== 'undefined') {
    var r = REF_LIEUX.find(function(l) { return l.value === lieu; });
    if (r && r.capacite) return _esc(lieu) + ' <span style="color:var(--muted);font-size:11px">(' + r.capacite + ')</span>';
  }
  return _esc(lieu);
}
function _calcDuree(h) {
  if (!h) return null;
  var m = String(h).replace(/\./g,':').replace(/[–—]/g,'-').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  var d = (parseInt(m[3])*60+parseInt(m[4])) - (parseInt(m[1])*60+parseInt(m[2]));
  if (d < 0) d += 1440;
  return d;
}
function _heureMin2(h) {
  if (!h) return null;
  var m = String(h).replace(/\./g,':').match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1])*60+parseInt(m[2]) : null;
}
function _fmtDuree(mins) {
  if (!mins) return '';
  var h = Math.floor(mins/60), mn = mins%60;
  return h > 0 ? (mn > 0 ? h+'h'+(mn<10?'0':'')+mn : h+'h') : mn+'min';
}
function _fmtHeure2(mins) {
  if (mins == null) return '';
  var h = Math.floor(mins/60)%24, m = mins%60;
  return h+':'+(m<10?'0':'')+m;
}
function _noteLabel(val, lang) {
  if (!val) return '';
  if (typeof REF_NOTES !== 'undefined') {
    var e = REF_NOTES.find(function(n) { return n.value===val; });
    if (e) return (lang==='en' && e.valueEn) ? e.valueEn : e.value;
  }
  return val;
}
function _pimentHtml(n) {
  return n > 0 ? '<span class="piment-modal">'+'🌶️'.repeat(n)+'</span>' : '';
}
function _isBilingue2(id) {
  if (!id || typeof REF_RESSOURCES==='undefined') return false;
  var r = REF_RESSOURCES.find(function(x) { return x.id===id; });
  return r && r.langues && r.langues.indexOf('FR')!==-1 && r.langues.indexOf('EN')!==-1;
}
function _angelWithPhone(id) {
  if (!id) return '—';
  var nom = resolveName(id);
  if (typeof REF_RESSOURCES === 'undefined') return _esc(nom);
  var r = REF_RESSOURCES.find(function(x) { return x.id===id; });
  if (!r || !r.tel) return _esc(nom);
  return _esc(nom) + ' <span style="color:var(--muted)">(' + _esc(r.tel) + ')</span>';
}

var JOUR_META_MODAL = {
  'Jour 1': { jourEn:'Day 1', date:'Samedi 29 août',   dateEn:'Saturday Aug 29' },
  'Jour 2': { jourEn:'Day 2', date:'Dimanche 30 août', dateEn:'Sunday Aug 30'   },
  'Jour 3': { jourEn:'Day 3', date:'Lundi 31 août',    dateEn:'Monday Aug 31'   },
  'Jour 4': { jourEn:'Day 4', date:'Mardi 1 sept.',    dateEn:'Tuesday Sep 1'   },
  'Jour 5': { jourEn:'Day 5', date:'Mercredi 2 sept.', dateEn:'Wednesday Sep 2' },
  'Jour 6': { jourEn:'Day 6', date:'Jeudi 3 sept.',    dateEn:'Thursday Sep 3'  },
  'Jour 7': { jourEn:'Day 7', date:'Vendredi 4 sept.', dateEn:'Friday Sep 4'    },
};
function _jourSubtitle(jour, lang) {
  var m = JOUR_META_MODAL[jour];
  if (!m) return jour;
  var j = (lang==='en' && m.jourEn) ? m.jourEn : jour;
  var d = (lang==='en' && m.dateEn) ? m.dateEn : m.date;
  return j + (d ? ' — ' + d : '');
}

window.setModalLang = function(lang) {
  _modalLang = lang;
  document.getElementById('mlBtnFr').classList.toggle('active', lang==='fr');
  document.getElementById('mlBtnEn').classList.toggle('active', lang==='en');
  if (_modalEntry) {
    document.getElementById('mSub').textContent = _jourSubtitle(_modalEntry.jour, lang);
    var _d = (typeof REF_DESCRIPTIONS!=='undefined')
      ? ((_modalEntry.id && REF_DESCRIPTIONS.find(function(d) { return d.atelierId===_modalEntry.id; })) ||
         REF_DESCRIPTIONS.find(function(d) { return d.atelier && d.atelier.trim()===(_modalEntry.atelier||'').trim(); }))
      : null;
    var pm = parseInt(_modalEntry.piment)||0;
    var titleFr = _modalEntry.atelier||'—';
    var titleEn = (_d && _d.nomEn && _d.nomEn.trim()) ? _d.nomEn.trim() : titleFr;
    document.getElementById('mTitle').innerHTML = _esc(lang==='en' ? titleEn : titleFr) + (pm ? ' '+_pimentHtml(pm) : '');
  }
  _renderModalBody();
};

window.openDetail = function(agendaIdx) {
  var e = AGENDA[agendaIdx];
  if (!e) return;
  _modalEntry = e;
  _modalLang = (typeof I18n!=='undefined') ? I18n.getLang() : 'fr';
  document.getElementById('mlBtnFr').classList.toggle('active', _modalLang==='fr');
  document.getElementById('mlBtnEn').classList.toggle('active', _modalLang==='en');
  var pm = parseInt(e.piment)||0;
  var _descInit = (typeof REF_DESCRIPTIONS!=='undefined')
    ? ((e.id && REF_DESCRIPTIONS.find(function(d) { return d.atelierId===e.id; })) ||
       REF_DESCRIPTIONS.find(function(d) { return d.atelier && d.atelier.trim()===(e.atelier||'').trim(); }))
    : null;
  var _titleFr = e.atelier||'—';
  var _titleEn = (_descInit && _descInit.nomEn && _descInit.nomEn.trim()) ? _descInit.nomEn.trim() : _titleFr;
  document.getElementById('mTitle').innerHTML = _esc(_modalLang==='en' ? _titleEn : _titleFr) + (pm ? ' '+_pimentHtml(pm) : '');
  document.getElementById('mSub').textContent = _jourSubtitle(e.jour, _modalLang);
  _renderModalBody();
  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

window.closeModal = function() {
  document.getElementById('detailModal').classList.remove('open');
  document.body.style.overflow = '';
};
window.closeModalOnOverlay = function(ev) {
  if (ev.target === document.getElementById('detailModal')) closeModal();
};
document.addEventListener('keydown', function(ev) {
  if (ev.key==='Escape') closeModal();
});

(function() {
  var box = document.getElementById('detailBox');
  var startX = 0, startY = 0;
  box.addEventListener('touchstart', function(ev) {
    startX = ev.touches[0].clientX; startY = ev.touches[0].clientY;
  }, { passive:true });
  box.addEventListener('touchend', function(ev) {
    var dx = ev.changedTouches[0].clientX - startX;
    var dy = ev.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) closeModal();
  }, { passive:true });
})();

function _renderModalBody() {
  var e    = _modalEntry;
  var lang = _modalLang;
  if (!e) return;

  var logId = e.logisticId || '';
  var logE  = logId && typeof LOGISTICS!=='undefined' ? LOGISTICS[logId] : null;
  var logH  = logId && typeof LOGISTICS_HELPERS!=='undefined' ? LOGISTICS_HELPERS[logId] : null;
  var logS  = logId && typeof LOGISTICS_SPECIAL!=='undefined' ? LOGISTICS_SPECIAL[logId] : null;
  var desc  = (typeof REF_DESCRIPTIONS!=='undefined')
    ? ((e.id && REF_DESCRIPTIONS.find(function(d) { return d.atelierId===e.id; })) ||
       REF_DESCRIPTIONS.find(function(d) { return d.atelier && d.atelier.trim()===(e.atelier||'').trim(); }))
    : null;

  var dur     = _calcDuree(e.heure);
  var prep    = (logE && logE.prepDuration  != null) ? logE.prepDuration  : 15;
  var range   = (logE && logE.rangeDuration != null) ? logE.rangeDuration : 0;
  var debut   = _heureMin2(e.heure);
  var arrivee = (debut!==null) ? _fmtHeure2(debut-prep) : '';

  var facs    = [e.fac1,e.fac2,e.fac3,e.fac4].filter(Boolean).map(function(id){return resolveName(id);});
  var helpers = [e.helper1,e.helper2,e.helper3,e.helper4].filter(Boolean).map(function(id){return resolveName(id);});
  var hasBilingue = _isBilingue2(e.fac1) || _isBilingue2(e.fac2) || _isBilingue2(e.fac3) || _isBilingue2(e.fac4);
  var langBadge = (e.traduction || hasBilingue)
    ? '<span class="badge-lang badge-en">FR / EN</span>'
    : '<span class="badge-lang badge-fr">FR</span>';

  var noteVal       = e.note ? _noteLabel(e.note, lang) : '';
  var nomAtelierVal = _esc((lang==='en' && desc && desc.nomEn && desc.nomEn.trim()) ? desc.nomEn.trim() : (e.atelier||'—')) + ' ' + langBadge;
  var typeVal       = e.type ? _esc(e.type) : '—';
  var jourDate      = _jourSubtitle(e.jour, lang);
  var horaireVal    = _esc(e.heure||'—') + (dur ? ' <span style="color:var(--muted);font-size:11px">('+_fmtDuree(dur)+')</span>' : '');

  var rows1 = [];
  rows1.push(['🧘 '+(lang==='en'?'Workshop (FR/ENG)':'Nom atelier (FR/ENG)'), nomAtelierVal]);
  rows1.push(['🏷 '+(lang==='en'?'Type':'Type'), typeVal]);
  rows1.push(['📅 '+(lang==='en'?'Day - Date':'Jour - Date'), jourDate]);
  rows1.push(['🕐 '+(lang==='en'?'Schedule':'Horaire'), horaireVal]);
  if (arrivee) rows1.push(['⏰ '+(lang==='en'?'Arrive at':'Arrivée'), '<strong style="color:#dc2626">'+arrivee+'</strong>']);
  rows1.push(['📍 '+(lang==='en'?'Venue':'Lieu'), e.lieu ? _lieuLabel(e.lieu) : '—']);
  rows1.push(['🎓 '+(lang==='en'?'Teacher(s)':'Animateur(s)'), facs.length ? facs.map(_esc).join(' &amp; ') : '—']);
  rows1.push(['🙌 '+(lang==='en'?'Helper(s)':'Helper(s)'), helpers.length ? helpers.map(_esc).join(', ') : '—']);
  rows1.push(['🌐 '+(lang==='en'?'Translator':'Traducteur'), e.traduction ? _esc(resolveName(e.traduction)) : '—']);
  rows1.push(['👼 Angel', _angelWithPhone(e.angel)]);
  rows1.push(['🏷 Note', noteVal ? _esc(noteVal) : '—']);

  var gridHtml1 = rows1.map(function(r) { return '<div class="modal-lbl">'+r[0]+'</div><div class="modal-val">'+r[1]+'</div>'; }).join('');

  var noTxt = '<span class="no-content">—</span>';
  var dark  = document.body.classList.contains('dark');

  var descTxt = (lang==='en' && desc && desc.descEn && desc.descEn.trim())
    ? desc.descEn : (desc && desc.descFr && desc.descFr.trim() ? desc.descFr : '');
  var consigneTxt = (lang==='en' && desc && desc.consigneEn && desc.consigneEn.trim())
    ? desc.consigneEn : (desc && desc.consigne && desc.consigne.trim() ? desc.consigne : '');
  var consigneLabel = lang==='en' ? '⚠️ Participant instructions' : '⚠️ Instructions participants';

  var _disabled = e._consignesDisabled || {};
  function _consignesTypeBlock(placement) {
    if (typeof REF_CONSIGNES_TYPE === 'undefined') return '';
    var items = REF_CONSIGNES_TYPE.filter(function(c) {
      if (c.actif === false) return false;
      if (_disabled[c.id]) return false;
      if (!c.placements || c.placements.indexOf(placement) === -1) return false;
      if (c.types && c.types.length > 0 && e.type && c.types.indexOf(e.type) === -1) return false;
      return true;
    });
    if (!items.length) return '';
    var html = '';
    items.forEach(function(c) {
      var txt = (lang==='en' && c.valueEn && c.valueEn.trim()) ? c.valueEn : c.valueFr;
      if (txt) html += _esc(txt).replace(/\n/g,'<br>') + '<br>';
    });
    return html ? '<span style="color:#92400e;font-size:13px;">'+html+'</span>' : '';
  }

  var _corecSel = e._corecSelected || {};
  function _consignesRecurrentesBlock(placement) {
    if (typeof REF_CONSIGNES_RECURRENTES === 'undefined') return '';
    var selectedIds = (_corecSel[placement] || []);
    if (!selectedIds.length) return '';
    var items = REF_CONSIGNES_RECURRENTES.filter(function(c) { return c.actif !== false && selectedIds.indexOf(c.id) !== -1; });
    if (!items.length) return '';
    var html = '';
    items.forEach(function(c) {
      var txt = (lang==='en' && c.valueEn && c.valueEn.trim()) ? c.valueEn : c.valueFr;
      if (txt) html += _esc(txt).replace(/\n/g,'<br>') + '<br>';
    });
    return html ? '<span style="color:#166534;font-size:13px;">'+html+'</span>' : '';
  }

  var S_INFO   = dark ? 'background:#2d2500;border:2px solid #92400e;border-radius:12px;padding:16px 18px;margin-bottom:0' : 'background:#fefce8;border:2px solid #fde68a;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_INFO_TL = dark ? 'color:#fcd34d' : 'color:#854d0e';
  var S_LOG    = dark ? 'background:#052e16;border:2px solid #16a34a;border-radius:12px;padding:16px 18px;margin-bottom:0' : 'background:#f0fdf4;border:2px solid #4ade80;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_LOG_TL  = dark ? 'color:#4ade80' : 'color:#166534';
  var S_SPEC   = dark ? 'background:#1a0533;border:2px solid #9333ea;border-radius:12px;padding:16px 18px;margin-bottom:0' : 'background:#faf5ff;border:2px solid #c084fc;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_SPEC_TL = dark ? 'color:#c084fc' : 'color:#7e22ce';
  var S_EQ     = dark ? 'background:#042f2e;border:2px solid #0d9488;border-radius:12px;padding:16px 18px;margin-bottom:0' : 'background:#f0fdfa;border:2px solid #2dd4bf;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_EQ_TL   = dark ? 'color:#2dd4bf' : 'color:#0f766e';
  var S_HELP   = dark ? 'background:#0c1a40;border:2px solid #2563eb;border-radius:12px;padding:16px 18px;margin-bottom:0' : 'background:#eff6ff;border:2px solid #3b82f6;border-radius:12px;padding:16px 18px;margin-bottom:0';
  var S_HELP_TL = dark ? 'color:#60a5fa' : 'color:#1d4ed8';

  var titleStyle = 'font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;padding-bottom:8px;margin-bottom:14px;border-bottom:2px solid;';

  // Bloc 1) Informations générales
  var sec1 = '<div style="'+S_INFO+'">'+
    '<div style="'+titleStyle+S_INFO_TL+';border-bottom-color:'+(dark?'#92400e':'#fde68a')+'">'+
      '1) '+(lang==='en'?'General information':'Informations générales')+
    '</div>'+
    '<div class="modal-grid">'+gridHtml1+'</div>'+
    '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">'+
      '<div class="modal-desc-box" style="border-color:'+(dark?'#92400e':'#fcd34d')+';background:'+(dark?'#2d2006':'#fffbeb')+'">'+
        '<div class="modal-desc-lbl" style="color:#92400e">'+consigneLabel+'</div>'+
        _consignesRecurrentesBlock('Participant')+
        _consignesTypeBlock('Participant')+
        '<div>'+(consigneTxt ? _esc(consigneTxt).replace(/\n/g,'<br>') : noTxt)+'</div>'+
      '</div>'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'Description':'Description atelier')+'</div>'+
        '<div>'+(descTxt ? _esc(descTxt).replace(/\n/g,'<br>') : noTxt)+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  // Bloc 2) Informations logistiques
  var isDefaultPrep = !(logE && logE.prepDuration != null);
  var prepVal = prep+' min'+
    (isDefaultPrep ? ' <span style="font-size:10px;color:var(--muted);font-style:italic;">'+(lang==='en'?'(default)':'(défaut)')+'</span>' : '')+
    (arrivee ? ' &rarr; '+(lang==='en'?'arrival':'arrivée')+' <strong style="color:#dc2626">'+arrivee+'</strong>' : '');

  var validBadge = logE
    ? (logE.validatedByFac
        ? '<span class="validated-badge validated-yes">&#10003; '+(lang==='en'?'Validated by teacher':'Validé par animateur')+'</span>'
        : '<span class="validated-badge validated-no">&#8987; '+(lang==='en'?'Not yet validated':'Non encore validé')+'</span>')
    : '<span class="validated-badge validated-no">&#8987; '+(lang==='en'?'Not yet validated':'Non encore validé')+'</span>';

  var updatedAt  = logE && logE.updatedAt ? logE.updatedAt : (logH && logH.updatedAt ? logH.updatedAt : '');
  var avantTxt   = logH && logH.avant   && logH.avant.trim().replace(/<[^>]*>/g,'').trim()   ? logH.avant   : '';
  var pendantTxt = logH && logH.pendant && logH.pendant.trim().replace(/<[^>]*>/g,'').trim() ? logH.pendant : '';
  var apresTxt   = logH && logH.apres   && logH.apres.trim().replace(/<[^>]*>/g,'').trim()   ? logH.apres   : '';
  var logInfoTxt = logE && logE.html && logE.html.trim() ? logE.html : '';
  var logSpecTxt = logS && logS.html && logS.html.trim().replace(/<[^>]*>/g,'').trim() ? logS.html : '';

  var sec_log = '<div style="'+S_LOG+'">'+
    '<div style="'+titleStyle+S_LOG_TL+';border-bottom-color:'+(dark?'#16a34a':'#4ade80')+'">'+
      '2) '+(lang==='en'?'Logistics information':'Informations logistiques')+
    '</div>'+
    '<div class="modal-grid" style="margin-bottom:10px">'+
      '<div class="modal-lbl" style="white-space:nowrap">'+(lang==='en'?'Preparation':'Préparation')+'</div>'+
      '<div class="modal-val" style="white-space:nowrap">'+prepVal+'</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'Logistics info':'Informations logistiques')+'</div>'+
        '<div style="color:#1d4ed8;font-weight:700">'+(logInfoTxt ? logInfoTxt : noTxt)+'</div>'+
        _consignesRecurrentesBlock('Logistique')+
        _consignesTypeBlock('Logistique')+
      '</div>'+
    '</div>'+
  '</div>';

  // Bloc 3) Besoins logistiques spécifiques
  var sec_spec = '<div style="'+S_SPEC+'">'+
    '<div style="'+titleStyle+S_SPEC_TL+';border-bottom-color:'+(dark?'#9333ea':'#c084fc')+'">'+
      '3) '+(lang==='en'?'Specific logistics needs':'Besoins logistiques spécifiques')+
    '</div>'+
    '<div style="color:#1d4ed8;font-weight:700">'+(logSpecTxt ? logSpecTxt : noTxt)+'</div>'+
    _consignesRecurrentesBlock('Spécifique')+
    _consignesTypeBlock('Spécifique')+
  '</div>';

  // Bloc 4) Équipements
  var eqAgenda = e._equipements || {};
  var eqLogist = (logId && logE && logE._equipements) || {};
  var eqAll    = Object.assign({}, eqLogist, eqAgenda);
  var eqKeys   = Object.keys(eqAll).filter(function(k) { return eqAll[k] > 0; });
  var sec_eq;
  if (!eqKeys.length) {
    sec_eq = '<div style="'+S_EQ+'">'+
      '<div style="'+titleStyle+S_EQ_TL+';border-bottom-color:'+(dark?'#0d9488':'#2dd4bf')+'">'+
        '4) '+(lang==='en'?'Equipment':'Équipements')+
      '</div>'+
      '<span style="font-size:13px;color:var(--muted)">—</span>'+
    '</div>';
  } else {
    var TYPE_ORDER_EQ = ['Hameau','Tantramour','Animateur'];
    var catRefOrder = (typeof REF_EQUIP_CAT !== 'undefined')
      ? REF_EQUIP_CAT.slice().sort(function(a,b) { return (parseInt(a.ordre)||0)-(parseInt(b.ordre)||0); }).map(function(c) { return c.value; })
      : [];
    var byCat = {};
    eqKeys.forEach(function(eqId) {
      var ref  = (typeof REF_EQUIPEMENTS !== 'undefined') ? REF_EQUIPEMENTS.find(function(r) { return r.id===eqId; }) : null;
      var type = (ref && ref.type) || 'Autre';
      var cat  = (ref && ref.categorie) || 'Divers';
      var nom  = (ref && ref.value) || eqId;
      if (!byCat[cat]) byCat[cat] = {};
      if (!byCat[cat][type]) byCat[cat][type] = [];
      byCat[cat][type].push(nom+' ('+eqAll[eqId]+')');
    });
    var orderedCats = catRefOrder.filter(function(c) { return byCat[c]; })
      .concat(Object.keys(byCat).filter(function(c) { return catRefOrder.indexOf(c)===-1; }).sort());
    var eqHtml = '';
    orderedCats.forEach(function(cat) {
      eqHtml += '<div style="margin-bottom:8px;">';
      eqHtml += '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;">• '+_esc(cat)+' :</div>';
      var knownTypes = TYPE_ORDER_EQ.filter(function(t) { return byCat[cat][t]; });
      var otherTypes = Object.keys(byCat[cat]).filter(function(t) { return TYPE_ORDER_EQ.indexOf(t)===-1; }).sort();
      knownTypes.concat(otherTypes).forEach(function(type) {
        eqHtml += '<div style="margin-left:12px;margin-bottom:3px;">';
        eqHtml += '<span style="font-size:12px;font-weight:600;color:'+(dark?'#2dd4bf':'#0f766e')+'">'+_esc(type)+' : </span>';
        eqHtml += '<span style="font-size:13px;color:var(--text)">'+byCat[cat][type].join(' ; ')+'</span>';
        eqHtml += '</div>';
      });
      eqHtml += '</div>';
    });
    sec_eq = '<div style="'+S_EQ+'">'+
      '<div style="'+titleStyle+S_EQ_TL+';border-bottom-color:'+(dark?'#0d9488':'#2dd4bf')+'">'+
        '4) '+(lang==='en'?'Equipment':'Équipements')+
      '</div>'+eqHtml+
    '</div>';
  }

  // Bloc 5) Consignes helpers
  var sec_help = '<div style="'+S_HELP+'">'+
    '<div style="'+titleStyle+S_HELP_TL+';border-bottom-color:'+(dark?'#2563eb':'#3b82f6')+'">'+
      '5) '+(lang==='en'?'Helper instructions':'Consignes helpers')+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'To do before':'À faire avant')+'</div>'+
        '<div style="color:#1d4ed8;font-weight:700">'+(avantTxt ? avantTxt : noTxt)+'</div>'+
        _consignesRecurrentesBlock('Avant')+
        _consignesTypeBlock('Avant')+
      '</div>'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'To do during':'À faire pendant')+'</div>'+
        '<div style="color:#1d4ed8;font-weight:700">'+(pendantTxt ? pendantTxt : noTxt)+'</div>'+
        _consignesRecurrentesBlock('Pendant')+
        _consignesTypeBlock('Pendant')+
      '</div>'+
      '<div class="modal-desc-box">'+
        '<div class="modal-desc-lbl">'+(lang==='en'?'To do after':'À faire après')+'</div>'+
        (range > 0 ? '<div style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:3px 8px;margin-bottom:6px;">🧹 '+(lang==='en'?'Tidying up':'Rangement')+' : <strong style="color:var(--text)">'+range+' min</strong></div>' : '')+
        '<div style="color:#1d4ed8;font-weight:700">'+(apresTxt ? apresTxt : noTxt)+'</div>'+
        _consignesRecurrentesBlock('Après')+
        _consignesTypeBlock('Après')+
      '</div>'+
    '</div>'+
  '</div>';

  // Pied : validé + dernière modif
  var sec_footer =
    '<div style="padding:10px 4px 2px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;">'+
      validBadge+
      '<div style="font-size:11px;color:var(--muted)">'+(lang==='en'?'Last updated':'Dernière modification')+' : '+(updatedAt ? _esc(updatedAt) : '—')+'</div>'+
    '</div>';

  document.getElementById('mBody').innerHTML =
    '<div style="display:flex;flex-direction:column;gap:14px">'+
      sec1 + sec_log + sec_spec + sec_eq + sec_help + sec_footer +
    '</div>';
}
